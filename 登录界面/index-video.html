<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AION · 身份接入（视频版）</title>
<style>
:root{
  --g:#3dff8f;
  --g-rgb:61,255,143;
  --ink:#e4fff0;
  --ink-dim:rgba(217,255,233,.55);
  --warn:#ff5d73;
  --mono:"JetBrains Mono","SF Mono","Cascadia Mono",Consolas,"Roboto Mono",Menlo,monospace;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- 舞台：手机竖屏 ---------- */
.app{position:relative;width:min(100vw,480px,56.25vh);height:100vh;overflow:hidden;background:#000;
  isolation:isolate;container-type:inline-size;-webkit-user-select:none;user-select:none}
@supports (height:100dvh){.app{width:min(100vw,480px,56.25dvh);height:100dvh}}

/* ---------- 视频层（9:16 盒子，顶部对齐；更高的屏幕下方留黑） ---------- */
.vwrap{position:absolute;left:0;top:0;width:100%;aspect-ratio:9/16;z-index:1;pointer-events:none}
.vwrap::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12%;background:linear-gradient(rgba(0,0,0,0),#000)}
.vclip{position:absolute;inset:0;clip-path:inset(0 0 100% 0)}
.vclip.revealing{animation:reveal 1.7s cubic-bezier(.55,0,.3,1) forwards,vholo 1.8s ease-out}
.vclip.revealing.fast{animation-duration:.8s,1s}
.vclip.shown{clip-path:none;animation:none}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes vholo{0%{filter:brightness(1.9) saturate(1.5) contrast(1.15)}100%{filter:none}}
.vid,.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s ease}
.vid.on,.fallback.on{opacity:1}
.scanbar{position:absolute;left:0;right:0;top:0;height:2px;background:#eafff3;opacity:0;
  box-shadow:0 0 10px 2px var(--g),0 0 40px 10px rgba(var(--g-rgb),.35)}
.scanbar::before{content:"";position:absolute;left:0;right:0;bottom:2px;height:90px;
  background:linear-gradient(to top,rgba(var(--g-rgb),.28),transparent)}
.scanbar.run{animation:scanbar 1.7s cubic-bezier(.55,0,.3,1) forwards}
.scanbar.run.fast{animation-duration:.8s}
@keyframes scanbar{0%{top:0;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.app.glitch .vwrap{animation:jit .34s steps(2)}
@keyframes jit{0%{transform:none}25%{transform:translate(-5px,1px)}50%{transform:translate(4px,-1px)}75%{transform:translate(-2px,0)}100%{transform:none}}

.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rain{z-index:2;mix-blend-mode:screen;opacity:0;transition:opacity 1.5s}
#rain.on{opacity:.8}
.shade{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,5,3,.5) 32%,rgba(0,4,2,.86) 62%,#000 100%)}
.shade.on{opacity:1}
.fx-scan{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:.4;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.fx-vig{position:absolute;inset:0;z-index:20;pointer-events:none;
  background:radial-gradient(ellipse 90% 75% at 55% 38%,transparent 60%,rgba(0,0,0,.5) 100%)}

/* ---------- 启动遮罩（浏览器禁止带声音自动播放时出现） ---------- */
.gate{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:#000;cursor:pointer;opacity:0;transition:opacity .5s}
.gate[hidden]{display:none}
.gate.on{opacity:1}
.gate svg{width:88px;height:88px;overflow:visible}
.gate .r1{fill:none;stroke:rgba(var(--g-rgb),.4);stroke-width:1;stroke-dasharray:1.5 4.5;transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.gate .r2{fill:none;stroke:var(--g);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.gate .pw{fill:none;stroke:var(--g);stroke-width:2.6;stroke-linecap:round}
.gate-t{font:500 11px/1 var(--mono);letter-spacing:.42em;margin-right:-.42em;color:var(--g);text-shadow:0 0 8px rgba(var(--g-rgb),.8);animation:breathe 2.2s ease-in-out infinite}
.gate-cn{font:400 12px/1 var(--sans);letter-spacing:.42em;margin-right:-.42em;color:var(--ink-dim)}
@keyframes breathe{50%{opacity:.35}}

/* ---------- 顶部 HUD ---------- */
.hud-top{position:absolute;z-index:25;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--st) + 12px) 14px 0;font:500 9.5px/1 var(--mono);letter-spacing:.16em;color:rgba(var(--g-rgb),.9);
  opacity:0;transform:translateY(-6px);transition:opacity .8s,transform .8s;pointer-events:none;text-shadow:0 0 6px rgba(var(--g-rgb),.6)}
.hud-top.on{opacity:1;transform:none}
.hud-top .l,.hud-top .r{display:flex;align-items:center;gap:9px}
.hud-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn);animation:blink 1.4s steps(2) infinite}
.app.granted .hud-dot{background:var(--g);box-shadow:0 0 8px var(--g)}
.dim{opacity:.5}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:9px}
.sig i{display:block;width:2px;background:currentColor}
.sig i:nth-child(1){height:3px}.sig i:nth-child(2){height:5px}.sig i:nth-child(3){height:7px}.sig i:nth-child(4){height:9px;opacity:.35}
.snd{pointer-events:auto;cursor:pointer;background:none;border:1px solid rgba(var(--g-rgb),.35);padding:4px 6px;
  font:500 9px/1 var(--mono);letter-spacing:.12em;color:var(--g)}
.snd[aria-pressed="false"]{opacity:.45}

/* ---------- 开机序列（代码动画） ---------- */
.boot{position:absolute;inset:0;z-index:30;pointer-events:none}
.boot.gone{display:none}
.crt{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#eafff3;opacity:0;transform:scaleX(0);
  box-shadow:0 0 18px 4px rgba(var(--g-rgb),.85)}
.boot.crt-on .crt{animation:crt .85s cubic-bezier(.3,0,.2,1) forwards}
@keyframes crt{0%{transform:scaleX(0);opacity:1}38%{transform:scaleX(1) scaleY(1);opacity:1}60%{transform:scaleX(1) scaleY(1);opacity:.9}
  100%{transform:scaleX(1) scaleY(90);opacity:0}}
.term{position:absolute;left:16px;right:16px;top:calc(var(--st) + 44px);white-space:pre;overflow:hidden;
  font:400 10px/1.85 var(--mono);font-size:clamp(9px,2.7cqw,11px);color:rgba(var(--g-rgb),.85);
  text-shadow:0 0 6px rgba(var(--g-rgb),.55);transition:opacity .4s,transform .5s}
.term .ts{color:rgba(var(--g-rgb),.42)}
.term .st{color:#eafff3;text-shadow:0 0 8px var(--g)}
.term .tl:last-child::after{content:"▌";margin-left:2px;animation:blink .7s steps(2) infinite}
.boot.phase-logo .term{opacity:0;transform:translateY(-10px)}
.loader{position:absolute;left:50%;top:52%;width:58%;max-width:240px;aspect-ratio:1;opacity:0;
  transform:translate(-50%,-50%) scale(.8);transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1)}
.loader.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.boot.phase-logo .loader{opacity:0;transform:translate(-50%,-50%) scale(1.3);transition:opacity .35s,transform .5s}
.loader svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.l-r1{fill:none;stroke:rgba(var(--g-rgb),.55);stroke-width:.8;stroke-dasharray:1 5}
.l-r2{fill:none;stroke:var(--g);stroke-width:1.3;stroke-dasharray:60 22 8 22 90 30;opacity:.75}
.l-track{fill:none;stroke:rgba(var(--g-rgb),.12);stroke-width:3}
.l-prog{fill:none;stroke:var(--g);stroke-width:3;stroke-dasharray:477.5;stroke-dashoffset:477.5}
.l-ticks line{stroke:rgba(var(--g-rgb),.45);stroke-width:.8}
.spin,.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spin-r{animation-duration:7s;animation-direction:reverse}
.l-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.l-pct{font:300 38px/1 var(--mono);font-size:clamp(28px,10cqw,44px);color:#eafff3;text-shadow:0 0 14px rgba(var(--g-rgb),.85)}
.l-pct small{font-size:.38em;color:var(--g);margin-left:3px}
.l-label{font:500 8.5px/1 var(--mono);letter-spacing:.28em;color:var(--g);min-height:9px}
.l-cn{font:400 10px/1 var(--sans);letter-spacing:.45em;margin-right:-.45em;color:var(--ink-dim)}

/* ---------- AION 标志（开机后飞到视频里 AION 字样的位置） ---------- */
.logo{position:absolute;z-index:32;left:13%;right:13%;top:42%;pointer-events:none;opacity:0}
.logo.on{opacity:1}
.logo.gone{display:none}
.logo-mark{display:block;width:100%;height:auto;overflow:visible;transform-origin:0 0}
.logo.on .logo-mark{animation:glitchIn .95s steps(1) both}
.logo .gh{opacity:0}
.logo.on .gh1{animation:ghost1 .95s steps(1) both}
.logo.on .gh2{animation:ghost2 .95s steps(1) both}
@keyframes glitchIn{
  0%{opacity:0}
  8%{opacity:1;clip-path:inset(20% 0 52% 0);transform:translateX(-12px)}
  16%{clip-path:inset(58% 0 8% 0);transform:translateX(9px)}
  24%{opacity:0}
  32%{opacity:1;clip-path:inset(0 0 66% 0);transform:translateX(5px)}
  44%{clip-path:inset(36% 0 26% 0);transform:translateX(-7px)}
  56%{clip-path:none;transform:translateX(3px);opacity:.7}
  66%{transform:translateX(-1px);opacity:1}
  76%,100%{clip-path:none;transform:none;opacity:1}}
@keyframes ghost1{0%{opacity:0}10%{opacity:.9}20%{opacity:0}34%{opacity:.8}48%{opacity:0}58%{opacity:.6}68%,100%{opacity:0}}
@keyframes ghost2{0%{opacity:0}14%{opacity:.8}26%{opacity:0}40%{opacity:.7}52%{opacity:0}62%{opacity:.5}72%,100%{opacity:0}}
.logo-sub{margin-top:14px;font:400 8.5px/1 var(--mono);font-size:clamp(7.5px,2.35cqw,10px);letter-spacing:.32em;color:rgba(228,255,240,.75);white-space:nowrap;min-height:10px}
.logo-bar{display:flex;align-items:center;gap:3px;margin-top:12px}
.logo-bar i{display:block;width:13px;height:5px;background:var(--g);transform:skewX(-35deg);box-shadow:0 0 8px var(--g)}
.logo-bar i:nth-child(3){width:6px}
.logo-bar b{flex:1;height:1px;background:linear-gradient(90deg,var(--g),transparent);transform-origin:left;transform:scaleX(0);transition:transform 1s .3s}
.logo.on .logo-bar b{transform:scaleX(1)}

/* ---------- 登录面板 ---------- */
.login{position:absolute;z-index:40;left:14px;right:14px;bottom:calc(var(--sb) + 16px);padding:16px 18px 14px;
  visibility:hidden;pointer-events:none;transition:opacity .45s,transform .5s}
.login.on{visibility:visible;pointer-events:auto}
.login.out{opacity:0;transform:translateY(18px);pointer-events:none}
.login::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .7s;
  background:linear-gradient(180deg,rgba(6,26,15,.42),rgba(2,12,7,.78));border:1px solid rgba(var(--g-rgb),.16);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.login.on::before{opacity:1}
.cn{position:absolute;width:12px;height:12px;border:0 solid var(--g);pointer-events:none;filter:drop-shadow(0 0 3px var(--g))}
.cn.tl{top:-1px;left:-1px;border-top-width:1.5px;border-left-width:1.5px}
.cn.tr{top:-1px;right:-1px;border-top-width:1.5px;border-right-width:1.5px}
.cn.bl{bottom:-1px;left:-1px;border-bottom-width:1.5px;border-left-width:1.5px}
.cn.br{bottom:-1px;right:-1px;border-bottom-width:1.5px;border-right-width:1.5px}
.login>.cn{opacity:0;transition:opacity .5s .15s}
.login.on>.cn{opacity:1}
.login>.cn.tl,.login>.cn.br{display:none}
.stg{opacity:0;transform:translateY(12px);transition:opacity .55s var(--d,0ms),transform .7s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.login.on .stg{opacity:1;transform:none}

.lg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  font:600 10px/1 var(--mono);letter-spacing:.2em;color:var(--g)}
.lg-tag{display:flex;align-items:center;gap:8px}
.lg-tag b{width:0;height:0;border-left:6px solid var(--g);border-top:4px solid transparent;border-bottom:4px solid transparent;
  filter:drop-shadow(0 0 4px var(--g))}
.lg-step{font-weight:400;color:var(--ink-dim)}
.lg-step em{font-style:normal;color:var(--g)}

.field{display:block}
.field-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;
  font:500 9.5px/1 var(--mono);letter-spacing:.2em;color:rgba(var(--g-rgb),.85)}
.field-label em{font:400 11px/1 var(--sans);font-style:normal;letter-spacing:.2em;color:var(--ink-dim)}
.field-box{position:relative;display:flex;align-items:center;height:48px;padding:0 14px;
  background:rgba(var(--g-rgb),.045);border:1px solid rgba(var(--g-rgb),.26);
  transition:border-color .3s,box-shadow .3s,background .3s}
.field-box:focus-within{border-color:rgba(var(--g-rgb),.85);background:rgba(var(--g-rgb),.08);
  box-shadow:0 0 22px rgba(var(--g-rgb),.22),inset 0 0 18px rgba(var(--g-rgb),.08)}
.field-box .cn{width:7px;height:7px;opacity:.9}
.field-prefix{font:600 13px/1 var(--mono);color:var(--g);margin-right:10px;text-shadow:0 0 8px var(--g);animation:blink 1.1s steps(2) infinite}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;border-radius:0;-webkit-appearance:none;appearance:none;
  font:500 16px/1 var(--sans);letter-spacing:.06em;color:#f0fff6;caret-color:var(--g);
  -webkit-user-select:text;user-select:text}
.field input::placeholder{color:rgba(217,255,233,.32);letter-spacing:.12em}
.field input:disabled{opacity:1;-webkit-text-fill-color:#f0fff6}
.field-ok{font:700 13px/1 var(--mono);color:var(--g);text-shadow:0 0 8px var(--g);opacity:0;transform:scale(.4);transition:.3s}
.field.filled .field-ok{opacity:1;transform:none}
.field.shake .field-box{animation:shake .42s;border-color:var(--warn);box-shadow:0 0 18px rgba(255,93,115,.3)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

.status{display:flex;align-items:center;justify-content:center;gap:12px;height:30px;margin:16px 0 8px;
  font:500 14px/1 var(--sans);letter-spacing:.3em;color:rgba(217,255,233,.5);transition:color .3s,text-shadow .3s}
.status .st-text{margin-right:-.3em;white-space:nowrap}
.status .br{font:300 17px/1 var(--mono);letter-spacing:0;color:rgba(var(--g-rgb),.35);transition:color .3s}
.status.ready{font-size:17px;color:#f0fff6;text-shadow:0 0 12px rgba(var(--g-rgb),.9),0 0 2px var(--g)}
.status.ready .br{color:var(--g)}
.status.ready .br:first-child{animation:brL 1.3s ease-in-out infinite}
.status.ready .br:last-child{animation:brR 1.3s ease-in-out infinite}
@keyframes brL{50%{transform:translateX(-5px);opacity:.4}}
@keyframes brR{50%{transform:translateX(5px);opacity:.4}}
.status.warn{color:var(--warn);text-shadow:0 0 10px rgba(255,93,115,.55)}
.status.warn .br{color:var(--warn)}
.status.ok{font-size:17px;color:#fff;text-shadow:0 0 14px var(--g),0 0 2px var(--g)}
.status.ok .br{color:var(--g)}

/* 指纹按钮 */
.finger{position:relative;display:block;margin:0 auto;width:132px;width:clamp(104px,34cqw,136px);aspect-ratio:1;
  padding:0;border:0;border-radius:50%;background:none;cursor:pointer;outline:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.finger:focus-visible{outline:1px dashed var(--g);outline-offset:6px}
.finger svg{display:block;width:100%;height:100%;overflow:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .4s}
.finger[aria-disabled="true"] svg{opacity:.5}
.finger.holding svg{transform:scale(.94)}
.fp-bg{opacity:.45;transition:opacity .3s}
.finger.holding .fp-bg,.finger.done .fp-bg{opacity:1}
.ring-track{fill:none;stroke:rgba(var(--g-rgb),.16);stroke-width:1.2}
.ring-ticks{fill:none;stroke:rgba(var(--g-rgb),.5);stroke-width:2.4;stroke-dasharray:.7 3.4888;
  transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.finger.holding .ring-ticks{stroke:var(--g);animation-duration:2.5s}
.ring-arcs{fill:none;stroke:rgba(var(--g-rgb),.75);stroke-width:1;transform-box:view-box;transform-origin:60px 60px;animation:spin 9s linear infinite reverse}
.finger.holding .ring-arcs{animation-duration:1.6s}
.ring-prog{fill:none;stroke:var(--g);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:339.29;stroke-dashoffset:339.29}
.finger.done .ring-prog{stroke:#eafff3}
.pulse{fill:none;stroke:var(--g);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center}
.finger.ready:not(.holding):not(.done) .pulse{animation:pulse 2.1s ease-out infinite}
.finger.done .pulse{animation:burst .8s ease-out forwards}
@keyframes pulse{0%{transform:scale(.8);opacity:.75}100%{transform:scale(1.22);opacity:0}}
@keyframes burst{0%{transform:scale(.9);opacity:1;stroke-width:3}100%{transform:scale(1.6);opacity:0;stroke-width:.5}}
.fp-base path{fill:none;stroke:rgba(var(--g-rgb),.3);stroke-width:2.1;stroke-linecap:round;transition:stroke .4s}
.finger.ready .fp-base path{stroke:rgba(var(--g-rgb),.62)}
.fp-lit path{fill:none;stroke:#d2ffe4;stroke-width:2.3;stroke-linecap:round}
.fp-scan{fill:#f0fff6;opacity:0}
.finger.holding .fp-scan{opacity:1;animation:fpscan .85s ease-in-out infinite alternate}
@keyframes fpscan{from{transform:translateY(0)}to{transform:translateY(68px)}}
.hint{margin-top:8px;text-align:center;font:500 9.5px/1.4 var(--mono);letter-spacing:.22em;color:rgba(217,255,233,.42);min-height:14px;transition:color .3s}
.hint.live{color:var(--g);text-shadow:0 0 6px rgba(var(--g-rgb),.7)}

/* ---------- 成功层：与视频同尺寸，按视频画面位置摆放 ---------- */
.sbox{position:absolute;left:0;top:0;width:100%;aspect-ratio:9/16;z-index:60;pointer-events:none}
/* 弹窗放在人物胸前（视频高度 44%~78%），不挡脸，也不挡视频 3 末尾出现的 AION 字样 */
.card{position:absolute;left:0;right:0;bottom:22%;margin:0 auto;width:min(84%,320px);padding:14px 18px 16px;text-align:center;
  opacity:0;transform:scale(.15,.006)}
.card.on{animation:winOpen .65s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes winOpen{0%{opacity:1;transform:scale(.15,.006)}45%{opacity:1;transform:scale(1,.006)}100%{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(6,30,17,.6),rgba(2,12,7,.84));border:1px solid rgba(var(--g-rgb),.38);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.m-glow{position:absolute;inset:8% 4%;z-index:-2;background:radial-gradient(rgba(var(--g-rgb),.28),transparent 70%);filter:blur(22px)}
.card>.cn.tl,.card>.cn.br{display:none}
.ms{opacity:0;transform:translateY(6px);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1)}
.ms.show{opacity:1;transform:none}
.badge{display:block;width:50px;height:50px;margin:0 auto 8px;overflow:visible}
.b-ring{fill:none;stroke:rgba(var(--g-rgb),.55);stroke-width:1;stroke-dasharray:2 4;transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}
.b-circle{fill:rgba(var(--g-rgb),.08);stroke:var(--g);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:100}
.b-check{fill:none;stroke:#f0fff6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100}
.badge.show .b-circle{animation:draw .6s ease-out forwards}
.badge.show .b-check{animation:draw .45s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.m-code{min-height:12px;margin-bottom:8px;font:600 10px/1.2 var(--mono);letter-spacing:.42em;margin-right:-.42em;color:var(--g);text-shadow:0 0 8px rgba(var(--g-rgb),.8)}
.m-title{font:700 21px/1.25 var(--sans);font-size:clamp(18px,6cqw,24px);letter-spacing:.2em;margin-right:-.2em;color:#f4fff9;
  text-shadow:0 0 18px rgba(var(--g-rgb),.7)}
.m-rule{height:1px;width:0;margin:10px auto;background:linear-gradient(90deg,transparent,var(--g),transparent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.m-rule.show{width:100%}
.m-welcome{min-height:1.5em;font:500 16px/1.5 var(--sans);font-size:clamp(14px,4.5cqw,18px);letter-spacing:.08em;color:#e2fff0;word-break:break-all}
.m-name{font-weight:700;color:var(--g);text-shadow:0 0 12px rgba(var(--g-rgb),.85)}
.caret{display:inline-block;width:.5em;height:1.05em;margin-left:3px;vertical-align:-.16em;background:var(--g);box-shadow:0 0 8px var(--g);animation:blink .8s steps(2) infinite}
/* 视频 3 的 AION 字样在画面约 82% 处，欢迎字幕与按钮放在它下方 */
.final{position:absolute;left:0;right:0;top:87.5%;display:flex;flex-direction:column;align-items:center;gap:12px;
  opacity:0;transition:opacity .9s}
.final.on{opacity:1}
.f-sub{min-height:12px;font:500 9.5px/1.2 var(--mono);letter-spacing:.3em;margin-right:-.3em;color:rgba(217,255,233,.65);word-break:break-all;padding:0 16px;text-align:center}
.m-replay{padding:8px 16px;cursor:pointer;background:rgba(var(--g-rgb),.06);border:1px solid rgba(var(--g-rgb),.4);
  font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--g)}
.final.on .m-replay{pointer-events:auto}
.m-replay:active{background:rgba(var(--g-rgb),.18)}

/* ---------- 其他 ---------- */
.flash{position:absolute;inset:0;z-index:70;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 55%,rgba(210,255,228,.75),rgba(var(--g-rgb),.22) 45%,transparent 75%)}
.flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.skip{position:absolute;z-index:80;right:14px;bottom:calc(var(--sb) + 14px);padding:8px 12px;cursor:pointer;background:none;
  border:1px solid rgba(var(--g-rgb),.25);font:500 10px/1 var(--mono);letter-spacing:.24em;color:rgba(var(--g-rgb),.65);
  opacity:0;pointer-events:none;transition:opacity .4s}
.skip.show{opacity:1;pointer-events:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-height:700px){
  .login{padding:12px 16px 10px}
  .lg-head{margin-bottom:10px}
  .field-box{height:44px}
  .status{margin:10px 0 4px}
  .finger{width:100px}
}
@media (prefers-reduced-motion:reduce){
  .ring-ticks,.ring-arcs,.b-ring,.gate .r1,.gate .r2,.spin,.spin-r{animation:none}
}
</style>
</head>
<body>
<main class="app" id="app">

  <!-- 视频：开机动画结束后接视频 1 → 视频 2（等待验证，循环）→ 视频 3（验证成功） -->
  <div class="vwrap">

      <img class="fallback" id="fallback" src="assets/aion.webp" alt="" draggable="false">

             disablepictureinpicture disableremoteplayback></video>

             disablepictureinpicture disableremoteplayback></video>

  <!-- AION 标志 -->

        <g id="aionG" fill="none" stroke-width="3.6" stroke-linejoin="miter" stroke-linecap="butt">
          <path d="M1.8 38.2 L33 1.8 H49.2 V38.2 M24.5 30.6 H49.2"/>
          <path d="M77 1.8 V38.2"/>
          <path d="M136 1.8 H122.5 Q116.8 1.8 116.8 7.5 V32.5 Q116.8 38.2 122.5 38.2 H136"/>
          <path d="M141.5 1.8 H159.2 V38.2 H141.5"/>

      </defs>
      <g transform="translate(10.7 0) skewX(-15)">
        <use class="gh gh1" href="#aionG" stroke="#00ffd0" transform="translate(-3 0)"/>
        <use class="gh gh2" href="#aionG" stroke="#c6ff3d" transform="translate(3 0)"/>

  <!-- 登录面板 -->
  <section class="login" id="login" aria-label="身份验证">
    <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
    <div class="lg-head stg" style="--d:0ms">
      <span class="lg-tag"><b></b>IDENTITY ACCESS</span>
      <span class="lg-step" id="step">STEP <em>01</em> / 02</span>
    </div>
    <label class="field stg" id="field" for="username" style="--d:90ms">
      <span class="field-label"><span>USER ID</span><em>用户名</em></span>
      <span class="field-box">
        <span class="field-prefix" aria-hidden="true">&gt;_</span>
        <input id="username" name="username" type="text" maxlength="16" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="请输入用户名">
        <span class="field-ok" aria-hidden="true">✓</span>
        <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      </span>
    </label>
    <div class="status stg" id="status" style="--d:180ms" aria-hidden="true">
      <span class="br">[</span><span class="st-text" id="statusText">等待身份信息</span><span class="br">]</span>
    </div>
    <span class="sr" id="srStatus" role="status" aria-live="polite"></span>
    <button class="finger stg" id="finger" type="button" style="--d:260ms" aria-disabled="true" aria-label="按住指纹 2 秒验证身份">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <radialGradient id="fpBgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="rgb(61,255,143)" stop-opacity=".22"/>
            <stop offset=".7" stop-color="rgb(61,255,143)" stop-opacity=".05"/>
            <stop offset="1" stop-color="rgb(61,255,143)" stop-opacity="0"/>
          </radialGradient>
          <filter id="fpGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="fpClip"><rect id="fpClipRect" x="0" y="96" width="120" height="0"/></clipPath>
        </defs>
        <circle class="fp-bg" cx="60" cy="60" r="46" fill="url(#fpBgGrad)"/>
        <circle class="pulse" cx="60" cy="60" r="54"/>
        <circle class="ring-track" cx="60" cy="60" r="54"/>
        <circle class="ring-ticks" cx="60" cy="60" r="48"/>
        <path class="ring-arcs" d="M60 2 A58 58 0 0 1 101.01 18.99 M60 118 A58 58 0 0 1 18.99 101.01"/>
        <circle class="ring-prog" id="ringProg" cx="60" cy="60" r="54" transform="rotate(-90 60 60)" filter="url(#fpGlow)"/>
        <g class="fp-base" id="fpBase"></g>
        <g class="fp-lit" id="fpLit" clip-path="url(#fpClip)" filter="url(#fpGlow)"></g>
        <rect class="fp-scan" x="28" y="24" width="64" height="1.6" rx=".8" filter="url(#fpGlow)"/>

    </button>
    <div class="hint stg" id="hint" style="--d:330ms">HOLD 2S · 按住指纹 2 秒</div>
  </section>

  <!-- 验证成功：弹窗 + 结尾字幕（随视频 3 出现） -->
  <div class="sbox">
    <div class="card" id="card" aria-hidden="true">
      <div class="m-glow"></div>
      <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      <svg class="badge ms" viewBox="0 0 80 80" aria-hidden="true">
        <defs>
          <filter id="bGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="b-ring" cx="40" cy="40" r="37"/>
        <circle class="b-circle" cx="40" cy="40" r="28" pathLength="100" transform="rotate(-90 40 40)" filter="url(#bGlow)"/>
        <path class="b-check" d="M27 41 L36 50 L54 31" pathLength="100" filter="url(#bGlow)"/>
      </svg>
      <div class="m-code ms" id="mCode">&nbsp;</div>
      <h2 class="m-title ms" id="mTitle">身份验证成功</h2>
      <div class="m-rule ms"></div>

  <!-- 启动遮罩 -->
  <div class="gate" id="gate" role="button" tabindex="0" aria-label="轻触屏幕启动" hidden>
    <svg viewBox="0 0 80 80" aria-hidden="true">
      <circle class="r1" cx="40" cy="40" r="38"/>
      <circle class="r2" cx="40" cy="40" r="30"/>
      <path class="pw" d="M48 29.14 A16 16 0 1 1 32 29.14 M40 22 V40"/>
    </svg>
    <div class="gate-t">TAP TO BOOT</div>
    <div class="gate-cn">轻触屏幕启动</div>

  <div class="flash" id="flash"></div>
  <button class="skip" id="skip" type="button">SKIP ▸▸</button>
</main>

<script>
(() => {
'use strict';
/* ======================= 可调参数 ======================= */
const JOIN_AT  = 3.0;   // 开机动画结束后，视频 1 从第几秒接上（3 秒处线框人像开始成形，前面的黑屏数字雨由代码动画代替）
const AION_AT  = 5.6;   // 视频 1 里 AION 字样打出来的时间：飞过去的标志在这时淡出，交给视频
const LOGIN_AT = 6.6;   // 视频 1 播放到第几秒时滑出登录面板（视频 1 共 8 秒）
const CARD_AT  = 0.6;   // 视频 3 播放到第几秒时弹出"身份验证成功"窗口
const FINAL_AT = 4.9;   // 视频 3 播放到第几秒时显示底部欢迎字幕和"重新体验"按钮
const HOLD_MS  = 2000;  // 指纹需要按住的时长（毫秒）
// 视频画面中 AION 字样的位置（相对视频宽度的比例），开机标志最终飞到这里
const AION_SLOT = { x: .0254, y: .3556, w: .270 };

const $ = s => document.querySelector(s);
const app = $('#app'), vclip = $('#vclip'), scanbar = $('#scanbar'), fallback = $('#fallback');
const v1 = $('#v1'), v2 = $('#v2'), v3 = $('#v3'), VIDS = [v1, v2, v3];
const boot = $('#boot'), term = $('#term'), loader = $('#loader');
const lPct = $('#lPct'), lProg = $('#lProg'), lLabel = $('#lLabel'), lCn = $('#lCn');
const logo = $('#logo'), logoMark = $('#logoMark'), logoSub = $('#logoSub'), logoBar = $('#logoBar');
const rainCv = $('#rain'), shade = $('#shade'), hud = $('#hud'), gate = $('#gate'), skipBtn = $('#skip');
const flashEl = $('#flash'), netEl = $('#net'), sndBtn = $('#snd');
const login = $('#login'), input = $('#username'), field = $('#field'), stepEl = $('#step');
const statusEl = $('#status'), statusText = $('#statusText'), srStatus = $('#srStatus');
const finger = $('#finger'), ringProg = $('#ringProg'), clipRect = $('#fpClipRect'), hint = $('#hint');
const card = $('#card'), finalEl = $('#final');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace';

/* ======================= 工具 ======================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let skipping = false;
const pending = new Set();
// 开场专用等待：点 SKIP 时立即结束
const wait = ms => new Promise(res => {
  if (skipping) return res();
  const done = () => { clearTimeout(id); pending.delete(done); res(); };
  const id = setTimeout(done, ms);
  pending.add(done);
});
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const pad2 = n => String(n).padStart(2, '0');
const clockStr = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
function flash() { flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
function glitch() { app.classList.remove('glitch'); void app.offsetWidth; app.classList.add('glitch'); }

const ASCII_POOL = '<>/\\[]{}=+*#%01ABCDEFXZ$&';
const CJK_POOL = '验证身份请输入用户名系统神经链接同步核心协议加密终端访问矩阵量子';
function scramble(node, text, dur = 600) {
  const id = (node._sid = (node._sid || 0) + 1);
  const t0 = performance.now();
  return new Promise(res => {
    const f = now => {
      if (node._sid !== id) return res();
      const p = Math.max(0, Math.min(1, (now - t0) / dur));
      const n = Math.floor(p * text.length);
      let s = text.slice(0, n);
      for (let i = n; i < text.length; i++) {
        const c = text[i];
        if (c === ' ' || c === '·') s += c;
        else if (c.charCodeAt(0) > 0x2e80) s += CJK_POOL[(Math.random() * CJK_POOL.length) | 0];
        else s += ASCII_POOL[(Math.random() * ASCII_POOL.length) | 0];
      }
      node.textContent = s;
      if (p < 1) requestAnimationFrame(f); else { node.textContent = text; res(); }
    };
    requestAnimationFrame(f);
  });
}

/* ======================= 交互音效（WebAudio 合成） ======================= */
// —— 音量旋钮：觉得哪段大了 / 小了，改这里的数字就行 ——
const BOOT_SFX  = 4.5;   // 开机代码流音效的放大倍数（1 = 最早的音量）
const AION_SFX  = 2;     // AION 出现时机械音效的放大倍数（素材本身偏小，2 ≈ +6 dB）
const ABORT_SFX = 1;     // 指纹中断提示音的音量倍数
const AION_SFX_URL = 'assets/audio/aion-logo.mp3';   // 电子科幻机械音效

let actx = null, soundOn = true;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    decodeAion();
  } catch (e) {}
}
function tone(freq, dur, { type = 'sine', vol = .05, at = 0, slideTo, lp } = {}) {
  if (!actx || !soundOn || actx.state !== 'running') return;
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  let src = o;
  if (lp) { const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; src = o.connect(f); }
  src.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .03);
}
const sndTick = () => tone(1900, .03, { type: 'square', vol: .012 });
// 开机阶段（代码流）
const sndLine = () => tone(1400, .05, { type: 'square', vol: .016 * BOOT_SFX });
const sndReady = () => { tone(660, .1, { vol: .035 * BOOT_SFX }); tone(990, .16, { vol: .035 * BOOT_SFX, at: .08 }); };
const sndJoin = () => tone(220, .7, { type: 'triangle', vol: .03 * BOOT_SFX, slideTo: 880 });
const sndGlitch = () => tone(1300, .22, { type: 'sawtooth', vol: .02 * BOOT_SFX, slideTo: 160 });
const sndErr = () => { tone(300, .14, { type: 'square', vol: .025, slideTo: 170 }); tone(220, .16, { type: 'square', vol: .02, at: .12, slideTo: 120 }); };
// 指纹没按满就松开：两声短促的警示“嘀嘀”，再接一声下滑的低音
const sndAbort = () => {
  const v = ABORT_SFX;
  tone(760, .09, { type: 'square', vol: .14 * v, lp: 2800 });
  tone(760, .09, { type: 'square', vol: .14 * v, at: .13, lp: 2800 });
  tone(560, .3, { type: 'sawtooth', vol: .2 * v, at: .27, slideTo: 230, lp: 1900 });
};
const sndOk = () => { tone(880, .14, { vol: .045 }); tone(1320, .3, { vol: .045, at: .08 }); };

// AION 出现时的机械音效：网页服务器上用 WebAudio 解码后放大播放；本地双击打开时用普通音频播放
const AION_SKIP = .12;   // 素材开头约 0.12 秒是静音，跳过
let aionBuf = null, aionEl = null, aionDecoding = false;
const aionBytes = /^https?:$/.test(location.protocol)
  ? fetch(AION_SFX_URL).then(r => (r.ok ? r.arrayBuffer() : null)).catch(() => null)
  : Promise.resolve(null);
if (!/^https?:$/.test(location.protocol)) { aionEl = new Audio(); aionEl.preload = 'auto'; aionEl.src = AION_SFX_URL; }
function decodeAion() {
  if (!actx || aionDecoding) return;
  aionDecoding = true;
  aionBytes
    .then(ab => ab && new Promise((ok, no) => actx.decodeAudioData(ab, ok, no)))
    .then(b => { if (b) aionBuf = b; })
    .catch(() => {});
}
function sndAion() {
  if (!soundOn) return;

finger.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); ensureAudio(); pressStart(); } });
finger.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pressEnd(); } });
finger.addEventListener('blur', pressEnd);

/* ======================= 验证成功：视频 3 + 弹窗 ======================= */
async function success() {
  done = true; holding = false; cancelAnimationFrame(raf);
  renderProg(1);
  finger.classList.remove('holding'); finger.classList.add('done');
  hint.textContent = 'IDENTITY CONFIRMED';
  scanSnd.stop(); sndOk(); vib([30, 50, 90]);
  setStatus('ok'); input.disabled = true;
  stepEl.innerHTML = '<em>VERIFIED</em>';
  flash(); app.classList.add('granted'); netEl.textContent = 'VERIFIED';
  await sleep(550);
  login.classList.add('out'); shade.classList.remove('on');
  switchTo(v3);
  await at(v3, CARD_AT, (CARD_AT + 8) * 1000);
  showCard();
  await at(v3, FINAL_AT, (FINAL_AT + 8) * 1000);
  showFinal();
}
async function showCard() {
  const nm = name;
  srStatus.textContent = `身份验证成功，欢迎回家，${nm}`;
  card.classList.add('on');
  const ms = [...card.querySelectorAll('.ms')];
  const show = n => n.classList.add('show');
  await sleep(600);
  show(ms[0]);
  await sleep(240);
  show(ms[1]); scramble($('#mCode'), 'ACCESS GRANTED', 600);
  await sleep(260);
  show(ms[2]); scramble($('#mTitle'), '身份验证成功', 500);
  await sleep(360);
  show(ms[3]);
  await sleep(220);
  show(ms[4]);
  const wEl = $('#mWelcome'), nEl = $('#mName'), head = '欢迎回家，';
  for (let i = 1; i <= head.length; i++) { wEl.textContent = head.slice(0, i); sndTick(); await sleep(85); }
  for (let i = 1; i <= nm.length; i++) { nEl.textContent = nm.slice(0, i); sndTick(); await sleep(95); }
}
function showFinal() {
  finalEl.classList.add('on');
  scramble($('#fSub'), 'WELCOME HOME, ' + name.toUpperCase(), 700);
}
$('#replay').addEventListener('click', () => location.reload());

/* ======================= 启动 ======================= */
setInterval(() => { $('#clock').textContent = clockStr(); }, 1000);
$('#clock').textContent = clockStr();
fallback.addEventListener('error', () => { fallback.style.display = 'none'; });
start();
})();
</script>
