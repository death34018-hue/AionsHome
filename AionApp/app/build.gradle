plugins {
    id 'com.android.application'
}

// Package the video page from its editable source, alongside the mobile encodes in src/main/assets.
def launchAssetsDir = layout.buildDirectory.dir('generated/launchLoginAssets')
def prepareLaunchLogin = tasks.register('prepareLaunchLogin', Sync) {
    from(rootProject.file('../public/Aion登录界面')) {
        include 'index-video.html', 'assets/aion.webp', 'assets/audio/aion-logo.mp3'
        into 'launch-login'
    }
    into launchAssetsDir
}

android {
    namespace 'com.aion.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.aion.chat"
        minSdk 24
        targetSdk 34
        versionCode 33
        versionName "1.32"
        // Optional per-device build avoids shipping other CPUs' native ASR libraries.
        if (project.hasProperty('targetAbi')) {
            ndk { abiFilters project.property('targetAbi') }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    androidResources { noCompress 'tflite' }

    sourceSets.main.assets.srcDir(launchAssetsDir)

    packagingOptions {
        jniLibs.excludes += ['**/libsherpa-onnx-c-api.so', '**/libsherpa-onnx-cxx-api.so']
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.named('preBuild').configure { dependsOn prepareLaunchLogin }

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
