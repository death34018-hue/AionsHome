<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>爱的印记</title>
<link rel="stylesheet" href="/static/common.css">
<style>
body { background: #1a1412; color: #e8ddd4; overflow: hidden; }

.sub-page { max-width: 640px; }

.top-bar {
  background: rgba(26,20,18,0.9);
  border-bottom: 1px solid rgba(255,131,89,0.15);
}
.top-bar h2 { color: #e8ddd4; }
.top-bar .back-btn { color: #ff8359; }

/* 测试按钮 */
.test-gift-btn {
  background: rgba(255,131,89,0.15);
  border: 1px solid rgba(255,131,89,0.3);
  color: #ff8359;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 14px;
  cursor: pointer;
  flex-shrink: 0;
}
.test-gift-btn:hover { background: rgba(255,131,89,0.25); }
.test-gift-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.page-content {
  padding: 0 0 32px 0;
  background: linear-gradient(180deg, #1a1412 0%, #231c18 100%);
}

/* 标题区 */
.gallery-header {
  text-align: center;
  padding: 28px 16px 20px;
  position: relative;
}
.gallery-header::after {
  content: '';
  display: block;
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #ff8359, transparent);
  margin: 16px auto 0;
}
.gallery-title {
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 6px;
  color: #ffcba4;
}
.gallery-subtitle {
  font-size: 12px;
  color: rgba(255,203,164,0.4);
  margin-top: 6px;
  letter-spacing: 3px;
}

/* 空状态 */
.gallery-empty {
  text-align: center;
  padding: 80px 24px;
  color: rgba(232,221,212,0.3);
}
.gallery-empty-icon { font-size: 48px; margin-bottom: 16px; }
.gallery-empty-text { font-size: 14px; line-height: 1.8; }

/* 礼物卡片列表 */
.gallery-list {
  padding: 0 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* 缩略图卡片 */
.gift-thumb {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,131,89,0.1);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.gift-thumb:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
}
.gift-thumb:active { transform: scale(0.96); }

.gift-thumb-img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}

.gift-thumb-date {
  text-align: center;
  font-size: 10px;
  color: rgba(255,203,164,0.6);
  padding: 6px 0;
  letter-spacing: 0.5px;
  line-height: 1.5;
  background: rgba(0,0,0,0.3);
}
.gift-thumb-from {
  display: block;
  color: #ff8359;
  letter-spacing: 0.3px;
}

/* 多选模式 */
.gift-thumb-check {
  display: none;
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.35);
  color: #fff;
  font-size: 13px;
  line-height: 18px;
  text-align: center;
}
.selecting .gift-thumb-check { display: block; }
.selecting .gift-thumb:hover { transform: none; box-shadow: none; }
.gift-thumb.selected { border-color: #ff8359; }
.gift-thumb.selected .gift-thumb-img { opacity: 0.55; }
.gift-thumb.selected .gift-thumb-check { background: #ff8359; border-color: #ff8359; }
.gift-thumb.selected .gift-thumb-check::after { content: '✓'; }

.select-bar {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: 640px;
  box-sizing: border-box;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(42,34,32,0.96);
  border-top: 1px solid rgba(255,131,89,0.2);
  z-index: 40;
  align-items: center;
  gap: 10px;
}
.selecting .select-bar { display: flex; }
.selecting .page-content { padding-bottom: 96px; }
.select-count { flex: 1; font-size: 13px; color: rgba(232,221,212,0.75); }
.select-bar button {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.btn-select-all { background: rgba(255,255,255,0.1); color: #e8ddd4; }
.btn-select-del { background: #cf222e; color: #fff; }
.btn-select-del:disabled { opacity: 0.4; cursor: not-allowed; }

/* 日间模式（其余日间配色在 theme.css） */
body.gift-page[data-theme="light"] .gallery-list .gift-thumb {
  background: #fffdfb;
  border-color: rgba(255, 131, 89, 0.18);
  box-shadow: 0 6px 18px rgba(115, 87, 68, 0.12);
}
body.gift-page[data-theme="light"] .gallery-list .gift-thumb:hover {
  box-shadow: 0 10px 24px rgba(115, 87, 68, 0.20);
}
body.gift-page[data-theme="light"] .gallery-list .gift-thumb.selected {
  border-color: #ff8359;
}
body.gift-page[data-theme="light"] .gift-thumb-date {
  background: transparent;
  color: #7a5540;
  font-weight: 500;
  border-top: 1px solid rgba(255, 131, 89, 0.14);
}
body.gift-page[data-theme="light"] .gift-thumb-from { color: #c2552f; }
body.gift-page[data-theme="light"] .select-bar {
  background: rgba(255, 250, 245, 0.96);
  border-top-color: rgba(255, 131, 89, 0.24);
  box-shadow: 0 -8px 24px rgba(115, 87, 68, 0.10);
}
body.gift-page[data-theme="light"] .select-count { color: rgba(80, 64, 52, 0.78); }
body.gift-page[data-theme="light"] .btn-select-all {
  background: rgba(120, 103, 255, 0.10);
  color: #394370;
}

/* 展开详情弹窗 */
.gift-detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 50;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s;
}
.gift-detail-overlay.show { display: flex; opacity: 1; }

.gift-detail-box {
  max-width: 380px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 16px;
  background: #2a2220;
  border: 1px solid rgba(255,131,89,0.15);
  animation: detailSlideIn 0.35s ease-out;
}
@keyframes detailSlideIn { from { transform: scale(0.85) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

.gift-detail-img {
  width: 100%;
  display: block;
  border-radius: 16px 16px 0 0;
}
.gift-detail-body {
  padding: 16px 18px 18px;
}
.gift-detail-date {
  font-size: 12px;
  color: rgba(255,203,164,0.5);
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.gift-detail-date::before {
  content: '✦ ';
  color: rgba(255,131,89,0.3);
}
.gift-detail-msg {
  font-size: 14px;
  line-height: 1.8;
  color: rgba(232,221,212,0.85);
}
.gift-detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  justify-content: center;
}
.gift-detail-actions button {
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.btn-detail-close {
  background: rgba(255,255,255,0.1);
  color: #e8ddd4;
}
.btn-detail-delete {
  background: rgba(207,34,46,0.2);
  color: #ff6b6b;
}

/* 删除确认弹窗 */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.confirm-overlay.show { display: flex; }
.confirm-box {
  background: #2a2220;
  border: 1px solid rgba(255,131,89,0.2);
  border-radius: 16px;
  padding: 24px 28px;
  max-width: 320px;
  width: 85%;
  text-align: center;
}
.confirm-box p { font-size: 15px; margin-bottom: 20px; color: #e8ddd4; }
.confirm-btns { display: flex; gap: 12px; justify-content: center; }
.confirm-btns button {
  padding: 8px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}
.btn-confirm-del { background: #cf222e; color: #fff; }
.btn-confirm-cancel { background: rgba(255,255,255,0.1); color: #e8ddd4; }
</style>
</head>
<body class="gift-page" data-theme="dark">
<div class="sub-page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='/'">‹</button>
    <h2>爱的印记</h2>
    <button class="test-gift-btn" id="selectModeBtn" onclick="toggleSelectMode()">选择</button>
    <button class="test-gift-btn" id="testGiftBtn" onclick="document.getElementById('testOverlay').classList.add('show')">🎁 测试送礼</button>
  </div>
  <div class="page-content" id="pageContent">
    <div class="gallery-header">
      <div class="gallery-title">爱 的 印 记</div>
      <div class="gallery-subtitle">LOVE MARKS</div>
    </div>
    <div class="gallery-list" id="galleryList"></div>
  </div>
  <div class="select-bar">
    <button class="btn-select-all" id="selectAllBtn" onclick="toggleSelectAll()">全选</button>
    <span class="select-count" id="selectCount">已选 0 份</span>
    <button class="btn-select-del" id="batchDelBtn" onclick="askBatchDelete()" disabled>删除</button>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="gift-detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="gift-detail-box" id="detailBox"></div>
</div>

<!-- 删除确认 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText">确定要删除这份礼物吗？</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="cancelDelete()">取消</button>
      <button class="btn-confirm-del" id="confirmDelBtn" onclick="confirmDelete()">删除</button>
    </div>
  </div>
</div>

<!-- 测试送礼：选择送礼人 -->
<div class="confirm-overlay" id="testOverlay" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="confirm-box">
    <p>让谁来送这份测试礼物？</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="testGift('aion')">Aion</button>
      <button class="btn-confirm-cancel" onclick="testGift('connor')">Connor</button>
    </div>
  </div>
</div>

<script src="/static/theme.js?v=theme-20260606"></script>
<script src="/static/common.js"></script>
<script>
let _deleteId = null;
let _batchDeleteIds = null;
let _selecting = false;
const _selected = new Set();
let _allGifts = [];
const GIFT_LIST_SNAPSHOT_KEY = 'gift_list_snapshot_v1';

function giftSharedDataBridge() {
  try { return window.top?.AppSharedData || window.AppSharedData || null; }
  catch(e) { return window.AppSharedData || null; }
}

async function loadGifts() {
  const list = document.getElementById('galleryList');
  let snapshotShown = false;
  try {
    const raw = giftSharedDataBridge()?.get?.(GIFT_LIST_SNAPSHOT_KEY)
      || localStorage.getItem(GIFT_LIST_SNAPSHOT_KEY) || '';
    const snapshot = JSON.parse(raw || 'null');
    if (snapshot && Array.isArray(snapshot.gifts) && snapshot.gifts.length) {
      _allGifts = snapshot.gifts;
      renderGrid();
      snapshotShown = true;
    }
  } catch(e) {}
  try {
    const res = await fetch('/api/gift/list');
    const data = await res.json();
    if (!data.ok || !data.gifts || data.gifts.length === 0) {
      _allGifts = [];
      list.innerHTML = `
        <div class="gallery-empty" style="grid-column:1/-1">
          <div class="gallery-empty-icon">💝</div>
          <div class="gallery-empty-text">还没有收到过礼物<br>美好的惊喜正在路上...</div>
        </div>`;
      return;
    }
    _allGifts = data.gifts;
    renderGrid();
    saveSnapshot();
  } catch(e) {
    if (!snapshotShown) {
      list.innerHTML = '<div class="gallery-empty" style="grid-column:1/-1"><div class="gallery-empty-text">加载失败</div></div>';
    }
  }
}

function saveSnapshot() {
  try {
    const payload = JSON.stringify({ savedAt: Date.now(), gifts: _allGifts });
    localStorage.setItem(GIFT_LIST_SNAPSHOT_KEY, payload);
    giftSharedDataBridge()?.put?.(GIFT_LIST_SNAPSHOT_KEY, payload);
  } catch(e) {}
}

function renderGrid() {
  const list = document.getElementById('galleryList');
  const alive = new Set(_allGifts.map(g => g.id));
  _selected.forEach(id => { if (!alive.has(id)) _selected.delete(id); });
  updateSelectBar();
  if (!_allGifts.length) {
    list.innerHTML = `
      <div class="gallery-empty" style="grid-column:1/-1">
        <div class="gallery-empty-icon">💝</div>
        <div class="gallery-empty-text">还没有收到过礼物<br>美好的惊喜正在路上...</div>
      </div>`;
    return;
  }
  list.innerHTML = _allGifts.map((g, i) => {
    const d = new Date(g.created_at * 1000);
    const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    return `
      <div class="gift-thumb${_selected.has(g.id) ? ' selected' : ''}" id="thumb_${g.id}" onclick="onThumbClick(${i})">
        <img class="gift-thumb-img" src="/api/gift/thumbnail/${encodeURIComponent(g.id)}" alt="礼物" loading="lazy" />
        <div class="gift-thumb-check"></div>
        <div class="gift-thumb-date">${dateStr}${g.sender ? '<span class="gift-thumb-from">from ' + escHtml(g.sender === 'connor' ? 'Connor' : 'Aion') + '</span>' : ''}</div>
      </div>`;
  }).join('');
}

function openDetail(idx) {
  const g = _allGifts[idx];
  if (!g) return;
  const d = new Date(g.created_at * 1000);
  const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const box = document.getElementById('detailBox');
  box.innerHTML = `
    <img class="gift-detail-img" src="/uploads/${escHtml(g.image_path)}" alt="礼物" />
    <div class="gift-detail-body">
      <div class="gift-detail-date">${dateStr}${g.sender ? ' · from ' + escHtml(g.sender === 'connor' ? 'Connor' : 'Aion') : ''}</div>
      <div class="gift-detail-msg">${escHtml(g.message)}</div>
      <div class="gift-detail-actions">
        <button class="btn-detail-close" onclick="closeDetail()">关闭</button>
        <button class="btn-detail-delete" onclick="askDelete('${g.id}')">删除</button>
      </div>
    </div>`;
  const overlay = document.getElementById('detailOverlay');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('show'));
}

function closeDetail() {
  const overlay = document.getElementById('detailOverlay');
  overlay.classList.remove('show');
  setTimeout(() => overlay.style.display = 'none', 300);
}

function askDelete(id) {
  _deleteId = id;
  _batchDeleteIds = null;
  closeDetail();
  document.getElementById('confirmText').textContent = '确定要删除这份礼物吗？';
  setTimeout(() => document.getElementById('confirmOverlay').classList.add('show'), 200);
}
function cancelDelete() {
  _deleteId = null;
  _batchDeleteIds = null;
  document.getElementById('confirmOverlay').classList.remove('show');
}
async function confirmDelete() {
  if (_batchDeleteIds) return confirmBatchDelete();
  if (!_deleteId) return;
  const id = _deleteId;
  cancelDelete();
  try {
    await fetch(`/api/gift/${id}`, { method: 'DELETE' });
    _allGifts = _allGifts.filter(g => g.id !== id);
    renderGrid();
    saveSnapshot();
  } catch(e) {
    showToast('删除失败');
  }
}

// 多选与批量删除
function onThumbClick(idx) {
  if (!_selecting) return openDetail(idx);
  const g = _allGifts[idx];
  if (!g) return;
  if (_selected.has(g.id)) _selected.delete(g.id); else _selected.add(g.id);
  document.getElementById('thumb_' + g.id)?.classList.toggle('selected', _selected.has(g.id));
  updateSelectBar();
}
function toggleSelectMode() {
  _selecting = !_selecting;
  _selected.clear();
  document.body.classList.toggle('selecting', _selecting);
  document.getElementById('selectModeBtn').textContent = _selecting ? '取消' : '选择';
  renderGrid();
}
function toggleSelectAll() {
  if (_selected.size === _allGifts.length) _selected.clear();
  else _allGifts.forEach(g => _selected.add(g.id));
  renderGrid();
}
function updateSelectBar() {
  document.getElementById('selectCount').textContent = `已选 ${_selected.size} 份`;
  document.getElementById('batchDelBtn').disabled = _selected.size === 0;
  document.getElementById('selectAllBtn').textContent =
    _allGifts.length && _selected.size === _allGifts.length ? '取消全选' : '全选';
}
function askBatchDelete() {
  if (!_selected.size) return;
  _batchDeleteIds = [..._selected];
  _deleteId = null;
  document.getElementById('confirmText').textContent =
    `确定要删除选中的 ${_batchDeleteIds.length} 份礼物吗？图片文件会一并删除，无法恢复。`;
  document.getElementById('confirmOverlay').classList.add('show');
}
async function confirmBatchDelete() {
  const ids = _batchDeleteIds;
  cancelDelete();
  const btn = document.getElementById('batchDelBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/gift/batch-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error('failed');
    const gone = new Set(data.deleted_ids);
    _allGifts = _allGifts.filter(g => !gone.has(g.id));
    saveSnapshot();
    toggleSelectMode();
    showToast(`已删除 ${gone.size} 份，释放 ${(data.freed_bytes / 1048576).toFixed(1)} MB`);
  } catch(e) {
    showToast('删除失败');
    updateSelectBar();
  }
}

// 测试送礼
async function testGift(sender) {
  document.getElementById('testOverlay').classList.remove('show');
  const btn = document.getElementById('testGiftBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  try {
    const res = await fetch('/api/gift/test?sender=' + sender, { method: 'POST' });
    const data = await res.json();
    showToast(data.message || '已触发');
  } catch(e) {
    showToast('请求失败');
  }
  btn.disabled = false;
  btn.textContent = '🎁 测试送礼';
}

// 初始化
connectCommonWS();
loadGifts();
</script>
</body>
</html>
