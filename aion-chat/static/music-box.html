<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e9">
  <title>小音乐盒</title>
  <link rel="icon" href="/public/music-box-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/composition-cards.css">
  <link rel="stylesheet" href="/static/music-box.css">
</head>
<body>
  <main class="music-box-shell">
    <header class="music-box-header">
      <button id="musicBoxBack" aria-label="返回小家">‹</button><h1>小音乐盒</h1>
      <button id="musicBoxGuide" class="guide-trigger" aria-haspopup="dialog" aria-controls="soundGuide">音色说明</button>
      <a href="/capabilities" title="工具能力设置" aria-label="工具能力设置">⚙</a>
    </header>
    <div class="music-box-tabs" role="tablist" aria-label="作曲者">
      <button id="tab-connor" role="tab" data-actor="connor" aria-selected="true" aria-controls="musicBoxPanel">另一位 AI</button>
      <button id="tab-aion" role="tab" data-actor="aion" aria-selected="false" tabindex="-1" aria-controls="musicBoxPanel">AI</button>
    </div>
    <section id="musicBoxPanel" role="tabpanel" aria-labelledby="tab-connor">
    <div class="music-box-filter"><span id="musicBoxCount"></span><button id="musicBoxFavorites" aria-pressed="false"><span aria-hidden="true">♡</span> 只看收藏</button></div>
    <p id="musicBoxNotice" class="music-box-notice" role="status">正在打开音乐盒…</p>
    <section id="musicBoxList" class="music-box-list" aria-label="保存的小曲"></section>
    <section id="musicBoxEmpty" class="music-box-empty" hidden><span aria-hidden="true">♫</span><h2>等一首写给你的小曲</h2><p>在工具能力里打开“作曲 · 小音乐盒”，<br>然后在聊天里说一句“给我写段钢琴曲”就好。</p><a href="/capabilities">打开工具能力 →</a></section>
    </section>
    <p class="music-box-credit">由 <a href="https://strudel.cc/" target="_blank" rel="noopener">Strudel</a> 演奏 · <a href="/static/vendor/strudel-1.3.0/NOTICE.txt" target="_blank">音色来源</a></p>
  </main>
  <dialog id="soundGuide" aria-labelledby="soundGuideTitle">
    <header><h2 id="soundGuideTitle">音色说明</h2><form method="dialog"><button aria-label="关闭音色说明" autofocus>×</button></form></header>
    <p>共 11 种音色。点曲时可以直接说乐器名字，也可以让几种声音一起演奏。</p>
    <h3>旋律乐器</h3><ul><li>钢琴</li><li>尼龙弦吉他</li><li>长笛</li><li>原声贝斯</li><li>马林巴琴</li></ul>
    <h3>鼓组</h3><ul><li>底鼓</li><li>军鼓</li><li>踩镲</li></ul>
    <h3>合成音色</h3><ul><li>正弦波</li><li>三角波</li><li>锯齿波</li></ul>
  </dialog>
  <script src="/static/theme.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/composition-cache.js?v=20261103"></script>
  <script src="/static/composition-cards.js?v=20261103"></script>
  <script src="/static/music-box.js?v=20261103"></script>
</body>
</html>
