<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff9f5">
  <title>记忆压缩</title>
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("aion_chat_theme") === "dark" ? "dark" : "light";
  </script>
  <link rel="stylesheet" href="/static/common.css">
  <link id="aion-theme-css" rel="stylesheet" href="/static/theme.css">
  <script defer src="/static/theme.js"></script>
  <style>
    :root {
      --compression-accent-soft: #f2e9ff;
      --compression-ok: #267447;
      --compression-warn: #ad4f28;
      --compression-shadow: 0 8px 24px rgba(96, 60, 110, .08);
    }
    html[data-theme="dark"],
    body[data-theme="dark"] {
      --compression-accent-soft: #302541;
      --compression-ok: #72d39b;
      --compression-warn: #ff9f7d;
      --compression-shadow: 0 10px 28px rgba(0, 0, 0, .24);
    }
    body {
      color: var(--text);
      background: var(--bg);
    }
    .sub-page {
      width: 100%;
      max-width: 1080px;
      background: var(--bg);
    }
    .top-bar {
      flex: 0 0 auto;
      min-height: 54px;
    }
    .top-bar h2 {
      min-width: 0;
      margin: 0;
    }
    .top-bar .back-btn {
      text-decoration: none;
    }
    .top-bar-spacer {
      width: 32px;
      flex: 0 0 32px;
    }
    .page-content {
      padding: 12px 14px 18px;
    }
    .intro {
      margin: 0 0 10px;
      color: var(--text2);
      font-size: 12px;
      line-height: 1.5;
    }
    .controls {
      margin: 0 0 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
    }
    label {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      color: var(--text2);
      font-size: 12px;
      font-weight: 700;
    }
    select {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 4px 28px 4px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface2);
      color: var(--text);
      font: inherit;
    }
    .note {
      grid-column: 1 / -1;
      color: var(--text3);
      font-size: 11px;
      line-height: 1.45;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--compression-shadow);
      display: flex;
      flex-direction: column;
    }
    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
    }
    .card h2 {
      margin: 0 0 5px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.35;
    }
    .card p {
      margin: 0;
      color: var(--text2);
      font-size: 11px;
      line-height: 1.5;
    }
    .count {
      min-width: 62px;
      padding: 7px 8px;
      border-radius: 10px;
      background: var(--compression-accent-soft);
      color: var(--accent);
      text-align: center;
      font-size: 10px;
      font-weight: 700;
    }
    .count strong {
      display: block;
      font-size: 20px;
      line-height: 1;
    }
    .period-details {
      margin-top: 9px;
      color: var(--text3);
      font-size: 11px;
    }
    .period-details summary {
      cursor: pointer;
      color: var(--text2);
      line-height: 1.4;
    }
    .periods {
      max-height: 84px;
      margin-top: 6px;
      padding: 7px 8px;
      overflow: auto;
      border-radius: 8px;
      background: var(--surface2);
      line-height: 1.5;
    }
    .card-actions {
      display: grid;
      gap: 7px;
      margin-top: auto;
      padding-top: 9px;
    }
    .call-estimate {
      min-height: 16px;
      color: var(--text3);
      font-size: 10px;
      line-height: 1.4;
    }
    .job-status {
      min-height: 18px;
      margin-top: 7px;
      color: var(--text3);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
    }
    .job-status.running { color: var(--accent); }
    .job-status.completed { color: var(--compression-ok); }
    .job-status.failed { color: var(--compression-warn); }
    button {
      border: 0;
      min-height: 36px;
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: .4; }
    .status {
      display: none;
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.5;
    }
    .status.info { display: block; background: var(--compression-accent-soft); color: var(--accent); }
    .status.success { display: block; background: var(--surface2); color: var(--compression-ok); }
    .status.error { display: block; background: var(--surface2); color: var(--compression-warn); }
    @media (max-width: 720px) {
      .sub-page { max-width: 600px; }
      .controls { grid-template-columns: 1fr; }
      .note { grid-column: auto; }
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="sub-page">
    <header class="top-bar">
      <a class="back-btn" href="/memory" aria-label="返回记忆库">‹</a>
      <h2>记忆压缩</h2>
      <span class="top-bar-spacer"></span>
    </header>
    <div class="page-content">
      <p class="intro">只整理已闭合周期；旧摘要进入冷档案并保留原文关系，不参与正常召回。</p>
      <section class="controls">
        <label>记忆库
          <select id="compressionTarget">
            <option value="main">主记忆库</option>
            <option value="chatroom">聊天室记忆库</option>
          </select>
        </label>
        <label>压缩模型
          <select id="compressionModel"></select>
        </label>
        <div class="note">日期以凌晨 05:00 为界；无候选时按钮禁用，也不会调用模型。</div>
      </section>

      <section class="cards">
      <article class="card" data-level="daily">
        <div class="card-head">
          <div>
            <h2>7 天外每日记忆</h2>
            <p>原始摘要按完整日期整理，每天保留 1～5 条。</p>
          </div>
          <div class="count"><strong data-count>—</strong>条参与</div>
        </div>
        <details class="period-details">
          <summary data-period-summary>正在计算候选日期……</summary>
          <div class="periods" data-periods></div>
        </details>
        <div class="job-status" data-job-status></div>
        <div class="card-actions">
          <span class="call-estimate" data-calls></span>
          <button type="button" data-run disabled>开始每日压缩</button>
        </div>
      </article>

      <article class="card" data-level="weekly">
        <div class="card-head">
          <div>
            <h2>每周记忆</h2>
            <p>整理已结束自然周中的每日胶囊，不包含本周。</p>
          </div>
          <div class="count"><strong data-count>—</strong>条参与</div>
        </div>
        <details class="period-details">
          <summary data-period-summary>正在计算候选自然周……</summary>
          <div class="periods" data-periods></div>
        </details>
        <div class="job-status" data-job-status></div>
        <div class="card-actions">
          <span class="call-estimate" data-calls></span>
          <button type="button" data-run disabled>开始每周压缩</button>
        </div>
      </article>

      <article class="card" data-level="monthly">
        <div class="card-head">
          <div>
            <h2>每月记忆</h2>
            <p>整理已结束自然月中的每周胶囊，不包含本月。</p>
          </div>
          <div class="count"><strong data-count>—</strong>条参与</div>
        </div>
        <details class="period-details">
          <summary data-period-summary>正在计算候选自然月……</summary>
          <div class="periods" data-periods></div>
        </details>
        <div class="job-status" data-job-status></div>
        <div class="card-actions">
          <span class="call-estimate" data-calls></span>
          <button type="button" data-run disabled>开始每月压缩</button>
        </div>
      </article>
      </section>
      <div id="compressionStatus" class="status"></div>
    </div>
  </main>

  <script>
    const previews = {};
    const jobs = {};
    let jobPollTimer = null;

    async function api(method, url, body) {
      const response = await fetch(url, {
        method,
        headers: body ? {"Content-Type": "application/json"} : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || data.message || `HTTP ${response.status}`);
      return data;
    }

    function status(message, kind = "info") {
      const el = document.getElementById("compressionStatus");
      el.className = `status ${kind}`;
      el.textContent = message;
    }

    function renderPreview(level, preview) {
      previews[level] = preview;
      const card = document.querySelector(`[data-level="${level}"]`);
      card.querySelector("[data-count]").textContent = Number(preview.memory_count || 0);
      card.querySelector("[data-calls]").textContent = preview.can_run
        ? `${Number(preview.period_count || 0)} 个完整周期，预计 ${Number(preview.estimated_calls || 0)} 次模型调用`
        : "没有可用周期，不会调用模型";
      const labels = (preview.periods || []).map(item => `${item.label}（${item.memory_count} 条）`);
      card.querySelector("[data-period-summary]").textContent = preview.can_run
        ? `${Number(preview.period_count || 0)} 个可压缩周期（展开查看）`
        : "暂无可压缩周期";
      card.querySelector("[data-periods]").textContent = labels.length
        ? labels.join("、")
        : "目前没有可用于本次压缩的记忆。";
      const button = card.querySelector("[data-run]");
      const job = jobs[level];
      const active = job && ["queued", "running"].includes(job.status);
      button.disabled = !preview.can_run || active;
      if (!active) button.textContent = level === "daily"
        ? "开始每日压缩"
        : level === "weekly" ? "开始每周压缩" : "开始每月压缩";
    }

    function renderJob(level, job) {
      jobs[level] = job || null;
      const card = document.querySelector(`[data-level="${level}"]`);
      const text = card.querySelector("[data-job-status]");
      const button = card.querySelector("[data-run]");
      text.className = "job-status";
      if (!job) {
        text.textContent = "";
        if (previews[level]) renderPreview(level, previews[level]);
        return;
      }
      const progress = job.progress || {};
      if (job.status === "running" || job.status === "queued") {
        text.classList.add("running");
        const calls = `${Number(progress.completed_calls || 0)}/${Number(progress.total_calls || 0)}`;
        const inputs = progress.total_inputs
          ? `，已处理 ${Number(progress.processed_inputs || 0)}/${Number(progress.total_inputs)} 条`
          : "";
        text.textContent = `${job.status === "queued" ? "排队中" : "压缩进行中"}：${progress.message || ""}（模型批次 ${calls}${inputs}）`;
        button.textContent = "压缩进行中";
        button.disabled = true;
      } else if (job.status === "completed") {
        text.classList.add("completed");
        const result = job.result || {};
        text.textContent = `上次压缩成功：处理 ${Number(result.input_count || 0)} 条，生成 ${Number(result.output_count || 0)} 条，调用模型 ${Number(result.model_calls || 0)} 次。`;
        if (previews[level]) renderPreview(level, previews[level]);
      } else if (job.status === "failed") {
        text.classList.add("failed");
        text.textContent = `上次压缩失败：${job.error || job.result?.message || "未知错误"}。旧记忆未被本次失败任务归档。`;
        if (previews[level]) renderPreview(level, previews[level]);
      }
    }

    async function loadModels() {
      const models = await api("GET", "/api/models");
      const select = document.getElementById("compressionModel");
      select.innerHTML = (models || []).map(model => {
        const key = model.key || model;
        return `<option value="${String(key).replaceAll('"', '&quot;')}">${key}</option>`;
      }).join("");
      const saved = localStorage.getItem("memory_compression_model");
      if (saved && Array.from(select.options).some(option => option.value === saved)) {
        select.value = saved;
      }
    }

    async function loadPreviews() {
      const target = document.getElementById("compressionTarget").value;
      document.querySelectorAll("[data-run]").forEach(button => button.disabled = true);
      try {
        const levels = ["daily", "weekly", "monthly"];
        const results = await Promise.all(levels.map(level =>
          api("GET", `/api/memories/calendar-compression/preview?target=${encodeURIComponent(target)}&level=${level}`)
        ));
        results.forEach((result, index) => renderPreview(levels[index], result.preview));
      } catch (error) {
        status(`候选统计失败：${error.message}`, "error");
      }
    }

    async function pollCompressionJobs(refreshPreviewsOnFinish = false) {
      const target = document.getElementById("compressionTarget").value;
      try {
        const result = await api("GET", `/api/memories/calendar-compression/jobs?target=${encodeURIComponent(target)}`);
        let finished = false;
        ["daily", "weekly", "monthly"].forEach(level => {
          const previous = jobs[level]?.status;
          const current = result.jobs?.[level] || null;
          renderJob(level, current);
          if (refreshPreviewsOnFinish && ["queued", "running"].includes(previous) &&
              current && ["completed", "failed"].includes(current.status)) {
            finished = true;
          }
        });
        if (finished) await loadPreviews();
        const hasActive = Object.values(result.jobs || {}).some(job =>
          job.status === "running" || job.status === "queued"
        );
        if (jobPollTimer) clearTimeout(jobPollTimer);
        jobPollTimer = setTimeout(() => pollCompressionJobs(true), hasActive ? 1500 : 5000);
      } catch (error) {
        if (jobPollTimer) clearTimeout(jobPollTimer);
        jobPollTimer = setTimeout(() => pollCompressionJobs(true), 5000);
      }
    }

    async function runCompression(level) {
      if (!previews[level]?.can_run || ["queued", "running"].includes(jobs[level]?.status)) return;
      const target = document.getElementById("compressionTarget").value;
      const model_key = document.getElementById("compressionModel").value;
      if (!model_key) {
        status("请先选择本次使用的模型。", "error");
        return;
      }
      const preview = previews[level];
      if (!confirm(`将使用 ${model_key} 处理 ${preview.memory_count} 条记忆、${preview.period_count} 个完整周期。旧摘要会进入冷档案。继续？`)) return;
      status(`正在创建 ${model_key} 压缩任务……`, "info");
      try {
        localStorage.setItem("memory_compression_model", model_key);
        const result = await api("POST", "/api/memories/calendar-compression/jobs", {
          target, level, model_key
        });
        if (!result.ok) {
          if (result.job) renderJob(level, result.job);
          throw new Error(result.message || "任务未创建");
        }
        renderJob(level, result.job);
        status("任务已在后台运行。你可以离开这个页面，回来后进度仍会保留。", "success");
        await pollCompressionJobs(true);
      } catch (error) {
        status(`启动失败：${error.message}`, "error");
      }
    }

    document.getElementById("compressionTarget").addEventListener("change", async () => {
      ["daily", "weekly", "monthly"].forEach(level => {
        jobs[level] = null;
        renderJob(level, null);
      });
      await Promise.all([loadPreviews(), pollCompressionJobs(false)]);
    });
    document.getElementById("compressionModel").addEventListener("change", event => {
      localStorage.setItem("memory_compression_model", event.target.value);
    });
    document.querySelectorAll("[data-run]").forEach(button => {
      button.addEventListener("click", () => runCompression(button.closest("[data-level]").dataset.level));
    });

    Promise.all([loadModels(), loadPreviews(), pollCompressionJobs(false)]).catch(error => {
      status(`页面初始化失败：${error.message}`, "error");
    });
  </script>
</body>
</html>
