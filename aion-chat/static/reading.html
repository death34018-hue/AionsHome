<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陪伴阅读</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/reading-speech.css">
<link rel="stylesheet" href="/static/reading-companion.css?v=20261028-opaque-notes">
<style>
/* 与聊天窗口共用日间 / 夜间背景，跟随现有主题切换。 */
body.reading-page { isolation: isolate; }
body.reading-page::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}
body.reading-page[data-theme="dark"]::before {
  background: url('/public/chat-bg-dark.jpg') center/100% 100% no-repeat;
}
body.reading-page[data-theme="light"]::before {
  background: url('/public/chat-bg-light.jpg') center/100% 100% no-repeat;
}
body.reading-page[data-theme="light"] {
  --bg: #eef3ff;
  --surface: rgba(247, 250, 255, 0.82);
  --surface2: rgba(229, 237, 255, 0.64);
  --border: rgba(105, 125, 210, 0.28);
  --text: #101744;
  --text2: #394370;
  --text3: #7881ad;
  --accent: #7867ff;
}
body.reading-page[data-theme="light"] :is(.top-bar, .reader-topbar, .reader-footer) {
  background: rgba(248, 251, 255, 0.72);
}
body.reading-page[data-theme="light"] .reader-content {
  background: rgba(248, 251, 255, 0.34);
}
body.reading-page[data-theme="dark"] .reader-content {
  background: rgba(8, 13, 45, 0.36);
}

/* ── 书库视图 ── */
.library-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.reader-view  { display: none; }

.upload-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  color: var(--text3);
  cursor: pointer;
  transition: border-color 0.2s;
  margin-bottom: 16px;
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--accent);
  color: var(--accent);
}
.upload-area input { display: none; }
.upload-area .upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-area .upload-text { font-size: 14px; }
.upload-area.uploading { pointer-events: none; opacity: 0.6; }

/* 书籍列表 */
.book-list { display: flex; flex-direction: column; gap: 12px; }
.book-card {
  display: flex;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.book-card:active { transform: scale(0.98); }
.book-cover {
  width: 60px;
  height: 80px;
  border-radius: 6px;
  background: var(--surface2);
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.book-cover img { width: 100%; height: 100%; object-fit: cover; }
.book-cover .no-cover { font-size: 28px; }
.book-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.book-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book-author { font-size: 12px; color: var(--text2); margin-top: 2px; }
.book-meta { font-size: 11px; color: var(--text3); margin-top: 6px; }
.book-delete {
  align-self: center;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  flex-shrink: 0;
}
.book-delete:hover { color: var(--danger); }

/* ── 阅读器视图 ── */
.reader-topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,249,245,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  flex-shrink: 0;
  z-index: 10;
}
.reader-topbar .back-reader {
  background: none; border: none; color: var(--accent);
  font-size: 20px; cursor: pointer; padding: 4px 6px;
}
.reader-topbar .chapter-title {
  flex: 1; font-size: 15px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topbar-icon-btn {
  background: none; border: none; font-size: 18px;
  cursor: pointer; padding: 4px 6px; color: var(--text);
}

/* 阅读内容区 */
.reader-viewport { position: relative; display: flex; flex: 1; min-height: 0; }
.reader-scroll-track {
  position: absolute; top: 6px; right: 2px; bottom: 80px;
  width: 3px; border-radius: 3px; background: var(--border);
  pointer-events: none;
}
.reader-scroll-thumb {
  width: 100%; border-radius: inherit; background: var(--accent); opacity: 0.75;
}
.reader-content {
  flex: 1;
  min-width: 0;
  scrollbar-width: none;
  overflow-y: auto;
  padding: 20px 18px 80px;
  font-size: 16px;
  line-height: 1.85;
  color: var(--text);
  -webkit-overflow-scrolling: touch;
}
.reader-content::-webkit-scrollbar { display: none; }
.reader-content p[data-p] {
  margin-bottom: 12px;
  text-indent: 2em;
  position: relative;
}
.reader-content .book-img {
  text-align: center;
  margin: 16px 0;
}
.reader-content .book-img img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
}

/* 底部章节导航 */
.reader-footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 16px;
  background: rgba(255,249,245,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
  max-width: 600px;
  margin: 0 auto;
}
.reader-footer button {
  background: none; border: none; color: var(--accent);
  font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px 16px;
}
.reader-footer button:disabled { color: var(--text3); cursor: default; }
.reader-footer .ch-progress { font-size: 12px; color: var(--text2); }

/* 目录面板 */
.toc-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0,0,0,0.4);
}
.toc-overlay.show { display: block; }
.toc-panel {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 280px;
  max-width: 80vw;
  background: var(--surface);
  z-index: 41;
  overflow-y: auto;
  padding: 16px;
  animation: slideRight 0.2s ease-out;
}
@keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.toc-panel h3 { font-size: 16px; margin-bottom: 12px; }
.toc-item {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toc-item:hover { background: var(--surface2); border-radius: 6px; }
.toc-item.current { color: var(--accent); font-weight: 600; }
.toc-item .toc-status {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.toc-item .toc-status.has-anno { background: #66bb6a; }
.toc-item .toc-status.no-anno { background: var(--border); }
</style>
</head>
<body class="reading-page">

<div class="sub-page">

  <!-- =========== 书库视图 =========== -->
  <div id="libraryView" class="library-view">
    <div class="top-bar">
      <button class="back-btn" onclick="history.back()">‹</button>
      <h2>📚 陪伴阅读</h2>
    </div>
    <div class="page-content">
      <!-- 上传区域 -->
      <div class="upload-area" id="uploadArea" onclick="$('fileInput').click()">
        <input type="file" id="fileInput" accept=".epub" onchange="handleUpload(this.files[0])">
        <div class="upload-icon">📖</div>
        <div class="upload-text">点击或拖拽 EPUB 文件到此处导入</div>
      </div>
      <!-- 书籍列表 -->
      <div class="book-list" id="bookList"></div>
    </div>
  </div>

  <!-- =========== 阅读器视图 =========== -->
  <div id="readerView" class="reader-view" style="display:none; flex-direction:column; height:100dvh;">
    <!-- 顶栏：返回 + 标题 + 邀请共读 + 目录 -->
    <div class="reader-topbar">
      <button class="back-reader" onclick="closeReader()">‹</button>
      <span class="chapter-title" id="chapterTitle">-</span>
      <div id="readingInvite"></div>
      <button class="topbar-icon-btn" id="readingSpeechSettings" title="朗读设置" aria-label="朗读设置">⚙</button>
      <button class="topbar-icon-btn" onclick="toggleTOC()">☰</button>
    </div>
    <div class="reading-speech-bar" id="readingSpeechBar" hidden>
      <div class="reading-speech-timeline">
        <span id="readingSpeechCurrent">0:00</span>
        <input type="range" id="readingSpeechSeek" min="0" max="0" value="0" step="0.1" disabled aria-label="朗读播放进度">
        <span id="readingSpeechDuration">已就绪 0:00</span>
      </div>
      <div class="reading-speech-controls">
        <span id="readingSpeechNow" role="status"></span>
        <span id="readingSpeechSynthesis"></span>
        <button id="readingSpeechPause" data-playing="true" hidden title="暂停" aria-label="暂停">
          <svg viewBox="0 0 20 20" aria-hidden="true"><g class="pause-icon"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></g><path class="play-icon" d="M6 3.5 16 10 6 16.5Z"/></svg>
        </button>
        <button id="readingSpeechStop" title="停止朗读" aria-label="停止朗读"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="4.5" width="11" height="11" rx="1.5"/></svg></button>
        <button id="readingSpeechRetry" hidden title="补全语音" aria-label="补全语音"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 6a6 6 0 1 0 1 7M15 2v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <!-- 内容 -->
    <div class="reader-viewport">
      <div class="reader-content" id="readerContent" onscroll="onReaderScroll()"></div>
      <div class="reader-scroll-track" id="readerScrollTrack" aria-hidden="true" hidden>
        <div class="reader-scroll-thumb" id="readerScrollThumb"></div>
      </div>
    </div>
    <!-- 底部：章节导航 -->
    <div class="reader-footer">
      <button id="prevChBtn" onclick="prevChapter()">‹ 上一章</button>
      <span class="ch-progress" id="chProgress">-</span>
      <button id="nextChBtn" onclick="nextChapter()">下一章 ›</button>
    </div>
  </div>

</div>

<!-- 高亮详情弹窗 -->
<div class="reading-speech-panel" id="readingSpeechPanel" hidden>
  <section class="reading-speech-card" role="dialog" aria-modal="true" aria-labelledby="readingSpeechTitle">
    <div class="reading-speech-heading"><h3 id="readingSpeechTitle">听伴侣读书</h3><button id="readingSpeechClose" aria-label="关闭朗读设置">✕</button></div>
    <label for="readingNarrator">这一章，由谁念给你听？</label>
    <select id="readingNarrator"></select>
    <p class="reading-speech-hint">使用群聊中配置的声音。批注和读后感由写下它们的伴侣亲口念给你听。</p>
    <div id="readingSpeechStatus" role="status"></div>
    <button id="readingSpeechStart">开始朗读</button>
  </section>
</div>

<!-- 目录面板 -->
<div class="toc-overlay" id="tocOverlay" onclick="toggleTOC()"></div>
<div class="toc-panel" id="tocPanel" style="display:none;">
  <h3>📖 目录</h3>
  <div id="tocList"></div>
</div>

<script src="/static/theme.js?v=theme-20260606"></script>
<script src="/static/common.js"></script>
<script src="/static/reading-companion.js?v=20261028"></script>
<script>
/* ======================================================
   陪伴阅读 — Phase 1：书库 + 阅读器 + 进度保存
   ====================================================== */

// ── 状态 ──
let currentBook = null;     // {book_id, title, ...}
let currentChapters = [];   // 目录数据 [{chapter_index, title, ...}]
let currentChIdx = 0;       // 当前章节
let chapterData = null;     // 当前章节详细数据
let saveProgressTimer = null;
let aiName = 'AI';          // AI 名字，从章节 API 获取
let userName = '你';         // 用户名字
let connorName = '另一位伴侣';  // Connor 名字
let askTarget = 'aion';     // 当前提问目标：'aion' | 'connor' | 'group'

ReadingCompanion.mount({content:()=>$('readerContent'), inviteHost:$('readingInvite'), onRefresh:refreshPublishedBook});

// ── 初始化 ──
connectCommonWS();
loadLibrary().then(() => {
  const bookId=new URLSearchParams(location.search).get('book');
  if(bookId)return openBook(bookId);
}).catch(e=>showToast(e.message));
setupDragDrop();

// 浮在正文边缘的进度条，不占排版宽度，也不拦截选字和滑动。
const readerContent = document.getElementById('readerContent');
const readerScrollTrack = document.getElementById('readerScrollTrack');
const readerScrollThumb = document.getElementById('readerScrollThumb');
function updateReaderScrollbar() {
  const range = readerContent.scrollHeight - readerContent.clientHeight;
  readerScrollTrack.hidden = readerContent.clientHeight === 0 || range <= 1;
  if (readerScrollTrack.hidden) return;
  const trackHeight = readerScrollTrack.clientHeight;
  const thumbHeight = Math.min(trackHeight, Math.max(24,
    trackHeight * readerContent.clientHeight / readerContent.scrollHeight));
  const progress = Math.max(0, Math.min(1, readerContent.scrollTop / range));
  readerScrollThumb.style.height = thumbHeight + 'px';
  readerScrollThumb.style.transform = `translateY(${progress * (trackHeight - thumbHeight)}px)`;
}
readerContent.addEventListener('scroll', updateReaderScrollbar, { passive: true });
readerContent.addEventListener('load', updateReaderScrollbar, true);
new ResizeObserver(updateReaderScrollbar).observe(readerContent);
new MutationObserver(updateReaderScrollbar).observe(readerContent, { childList: true, subtree: true, characterData: true });

let publishedRefreshBusy=false;
async function refreshPublishedBook() {
  if(publishedRefreshBusy || document.hidden || window.frameElement?.dataset.aionSubPageVisible==='0')return;
  if(!currentBook) { await loadLibrary(); return; }
  if(!currentBook.book_id.startsWith('theater_') || ReadingCompanion.busy)return;
  const target=currentBook, index=currentChIdx, version=chapterData?.chapter.id;
  publishedRefreshBusy=true;
  try {
    const [detail, latest]=await Promise.all([
      api('GET', `/api/books/${target.book_id}`),
      api('GET', `/api/books/${target.book_id}/chapters/${index}`)
    ]);
    if(currentBook!==target || currentChIdx!==index || chapterData?.chapter.id!==version || ReadingCompanion.busy)return;
    currentChapters=detail.chapters;
    currentBook.total_chapters=detail.book.total_chapters;
    const moved=currentChapters.find(c=>c.id===version);
    if(moved && moved.chapter_index!==index) {
      const top=$('readerContent').scrollTop;
      clearTimeout(saveProgressTimer);
      await loadChapter(moved.chapter_index);
      $('readerContent').scrollTop=top;
      saveProgress();
      return;
    }
    $('chProgress').textContent=`${index+1} / ${currentBook.total_chapters}`;
    $('nextChBtn').disabled=index>=currentBook.total_chapters-1;
    if(latest.chapter.id!==version) {
      clearTimeout(saveProgressTimer);
      ReadingCompanion.reset();
      await loadChapter(index);
      showToast('本章已更新，旧批注已清除，可以重新邀请共读');
    } else if(JSON.stringify(latest)!==JSON.stringify(chapterData)) {
      const top=$('readerContent').scrollTop;
      ReadingCompanion.setChapter(currentBook, currentChIdx, latest);
      chapterData=latest;
      $('readerContent').scrollTop=top;
    }
  } finally { publishedRefreshBusy=false; }
}
window.onAionSubPageVisibilityChanged=visible=>{
  if(visible)refreshPublishedBook().catch(()=>{});
};
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)refreshPublishedBook().catch(()=>{});
});
setInterval(()=>{
  if(currentBook?.book_id.startsWith('theater_'))refreshPublishedBook().catch(()=>{});
},10000);

// ── 书库 ────────────────────────────────────
async function loadLibrary() {
  const res = await api('GET', '/api/books');
  const list = $('bookList');
  if (!res.books || res.books.length === 0) {
    list.innerHTML = '<div class="list-empty">还没有书~<br>上传一本 EPUB 开始阅读吧</div>';
    return;
  }
  list.innerHTML = res.books.map(b => {
    const cover = b.cover_path
      ? `<img src="${escHtml(b.cover_path)}" alt="封面">`
      : '<span class="no-cover">📚</span>';
    const progress = b.current_chapter > 0
      ? `读到第 ${b.current_chapter + 1}/${b.total_chapters} 章`
      : `共 ${b.total_chapters} 章`;
    return `
      <div class="book-card" onclick="openBook('${b.book_id}')">
        <div class="book-cover">${cover}</div>
        <div class="book-info">
          <div class="book-title">${escHtml(b.title)}</div>
          <div class="book-author">${escHtml(b.author)}</div>
          <div class="book-meta">${progress}</div>
        </div>
        <button class="book-delete" onclick="event.stopPropagation(); deleteBook('${b.book_id}', '${escHtml(b.title)}')" title="删除">✕</button>
      </div>`;
  }).join('');
}

// ── 上传 ────────────────────────────────────
async function handleUpload(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.epub')) {
    showToast('只支持 EPUB 格式哦');
    return;
  }
  const area = $('uploadArea');
  area.classList.add('uploading');
  area.querySelector('.upload-text').textContent = '正在解析...';

  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/books/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '上传失败');
    showToast(`《${data.title}》导入成功！`);
    loadLibrary();
  } catch(e) {
    showToast('导入失败: ' + e.message);
  } finally {
    area.classList.remove('uploading');
    area.querySelector('.upload-text').textContent = '点击或拖拽 EPUB 文件到此处导入';
    $('fileInput').value = '';
  }
}

function setupDragDrop() {
  const area = $('uploadArea');
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleUpload(file);
  });
}

// ── 删除书籍 ──
async function deleteBook(bookId, title) {
  if (!confirm(`确认删除《${title}》？\n书籍数据和批注将全部清除。`)) return;
  await api('DELETE', `/api/books/${bookId}`);
  showToast('已删除');
  loadLibrary();
}

// ── 打开书籍 ────────────────────────────────
async function openBook(bookId) {
  const res = await api('GET', `/api/books/${bookId}`);
  if (!res.book) { showToast('书籍不存在'); return; }

  currentBook = res.book;
  currentChapters = res.chapters;

  // 切换视图
  $('libraryView').style.display = 'none';
  $('readerView').style.display = 'flex';

  // 跳到上次阅读位置
  const startCh = currentBook.current_chapter || 0;
  await loadChapter(startCh);

  // 恢复段落滚动位置
  if (currentBook.current_paragraph > 0) {
    setTimeout(() => {
      const el = document.querySelector(`[data-p="${currentBook.current_paragraph}"]`);
      if (el) el.scrollIntoView({ block: 'start' });
    }, 100);
  }
}

// ── 关闭阅读器 ──
function closeReader() {
  ReadingCompanion.reset();
  window.ReadingSpeech?.reset();
  saveProgress();
  $('libraryView').style.display = 'block';
  $('readerView').style.display = 'none';
  currentBook = null;
  chapterData = null;
  loadLibrary();
}

// ── 加载章节 ────────────────────────────────
async function loadChapter(chIdx) {
  if (!currentBook || chIdx < 0 || chIdx >= currentBook.total_chapters) return;
  window.ReadingSpeech?.reset();
  ReadingCompanion.reset();
  currentChIdx = chIdx;
  const loadingBook = currentBook;

  const res = await api('GET', `/api/books/${currentBook.book_id}/chapters/${chIdx}`);
  if (currentBook !== loadingBook || currentChIdx !== chIdx) return;
  chapterData = res;
  if (res.ai_name) aiName = res.ai_name;
  if (res.user_name) userName = res.user_name;
  if (res.connor_name) connorName = res.connor_name;
  window.ReadingSpeech?.setChapter(currentBook.book_id, chIdx, [aiName, connorName]);

  // 标题 + 字数
  const title = res.chapter.title || `第 ${chIdx + 1} 章`;
  const charCount = res.chapter.char_count || 0;
  $('chapterTitle').innerHTML = escHtml(title) + `<span style="font-size:11px;color:var(--text3);font-weight:400;margin-left:6px;">${charCount}字</span>`;
  $('chProgress').textContent = `${chIdx + 1} / ${currentBook.total_chapters}`;

  // 导航按钮
  $('prevChBtn').disabled = chIdx <= 0;
  $('nextChBtn').disabled = chIdx >= currentBook.total_chapters - 1;

  ReadingCompanion.setChapter(currentBook, currentChIdx, res);

  // 滚动到顶部
  $('readerContent').scrollTop = 0;

  // 保存进度
  currentBook.current_chapter = chIdx;
  saveProgress();
}

// ── 章节导航 ──
function prevChapter() { loadChapter(currentChIdx - 1); }
function nextChapter() { loadChapter(currentChIdx + 1); }

// ── 目录面板 ──
function toggleTOC() {
  const overlay = $('tocOverlay');
  const panel = $('tocPanel');
  const show = !overlay.classList.contains('show');
  overlay.classList.toggle('show', show);
  panel.style.display = show ? 'block' : 'none';
  if (show) renderTOC();
}

function renderTOC() {
  $('tocList').innerHTML = currentChapters.map(ch => {
    const isCurrent = ch.chapter_index === currentChIdx;
    const segments = ch.segments_meta || [];
    const hasAnno = segments.some(s => s.status === 'done');
    return `<div class="toc-item ${isCurrent ? 'current' : ''}"
                 onclick="loadChapter(${ch.chapter_index}); toggleTOC();">
      <span class="toc-status ${hasAnno ? 'has-anno' : 'no-anno'}"></span>
      ${escHtml(ch.title || '第 ' + (ch.chapter_index + 1) + ' 章')}
    </div>`;
  }).join('');
}

// ── 进度保存 ──
function onReaderScroll() {
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(saveProgress, 1500);
}

function saveProgress() {
  if (!currentBook) return;
  // 找当前屏幕最上方可见段落
  const paragraphs = $('readerContent').querySelectorAll('[data-p]');
  const containerTop = $('readerContent').scrollTop;
  let visibleP = 0;
  for (const p of paragraphs) {
    if (p.offsetTop >= containerTop) {
      visibleP = parseInt(p.dataset.p) || 0;
      break;
    }
  }
  api('PUT', `/api/books/${currentBook.book_id}/progress`, {
    chapter: currentChIdx,
    chapter_id: chapterData?.chapter.id,
    paragraph: visibleP
  }).catch(e=>{if(e.status===409)refreshPublishedBook().catch(()=>{});});
}

</script>

<script src="/static/reading-speech.js"></script>
</body>
