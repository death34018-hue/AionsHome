<script id="subpage-navigation">
// Shared by the early desktop and the full chat shell; no extra startup request.
window.AionSubPageNavigation = (() => {
  const panel = document.getElementById('subPageLoading');
  const label = document.getElementById('subPageLoadingText');
  const retryButton = document.getElementById('subPageLoadingRetry');
  const watched = new WeakSet();
  let active = null, timer = null;
  function hide() {
    clearTimeout(timer);
    panel.hidden = true;
    active = null;
  }
  function ready(frame) {
    delete frame.dataset.navigationPending;
    frame.dataset.navigationReady = '1';
    frame.style.visibility = 'visible';
    if (active === frame) hide();
  }
  function show(frame) {
    hide();
    active = frame;
    if (!watched.has(frame)) {
      watched.add(frame);
      frame.addEventListener('load', () => {
        // Ignore the empty document created when an iframe is first attached.
        try {
          if (frame.contentWindow.location.href === 'about:blank') return;
        } catch (_) {
          // A browser error document (or expired external login) is unreadable.
          // Keep recovery controls available instead of leaving a blank frame.
          frame.dataset.navigationFailed = '1';
          if (active === frame) {
            clearTimeout(timer);
            label.textContent = '页面暂时无法打开，请检查连接后重试';
            retryButton.hidden = false;
          }
          return;
        }
        ready(frame);
      });
    }
    if (frame.dataset.navigationReady === '1') return;
    frame.dataset.navigationPending = '1';
    frame.style.visibility = 'hidden';
    label.textContent = '正在打开页面…';
    retryButton.hidden = true;
    panel.hidden = false;
    timer = setTimeout(() => {
      label.textContent = '连接较慢，可以继续等待或重试';
      retryButton.hidden = false;
    }, 15000);
  }
  function retry() {
    if (!active) return;
    const url = active.src;
    active.dataset.navigationFailed = '1';
    window.openSubPage(url);
  }
  return { show, hide, retry, ready };
})();
</script>
<script id="initial-desktop">
// Start the desktop before any external chat script can block the parser.
// chat.js adopts this same frame once it is ready, preserving early navigation.
(() => {
  const launchParams = new URLSearchParams(location.search);
  if (launchParams.has('conv')) return;
  // Native wakeups enter /chat, with the requested feature inside its shell.
  // This preserves shared back navigation and the status-bar inset for every page.
  let startupPage = '/';
  try {
    const target = new URL(launchParams.get('page') || '/', location.origin);
    if (target.origin === location.origin && !/^\/chat\/?$/.test(target.pathname)) {
      startupPage = target.pathname + target.search + target.hash;
    }
  } catch (_) {}
  const overlay = document.getElementById('subPageOverlay');
  let frame = document.createElement('iframe');
  frame.className = 'sub-page-frame';
  frame.dataset.startupFrame = '1';
  frame.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-popups allow-modals');
  frame.setAttribute('allow', 'autoplay');
  frame.style.display = 'block';
  document.getElementById('subPageFrames').appendChild(frame);
  window.openSubPage = url => {
    const target = new URL(url, location.origin);
    window.__aionStartupPage = url;
    frame.dataset.startupPath = target.pathname;
    if (frame.src !== target.href || frame.dataset.navigationFailed === '1') {
      // A fresh frame cannot expose the previous document during a slow request.
      const replacement = frame.cloneNode(false);
      replacement.removeAttribute('src');
      delete replacement.dataset.navigationReady;
      delete replacement.dataset.navigationFailed;
      frame.replaceWith(replacement);
      frame = replacement;
      window.AionSubPageNavigation.show(frame);
      frame.src = target.href;
    }
    overlay.classList.toggle('home-subpage', target.pathname === '/');
    overlay.classList.add('show');
  };
  window.closeSubPage = () => {
    window.__aionStartupPage = '/chat';
    overlay.classList.remove('show');
    window.AionSubPageNavigation.hide();
  };
  window.openWhisper = () => { window.__aionStartupWhisper = true; };
  window.handleNativeBack = () => {
    if (window.__aionStartupPage === '/') return 'dialog';
    if (new URL(window.__aionStartupPage, location.origin).pathname === '/lounge-board') {
      try { if (frame.contentWindow?.handleLoungeBoardBack?.()) return 'handled'; } catch(e) {}
    }
    window.openSubPage('/');
    return 'handled';
  };
  window.openSubPage(startupPage);
})();
</script>
