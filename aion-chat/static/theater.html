<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小剧场</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/public/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050923">
<style>
:root {
  --bg: #050923;
  --surface: rgba(10, 15, 48, 0.64);
  --surface2: rgba(31, 39, 101, 0.48);
  --surface3: rgba(78, 92, 186, 0.22);
  --border: rgba(141, 151, 255, 0.34);
  --border-strong: rgba(159, 120, 255, 0.62);
  --text: #f5f7ff;
  --text2: #c5c9ef;
  --text3: #8f97cf;
  --accent: #8e6cff;
  --accent2: #39a7ff;
  --accent3: #ef8dff;
  --user-bg: rgba(123, 72, 218, 0.68);
  --ai-bg: rgba(20, 64, 139, 0.62);
  --danger: #ff5c8a;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,0.2); }

.app { display: flex; height: 100dvh; }

/* ── 侧栏 ── */
.sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 10px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
.sidebar-header button { flex:1; padding: 10px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
.sidebar-header button:hover { background: var(--accent2); }
.sidebar-header .home-btn { flex:none; width:40px; background:var(--surface2); color:var(--text); font-size:18px; }
.sidebar-header .home-btn:hover { background:var(--border); }
.conv-list { flex:1; overflow-y: auto; padding: 4px 6px; }
.conv-item { padding: 11px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 1px; }
.conv-item:hover { background: var(--surface2); }
.conv-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
.conv-item .title { flex:1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--text); }
.conv-item .del-btn { display: none; background: none; border: none; color: var(--danger); font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.conv-item:hover .del-btn { display: block; }
.conv-item .rename-btn { display: none; background: none; border: none; color: var(--text2); font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.conv-item:hover .rename-btn { display: block; }
.conv-count { font-size:11px; color:var(--text3); background:var(--surface2); border-radius:8px; padding:1px 6px; flex-shrink:0; white-space:nowrap; }

/* ── 聊天区 ── */
.chat-area { flex:1; display: flex; flex-direction: column; min-width: 0; position: relative; }

.chat-header { padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: rgba(9, 13, 43, 0.58); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); display: flex; align-items: center; gap: 10px; min-height: 48px; position: absolute; top: 0; left: 0; right: 0; z-index: 8; box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06); }
.chat-header .menu-btn { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 4px; }
.chat-header .title { flex:1; font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: var(--text); }
.chat-header select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; outline: none; }
.config-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:14px; cursor:pointer; flex-shrink:0; }
.config-btn:hover { border-color:var(--text2); }

/* ── 顶部 TTS 播放器（位于标题栏下方，不遮挡菜单和设置按钮） ── */
.tts-top-player { display:none; position:absolute; top: calc(60px + env(safe-area-inset-top)); left:12px; right:12px; z-index:7; min-height:48px; padding:8px 10px; align-items:center; gap:8px; border:1px solid var(--border); border-radius:12px; background:rgba(17,22,61,0.94); box-shadow:0 8px 24px rgba(0,0,0,0.25); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.tts-top-player.show { display:flex; }
.tts-top-player button { width:30px; height:30px; flex-shrink:0; border:1px solid var(--border); border-radius:50%; background:var(--surface2); color:var(--text); cursor:pointer; line-height:1; }
.tts-top-player button:hover { border-color:var(--accent); }
.tts-top-player .tts-time { min-width:42px; color:var(--text2); font-size:11px; font-variant-numeric:tabular-nums; text-align:center; }
.tts-top-player input[type="range"] { flex:1; min-width:60px; accent-color:var(--accent); cursor:pointer; }
.tts-top-player input[type="range"]:disabled { cursor:default; opacity:0.45; }
.chat-area.tts-player-open .messages { padding-top:116px; }

/* ── 配置弹窗 ── */
.config-popup { display:none; position:absolute; right:16px; top:52px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; z-index:15; min-width:260px; box-shadow:0 8px 24px rgba(0,0,0,0.4); max-height:calc(100dvh - 70px); overflow-y:auto; }
.config-popup.show { display:block; }
.config-popup label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; margin-top:10px; }
.config-popup label:first-child { margin-top:0; }
.config-popup select { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; font-size:13px; outline:none; }
.config-popup .slider-row { display:flex; align-items:center; gap:8px; margin-top:4px; }
.config-popup input[type="range"] { flex:1; accent-color:var(--accent); cursor:pointer; }
.config-popup .slider-val { font-size:13px; color:var(--text); min-width:40px; text-align:right; }

/* ── 角色选择区 ── */
.persona-section { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.persona-card { display:flex; align-items:center; gap:8px; padding:8px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; margin-top:6px; cursor:pointer; }
.persona-card:hover { border-color:var(--accent); }
.persona-card.active { border-color:var(--accent); background:rgba(200,149,108,0.1); }
.persona-card .p-name { flex:1; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.persona-card .p-actions { display:flex; gap:4px; }
.persona-card .p-actions button { background:none; border:none; color:var(--text3); font-size:13px; cursor:pointer; padding:2px 4px; }
.persona-card .p-actions button:hover { color:var(--text); }
.persona-add-btn { width:100%; margin-top:6px; padding:8px; background:none; border:1px dashed var(--border); border-radius:8px; color:var(--text3); font-size:13px; cursor:pointer; }
.persona-add-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ── 角色编辑弹窗 ── */
.persona-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; }
.persona-modal-overlay.show { display:flex; }
.persona-modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; width:90vw; max-width:440px; max-height:80vh; overflow-y:auto; }
.persona-modal h3 { font-size:16px; margin-bottom:16px; color:var(--text); }
.persona-modal label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; margin-top:12px; }
.persona-modal label:first-of-type { margin-top:0; }
.persona-modal input, .persona-modal select { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; outline:none; }
.persona-modal textarea { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; outline:none; min-height:120px; resize:vertical; font-family:inherit; }
.persona-modal .btn-row { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
.persona-modal .btn-row button { padding:8px 18px; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
.persona-modal .btn-save { background:var(--accent); color:#fff; }
.persona-modal .btn-save:hover { opacity:0.85; }
.persona-modal .btn-cancel { background:var(--surface2); color:var(--text); }

/* ── TTS 开关 ── */
.tts-section { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.tts-toggle-row { display:flex; align-items:center; gap:8px; }
.tts-toggle-row span { flex:1; font-size:13px; color:var(--text2); }
.toggle-switch { position:relative; width:42px; height:24px; cursor:pointer; flex-shrink:0; }
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:var(--surface2); border:1px solid var(--border); border-radius:12px; transition:0.2s; }
.toggle-slider:before { content:""; position:absolute; height:18px; width:18px; left:2px; top:2px; background:var(--text3); border-radius:50%; transition:0.2s; }
.toggle-switch input:checked + .toggle-slider { background:var(--accent); border-color:var(--accent); }
.toggle-switch input:checked + .toggle-slider:before { transform:translateX(18px); background:#fff; }

/* ── 消息列表 ── */
.messages { flex:1; overflow-y: auto; padding: 16px; padding-top: 60px; display: flex; flex-direction: column; gap: 6px; }

.msg-row { display: flex; flex-direction: column; width: 100%; margin-bottom: 2px; }
.msg-header { display:flex; align-items:center; gap:6px; padding:0 2px 4px; position:relative; }
.msg-row.user .msg-header { flex-direction:row-reverse; }
.msg-avatar { width:28px; height:28px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.tts-replay-btn { background:none; border:none; cursor:pointer; font-size:13px; padding:2px; opacity:0.45; transition:opacity 0.2s; line-height:1; flex-shrink:0; }
.tts-replay-btn:hover { opacity:1; }
.tts-replay-btn.playing { opacity:1; animation: ttsGlow 1s ease-in-out infinite alternate; }
@keyframes ttsGlow { from { opacity:0.7; } to { opacity:1; } }
.msg-role-name { font-size:12px; font-weight:500; }
.msg-row.user .msg-role-name { color:var(--accent); }
.msg-row.assistant .msg-role-name { color:#8ab87a; }
.msg-time { font-size: 10px; color: var(--text3); }
.msg-actions { position:relative; display:flex; align-items:center; flex-shrink:0; }
.msg-dots { background:none; border:none; color:var(--text3); font-size:14px; cursor:pointer; padding:0 4px; line-height:1; display:none; }
.msg-dots:hover { color:var(--text); }
.msg-row:hover .msg-dots { display:inline; }
.msg-menu { display:none; position:absolute; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 0; z-index:16; box-shadow:0 4px 16px rgba(0,0,0,0.3); white-space:nowrap; }
.msg-row.user .msg-menu { right:0; }
.msg-row.assistant .msg-menu { left:0; }
.msg-menu.show { display:block; }
.msg-menu button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:7px 16px; font-size:13px; cursor:pointer; }
.msg-menu button:hover { background:var(--surface2); }

.msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.65; word-break: break-word; font-weight: 450; }
.msg-row.user .msg-bubble { background: linear-gradient(180deg, rgba(131, 80, 226, 0.32), rgba(77, 45, 158, 0.30)); color: var(--text); border-top-right-radius: 4px; border: 1px solid rgba(210, 142, 255, 0.52); box-shadow: inset 0 1px 1px rgba(255,255,255,0.18), inset 0 -10px 28px rgba(54,20,110,0.12), 0 0 24px rgba(147, 91, 255, 0.22), 0 10px 30px rgba(0,0,0,0.16); }
.msg-row.assistant .msg-bubble { background: linear-gradient(180deg, rgba(37, 92, 183, 0.28), rgba(17, 41, 103, 0.26)); color: var(--text); border-top-left-radius: 4px; border: 1px solid rgba(108, 177, 255, 0.44); box-shadow: inset 0 1px 1px rgba(255,255,255,0.16), inset 0 -10px 26px rgba(9,16,48,0.10), 0 10px 28px rgba(0,0,0,0.16); }
.msg-bubbles { display:flex; flex-direction:column; gap:3px; }
.msg-reasoning { margin-bottom:3px; border:1px solid rgba(142,108,255,0.32); border-radius:12px; background:rgba(16,20,61,0.52); overflow:hidden; }
.msg-reasoning summary { display:flex; align-items:center; gap:7px; padding:8px 12px; color:var(--text2); font-size:12px; cursor:pointer; list-style:none; user-select:none; }
.msg-reasoning summary::-webkit-details-marker { display:none; }
.msg-reasoning summary::before { content:"›"; color:var(--accent3); font-size:17px; line-height:1; transition:transform 0.18s ease; }
.msg-reasoning[open] summary::before { transform:rotate(90deg); }
.msg-reasoning-status { margin-left:auto; color:var(--text3); font-size:11px; }
.msg-reasoning.is-streaming .msg-reasoning-status::after { content:""; display:inline-block; width:5px; height:5px; margin-left:5px; border-radius:50%; background:var(--accent3); animation:reasoningPulse 1.2s ease-in-out infinite; vertical-align:1px; }
.msg-reasoning-content { max-height:260px; overflow:auto; padding:0 12px 11px 31px; border-top:1px solid rgba(142,108,255,0.16); color:var(--text2); white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; line-height:1.65; }
@keyframes reasoningPulse { 0%,100% { opacity:0.35; } 50% { opacity:1; } }

.msg-bubble.editing { background:var(--surface2) !important; }
.msg-bubble textarea { width:100%; background:transparent; color:var(--text); border:none; outline:none; font-size:15px; line-height:1.65; resize:none; font-family:inherit; min-height:60px; }
.edit-actions { display:flex; gap:6px; margin-top:6px; justify-content:flex-end; }
.edit-actions button { padding:4px 12px; border:none; border-radius:6px; font-size:12px; cursor:pointer; }
.edit-actions .save-btn { background:var(--accent); color:#fff; }
.edit-actions .cancel-btn { background:var(--surface2); color:var(--text); }

/* ── 系统消息 ── */
.system-msg { text-align:center; font-size:12px; color:var(--text3); padding:4px 12px; }

/* ── AI 输入等待 ── */
.typing-bubble { display:inline-flex; align-items:center; gap:4px; }
.typing-bubble .typing-text { color:var(--text3); font-size:13px; transition: opacity 0.3s; }
.typing-bubble .typing-dots { display:inline-flex; gap:3px; margin-left:2px; vertical-align:middle; }
.typing-bubble .typing-dots span { width:4px; height:4px; border-radius:50%; background:var(--text3); animation:dotBounce 1.4s infinite ease-in-out both; }
.typing-bubble .typing-dots span:nth-child(1) { animation-delay:0s; }
.typing-bubble .typing-dots span:nth-child(2) { animation-delay:0.16s; }
.typing-bubble .typing-dots span:nth-child(3) { animation-delay:0.32s; }
@keyframes dotBounce { 0%,80%,100% { transform: scale(0.4); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

/* ── 输入区 ── */
.input-box { position:relative; padding: 10px 16px 12px; border-top: 1px solid var(--border); background: var(--surface); }
.message-nav { position:absolute; top:-70px; right:10px; z-index:6; display:flex; flex-direction:column; gap:5px; opacity:0.32; transition:opacity 0.18s ease; }
.message-nav:hover, .message-nav:focus-within { opacity:0.92; }
.message-nav button { width:28px; height:28px; border:1px solid var(--border); border-radius:50%; background:rgba(17,22,61,0.84); color:var(--text2); font-size:15px; line-height:1; cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,0.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.message-nav button:hover { color:var(--text); border-color:var(--accent); }
.message-nav button:active { transform:scale(0.92); }
.message-nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.preview-area { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
.preview-area:empty { display:none; }
.preview-item { position:relative; width:60px; height:60px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
.preview-item img { width:100%; height:100%; object-fit:cover; }
.preview-item .remove-btn { position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:12px; cursor:pointer; line-height:1; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-row textarea { flex:1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 15px; outline: none; max-height: 120px; line-height: 1.5; font-family: inherit; background: var(--surface2); color: var(--text); }
.input-row textarea::placeholder { color: var(--text3); }
.send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.send-btn:hover { background: var(--accent2); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.upload-btn { width:42px; height:42px; border-radius:50%; border:1px solid var(--border); background:var(--surface2); color:var(--text2); font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.upload-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ── 加载更多 ── */
.load-more-btn { display:block; margin:8px auto; padding:6px 16px; background:var(--surface2); color:var(--text2); border:1px solid var(--border); border-radius:8px; font-size:12px; cursor:pointer; }
.load-more-btn:hover { border-color:var(--accent); color:var(--accent); }

/* ── 抽屉遮罩 ── */
.sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:19; }
.sidebar-overlay.show { display:block; }

/* ── Toast ── */
.toast-msg { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.75); color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; }
.toast-msg.show { opacity:1; }

/* ── 附件显示 ── */
.msg-attachments { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.msg-attachments img { max-width:200px; max-height:200px; border-radius:8px; cursor:pointer; object-fit:cover; border:1px solid var(--border); }
.msg-attachments video { max-width:260px; border-radius:8px; border:1px solid var(--border); }

/* ── 手机适配 ── */
@media (max-width: 768px) {
  .sidebar { position:fixed; left:-280px; top:0; bottom:0; z-index:20; transition:left 0.3s; }
  .sidebar.open { left:0; }
  .chat-header .menu-btn { display:block; }
  .msg-bubble { font-size: 14px; padding: 9px 12px; }
  .messages { padding: 10px 0; padding-top: calc(56px + env(safe-area-inset-top)); gap: 4px; }
  .chat-area.tts-player-open .messages { padding-top: calc(112px + env(safe-area-inset-top)); }
  .tts-top-player { left:8px; right:8px; gap:5px; padding-left:7px; padding-right:7px; }
  .tts-top-player .tts-time { min-width:38px; font-size:10px; }
  .msg-avatar { width:24px; height:24px; }
  .message-nav { right:6px; }
}
</style>
</head>
<body class="theater-page" data-theme="dark">
<div class="app">
  <!-- 侧栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="home-btn" onclick="location.href='/'">🏠</button>
      <button onclick="newConversation()">＋ 新剧场</button>
    </div>
    <div class="conv-list" id="convList"></div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- 聊天区 -->
  <div class="chat-area">
    <div class="chat-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="title" id="chatTitle" onclick="renameCurrent()">小剧场</div>
      <button class="config-btn" onclick="toggleConfig(event)">⚙</button>
      <div class="config-popup" id="configPopup">
        <label>模型</label>
        <select id="modelSelect" onchange="changeModel()"></select>

        <label>上下文条数</label>
        <div class="slider-row">
          <input type="range" id="contextSlider" min="1" max="100" value="20"
            oninput="$('contextVal').textContent=this.value; localStorage.setItem('theater_context_limit',this.value)">
          <span class="slider-val" id="contextVal">20</span>
        </div>

        <label>温度</label>
        <div class="slider-row">
          <input type="range" id="tempSlider" min="0" max="2" step="0.1" value="0.8"
            oninput="$('tempVal').textContent=this.value; localStorage.setItem('theater_temperature',this.value)">
          <span class="slider-val" id="tempVal">0.8</span>

  <div class="persona-modal">

      <button class="btn-cancel" onclick="closePersonaModal()">取消</button>

<!-- Toast -->
<div class="toast-msg" id="toast"></div>

<script src="/static/theme.js?v=theme-20260621-theater"></script>
<script src="/static/theater_tts_queue.js?v=theater-tts-20260713"></script>
<script>
/* ══════════════════════════════════════════════════
   小剧场 — 独立聊天功能，不涉及记忆库
   ══════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);

/* ── 全局状态 ── */
let conversations = [];
let currentConvId = null;
let currentMessages = [];
let hasMoreMessages = false;
let isStreaming = false;
let pendingAttachments = [];
let personas = [];
let currentPersonaId = "";
let models = [];

/* ── TTS 状态 ── */
let ttsEnabled = false;
let ttsVoice = "";
let ttsQueue = new Map();
let ttsMergedUrls = new Map();
let ttsPlaying = false;
let currentAudio = null;
let manualReplay = null;
let activeTTS = null;
let ttsPlaybackToken = 0;
let ttsSuppressedMessages = new Set();
let ttsDeletedMessages = new Set();
let ttsDeletedConversations = new Set();
let ttsMessageConversations = new Map();
let ttsLiveMessages = new Set();
let pendingManualReplayMsgId = null;
let ttsPlaybackActiveAt = Date.now() / 1000;
const theaterClientId = localStorage.getItem('theater_client_id') || (() => {
  const id = `theater_${Date.now()}_${Math.random().toString(36).slice(2)}`;
  localStorage.setItem('theater_client_id', id);
  return id;
})();

/* ── API 封装 ── */
async function api(method, url, body) {
  const opts = { method, headers: {"Content-Type": "application/json"} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

/* ── Toast ── */
let _toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ── HTML 转义 ── */
function escHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* ── 初始化 ── */
async function init() {
  // 加载模型列表
  try {
    const m = await api('GET', '/api/models');
    models = Array.isArray(m) ? m.map(x => x.key || x) : [];
  } catch(e) { models = []; }
  populateModelSelects();

  var savedCtx = localStorage.getItem('theater_context_limit');
  if (savedCtx) { $('contextSlider').value = savedCtx; $('contextVal').textContent = savedCtx; }
  var savedTemp = localStorage.getItem('theater_temperature');
  if (savedTemp) { $('tempSlider').value = savedTemp; $('tempVal').textContent = savedTemp; }
  var savedTts = localStorage.getItem('theater_tts_enabled');
  if (savedTts === 'true') { ttsEnabled = true; $('ttsToggle').checked = true; }
  var savedVoice = localStorage.getItem('theater_tts_voice');
  if (savedVoice) ttsVoice = savedVoice;

  // 加载 TTS 音色列表
  await loadTTSVoices();

  // 加载角色
  personas = await api('GET', '/api/theater/personas');
  renderPersonaList();

  // 加载对话列表
  conversations = await api('GET', '/api/theater/conversations');
  renderConvList();

  // 自动选择第一个对话
  if (conversations.length) selectConv(conversations[0].id);

  // WebSocket
  connectWS();
}

/* ── 模型下拉 ── */
function populateModelSelects() {
  const opts = models.map(m => `<option value="${m}">${m}</option>`).join('');
  $('modelSelect').innerHTML = opts;
}

/* ── TTS 音色加载 ── */
async function loadTTSVoices() {
  try {
    const res = await api('GET', '/api/tts/voices');
    const sel = $('ttsVoiceSelect');
    sel.innerHTML = '';
    const voices = res.voices || (Array.isArray(res) ? res : []);
    if (voices.length) {
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.uri || v.customized_model_id || v.name || '';
        opt.textContent = v.customName || v.uri || v.name || '未知';
        sel.appendChild(opt);
      });
    } else {
      sel.innerHTML = '<option value="">无可用音色</option>';
    }
    if (ttsVoice && [...sel.options].some(o => o.value === ttsVoice)) {
      sel.value = ttsVoice;
    } else if (sel.options.length && sel.options[0].value) {
      ttsVoice = sel.options[0].value;
    }
    localStorage.setItem('theater_tts_voice', ttsVoice);
  } catch(e) {}
}

function toggleTTS() {
  ttsEnabled = $('ttsToggle').checked;
  localStorage.setItem('theater_tts_enabled', ttsEnabled);
  ttsPlaybackActiveAt = Date.now() / 1000;
  sendTTSState();
  if (!ttsEnabled) stopTTSPlayback();
}

function changeTTSVoice() {
  ttsVoice = $('ttsVoiceSelect').value;
  localStorage.setItem('theater_tts_voice', ttsVoice);
  ttsPlaybackActiveAt = Date.now() / 1000;
  sendTTSState();
}

function sendTTSState() {
  if (_ws && _ws.readyState === WebSocket.OPEN) {
    _ws.send(JSON.stringify({
      type: 'tts_state',
      enabled: ttsEnabled && !!ttsVoice,
      voice: ttsVoice,
      can_play: true,
      active_at: ttsPlaybackActiveAt,
      client_id: theaterClientId
    }));
  }
}

let ttsPlaybackStateLastSent = 0;
function bumpTTSPlaybackState() {
  const now = Date.now();
  if (now - ttsPlaybackStateLastSent < 1000) return;
  ttsPlaybackStateLastSent = now;
  ttsPlaybackActiveAt = now / 1000;
  sendTTSState();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') bumpTTSPlaybackState();
  else sendTTSState();
});
window.addEventListener('focus', bumpTTSPlaybackState);
window.addEventListener('pageshow', bumpTTSPlaybackState);
window.addEventListener('pagehide', sendTTSState);
document.addEventListener('pointerdown', bumpTTSPlaybackState, { passive: true });
document.addEventListener('keydown', bumpTTSPlaybackState);

/* ── WebSocket ── */
let _ws = null;
let _wsReconnectTimer = null;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  _ws = new WebSocket(`${proto}//${location.host}/ws`);
  _ws.onopen = () => {
    clearInterval(_wsReconnectTimer);
    _ws.send(JSON.stringify({ type: 'register_client', client_id: theaterClientId }));
    sendTTSState();
  };
  _ws.onmessage = e => {
    try { handleSync(JSON.parse(e.data)); } catch(err) {}
  };
  _ws.onclose = () => {
    _wsReconnectTimer = setInterval(() => {
      if (!_ws || _ws.readyState > 1) connectWS();
    }, 3000);
  };
  _ws.onerror = () => {};
}

function handleSync(msg) {
  const d = msg.data;
  switch (msg.type) {
    case 'theater_conv_created':
      ttsDeletedConversations.delete(d.id);
      if (!conversations.find(c => c.id === d.id)) {
        conversations.unshift(d);
        renderConvList();
      }
      break;
    case 'theater_conv_updated':
      for (const c of conversations) {
        if (c.id === d.id) {
          if (d.title) c.title = d.title;
          if (d.model) c.model = d.model;
          if (d.persona_id !== undefined) c.persona_id = d.persona_id;
        }
      }
      renderConvList();
      if (d.id === currentConvId && d.title) $('chatTitle').textContent = d.title;
      break;
    case 'theater_conv_deleted':
      discardConversationTTS(d.id);
      conversations = conversations.filter(c => c.id !== d.id);
      renderConvList();
      if (d.id === currentConvId) {
        currentConvId = null;
        currentMessages = [];
        renderMessages();
        $('chatTitle').textContent = '小剧场';
      }
      break;
    case 'theater_msg_created':
      if (ttsDeletedConversations.has(d.conv_id)) {
        discardMessageTTS(d.id, true);
        break;
      }
      if (d.id && d.conv_id) ttsMessageConversations.set(d.id, d.conv_id);
      if (d.conv_id === currentConvId && !currentMessages.find(m => m.id === d.id)) {
        currentMessages.push(d);
        renderMessages();
        scrollBottom();
      }
      // 更新侧栏消息数
      for (const c of conversations) {
        if (c.id === d.conv_id) { c.message_count = (c.message_count || 0) + 1; renderConvList(); break; }
      }
      break;
    case 'theater_msg_updated':
      for (let i = 0; i < currentMessages.length; i++) {
        if (currentMessages[i].id === d.id) { currentMessages[i] = d; renderMessages(); break; }
      }
      break;
    case 'theater_msg_deleted':
      discardMessageTTS(d.id, true);
      currentMessages = currentMessages.filter(m => m.id !== d.id);
      renderMessages();
      for (const c of conversations) {
        if (c.id === d.conv_id) { c.message_count = Math.max(0, (c.message_count || 0) - 1); renderConvList(); break; }
      }
      break;
    case 'tts_chunk':
      if (ttsEnabled) handleTTSChunk(d);
      break;
    case 'tts_done':
      handleTTSDone(d);
      break;
    case 'tts_merged':
      handleTTSMerged(d);
      break;
  }
}

/* ── 对话列表 ── */
function renderConvList() {
  const el = $('convList');
  el.innerHTML = conversations.map(c => `
    <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" onclick="selectConv('${c.id}')">
      <span class="title">${escHtml(c.title)}</span>
      <span class="conv-count">${c.message_count || 0}</span>
      <button class="rename-btn" onclick="event.stopPropagation();renameConv('${c.id}')">✏</button>
      <button class="del-btn" onclick="event.stopPropagation();delConv('${c.id}')">✕</button>
    </div>
  `).join('');
}

async function selectConv(id) {
  currentConvId = id;
  renderConvList();
  closeSidebar();
  const conv = conversations.find(c => c.id === id);
  if (conv) {
    $('chatTitle').textContent = conv.title;
    if (conv.model) $('modelSelect').value = conv.model;
    currentPersonaId = conv.persona_id || "";
    renderPersonaList();
  }
  const msgs = await api('GET', `/api/theater/conversations/${id}/messages?limit=50`);
  currentMessages = msgs;
  hasMoreMessages = msgs.length >= 50;
  renderMessages();
  scrollBottom();
}

let _creating = false;
async function newConversation() {
  if (_creating) return;
  _creating = true;
  try {
    const model = $('modelSelect').value;
    const conv = await api('POST', '/api/theater/conversations', { title: '新剧场', persona_id: currentPersonaId, model });
    if (!conversations.find(c => c.id === conv.id)) conversations.unshift(conv);
    renderConvList();
    await selectConv(conv.id);
  } finally { _creating = false; }
}

async function delConv(id) {
  if (!confirm('删除这个剧场对话？')) return;
  const deletedMessageIds = id === currentConvId ? currentMessages.map(m => m.id) : [];
  discardConversationTTS(id);
  try {
    await api('DELETE', `/api/theater/conversations/${id}`);
  } catch (error) {
    ttsDeletedConversations.delete(id);
    throw error;
  }
  deletedMessageIds.forEach(msgId => discardMessageTTS(msgId, true));
  conversations = conversations.filter(c => c.id !== id);
  renderConvList();
  if (id === currentConvId) {
    currentConvId = null;
    currentMessages = [];
    renderMessages();
    $('chatTitle').textContent = '小剧场';
  }
}

async function renameConv(id) {
  const c = conversations.find(x => x.id === id);
  const name = prompt('重命名', c ? c.title : '');
  if (!name) return;
  await api('PUT', `/api/theater/conversations/${id}`, { title: name });
  if (c) c.title = name;
  renderConvList();
  if (id === currentConvId) $('chatTitle').textContent = name;
}

function renameCurrent() {
  if (currentConvId) renameConv(currentConvId);
}

async function loadOlderMessages() {
  if (!currentConvId || !currentMessages.length) return;
  const oldest = currentMessages[0].created_at;
  const older = await api('GET', `/api/theater/conversations/${currentConvId}/messages?limit=50&before=${oldest}`);
  if (older.length) {
    currentMessages = [...older, ...currentMessages];
    hasMoreMessages = older.length >= 50;
    const el = $('messages');
    const prevH = el.scrollHeight;
    renderMessages();
    el.scrollTop = el.scrollHeight - prevH;
  } else {
    hasMoreMessages = false;
    renderMessages();
  }
}

/* ── 消息渲染 ── */
function reasoningDetailsHtml(m) {
  const reasoning = (m.reasoning_content || '').trim();
  if (m.role !== 'assistant' || !reasoning) return '';
  const streamingClass = m._streaming ? ' is-streaming' : '';
  const status = m._streaming ? '思考中' : '';
  return `<details class="msg-reasoning${streamingClass}">
    <summary><span>思考过程</span><span class="msg-reasoning-status">${status}</span></summary>
    <div class="msg-reasoning-content">${escHtml(reasoning)}</div>
  </details>`;
}

function messageBubblesHtml(m) {
  const raw = (m.content || '').replace(/<meta>[\s\S]*?<\/meta>/g, '').trim();
  return `${reasoningDetailsHtml(m)}<div class="msg-bubble msg-body-bubble">${escHtml(raw).replace(/\n/g, '<br>')}</div>`;
}

function updateStreamingReasoning(msgId, delta) {
  const msg = currentMessages.find(m => m.id === msgId);
  if (!msg || !delta) return;
  msg.reasoning_content = (msg.reasoning_content || '') + delta;
  const bubbles = document.querySelector(`.msg-row[data-id="${msgId}"] .msg-bubbles`);
  if (!bubbles) return;
  let details = bubbles.querySelector('.msg-reasoning');
  if (!details) {
    bubbles.insertAdjacentHTML('afterbegin', reasoningDetailsHtml(msg));
    details = bubbles.querySelector('.msg-reasoning');
  } else {
    details.classList.add('is-streaming');
    details.querySelector('.msg-reasoning-content').textContent = msg.reasoning_content.trim();
    details.querySelector('.msg-reasoning-status').textContent = '思考中';
  }
}

function updateStreamingBody(msgId, content) {
  const msg = currentMessages.find(m => m.id === msgId);
  if (msg) msg.content = content;
  const body = document.querySelector(`.msg-row[data-id="${msgId}"] .msg-body-bubble`);
  if (!body) return;
  const display = content.replace(/<meta>[\s\S]*?<\/meta>/g, '').trim();
  body.innerHTML = escHtml(display).replace(/\n/g, '<br>');
}

function finishStreamingMessage(msgId) {
  const msg = currentMessages.find(m => m.id === msgId);
  if (msg) msg._streaming = false;
  const details = document.querySelector(`.msg-row[data-id="${msgId}"] .msg-reasoning`);
  if (!details) return;
  details.classList.remove('is-streaming');
  const status = details.querySelector('.msg-reasoning-status');
  if (status) status.textContent = '';
}

function renderMessages() {
  const el = $('messages');
  let html = '';
  if (hasMoreMessages) {
    html += '<button class="load-more-btn" onclick="loadOlderMessages()">加载更早的消息</button>';
  }
  for (const m of currentMessages) {
    if (m.id && m.conv_id) ttsMessageConversations.set(m.id, m.conv_id);
    if (m.role === 'system') {
      html += `<div class="system-msg">${escHtml(m.content)}</div>`;
      continue;
    }
    const isUser = m.role === 'user';
    const cls = isUser ? 'user' : 'assistant';
    const name = isUser ? '你' : '🎭';
    const avatar = isUser ? '/public/UserIcon.png' : '/public/AIIcon.png';
    const ts = m.created_at ? new Date(m.created_at * 1000) : null;
    const timeStr = ts ? `${ts.getHours().toString().padStart(2,'0')}:${ts.getMinutes().toString().padStart(2,'0')}` : '';

    // 思考过程独立折叠在正文气泡上方
    const bubblesHtml = messageBubblesHtml(m);

    // 附件
    let attHtml = '';
    if (m.attachments && m.attachments.length) {
      attHtml = '<div class="msg-attachments">';
      for (const a of m.attachments) {
        if (typeof a === 'string') {
          if (a.match(/\.(mp4|webm|mov)$/i)) {
            attHtml += `<video src="${a}" controls playsinline></video>`;
          } else {
            attHtml += `<img src="${a}" onclick="window.open('${a}')">`;
          }
        }
      }
      attHtml += '</div>';
    }

    html += `
    <div class="msg-row ${cls}" data-id="${m.id}">
      <div class="msg-header">
        <img class="msg-avatar" src="${avatar}">
        ${!isUser ? `<button class="tts-replay-btn" onclick="replayTTS('${m.id}')">🔊</button>` : ''}
        <span class="msg-role-name">${name}</span>
        <span class="msg-time">${timeStr}</span>
        <div class="msg-actions">
          <button class="msg-dots" onclick="toggleMenu(event,'menu_${m.id}')">⋯</button>
          <div class="msg-menu" id="menu_${m.id}">
            ${isUser ? `<button onclick="editMsg('${m.id}')">编辑</button>` : `<button onclick="regenerateMsg('${m.id}')">重新生成</button>`}
            <button onclick="copyMsg('${m.id}')">复制</button>
            <button onclick="delMsg('${m.id}')">删除</button>
          </div>
        </div>
      </div>
      <div class="msg-bubbles">${bubblesHtml}</div>
      ${attHtml}
    </div>`;
  }
  el.innerHTML = html;
  if (activeTTS) setTTSReplayButton(activeTTS.msgId, true);
}

function scrollBottom() {
  const el = $('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

let messageNavLoading = false;

function messageViewportTop() {
  const messages = $('messages');
  const messagesRect = messages.getBoundingClientRect();
  const header = document.querySelector('.chat-header');
  const player = $('ttsTopPlayer');
  let top = messagesRect.top;
  if (header) top = Math.max(top, header.getBoundingClientRect().bottom);
  if (player && player.classList.contains('show')) {
    top = Math.max(top, player.getBoundingClientRect().bottom);
  }
  return top + 6;
}

function scrollToMessageStart(row) {
  if (!row) return;
  const messages = $('messages');
  const delta = row.getBoundingClientRect().top - messageViewportTop();
  messages.scrollTo({
    top: Math.max(0, messages.scrollTop + delta),
    behavior: 'smooth',
  });
}

async function navigateMessage(direction) {
  if (messageNavLoading) return;
  const messages = $('messages');
  let rows = Array.from(messages.querySelectorAll('.msg-row'));
  if (!rows.length) return;

  const viewportTop = messageViewportTop();
  let currentIndex = rows.findIndex(
    row => row.getBoundingClientRect().bottom > viewportTop + 2
  );
  if (currentIndex < 0) currentIndex = rows.length - 1;

  if (direction > 0) {
    const next = rows[currentIndex + 1];
    if (next) scrollToMessageStart(next);
    else showToast('已经是最后一条消息');
    return;
  }

  const current = rows[currentIndex];
  const currentStartsHere = current.getBoundingClientRect().top >= viewportTop - 4;
  if (!currentStartsHere) {
    scrollToMessageStart(current);
    return;
  }

  if (currentIndex > 0) {
    scrollToMessageStart(rows[currentIndex - 1]);
    return;
  }

  if (!hasMoreMessages) {
    showToast('已经是最早一条消息');
    return;
  }

  messageNavLoading = true;
  const currentId = current.dataset.id;
  try {
    await loadOlderMessages();
    rows = Array.from(messages.querySelectorAll('.msg-row'));
    const restoredIndex = rows.findIndex(row => row.dataset.id === currentId);
    if (restoredIndex > 0) scrollToMessageStart(rows[restoredIndex - 1]);
    else showToast('已经是最早一条消息');
  } finally {
    messageNavLoading = false;
  }
}

/* ── 消息菜单 ── */
function toggleMenu(e, id) {
  e.stopPropagation();
  document.querySelectorAll('.msg-menu.show').forEach(m => m.classList.remove('show'));
  $(id).classList.toggle('show');
}
document.addEventListener('click', (e) => {

/* ── 发送消息（SSE 流式） ── */
async function send() {
  const input = $('input');
  const content = input.value.trim();
  if (!content && !pendingAttachments.length) return;
  if (!currentConvId) {
    await newConversation();
  }
  if (isStreaming) return;
  const requestConvId = currentConvId;
  isStreaming = true;
  $('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  const ctx = parseInt($('contextSlider').value) || 20;
  const temp = parseFloat($('tempSlider').value);

  const body = {
    content,
    context_limit: ctx,
    attachments: pendingAttachments.map(a => a.url),
    temperature: temp,
    tts_enabled: ttsEnabled,
    tts_voice: ttsVoice,
  };

  pendingAttachments = [];
  renderPreview();

  try {
    const res = await fetch(`/api/theater/conversations/${requestConvId}/send`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let aiMsgId = null;
    let aiText = '';
    let typingPhase = 0;
    const typingTexts = ['思考中', '正在输入'];

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch(e) { continue; }

        if (data.type === 'start') {
          aiMsgId = data.id;
          ttsMessageConversations.set(aiMsgId, requestConvId);
          if (body.tts_enabled) ttsLiveMessages.add(aiMsgId);
          if (ttsDeletedConversations.has(requestConvId)) {
            discardMessageTTS(aiMsgId, true);
            continue;
          }
          // 添加占位 AI 消息 + 输入等待动画
          if (currentConvId === requestConvId) {
            currentMessages.push({
              id: aiMsgId, conv_id: requestConvId, role: 'assistant',
              content: '', reasoning_content: '', created_at: Date.now()/1000,
              attachments: [], _streaming: true
            });
            renderMessages();
          }
          // 显示输入动画
          const row = document.querySelector(`.msg-row[data-id="${aiMsgId}"] .msg-bubbles`);
          if (row) {
            row.innerHTML = `<div class="msg-bubble msg-body-bubble"><div class="typing-bubble">
              <span class="typing-text">${typingTexts[0]}</span>
              <span class="typing-dots"><span></span><span></span><span></span></span>
            </div></div>`;
          }
          scrollBottom();
          // 切换输入动画文字
          const _typeInterval = setInterval(() => {
            typingPhase = (typingPhase + 1) % typingTexts.length;
            const tt = document.querySelector(`.msg-row[data-id="${aiMsgId}"] .typing-text`);
            if (tt) tt.textContent = typingTexts[typingPhase];
            else clearInterval(_typeInterval);
          }, 3000);
          // 存起来后面清除
          window._typeInterval = _typeInterval;
        }

        if (data.type === 'reasoning' && aiMsgId) {
          updateStreamingReasoning(aiMsgId, data.content || '');
        }

        if (data.type === 'chunk' && aiMsgId) {
          if (window._typeInterval) { clearInterval(window._typeInterval); window._typeInterval = null; }
          aiText += data.content;
          updateStreamingBody(aiMsgId, aiText);
        }

        if (data.type === 'debug') {
          if (aiMsgId) finishStreamingMessage(aiMsgId);
        }
      }
    }
  } catch(e) {
    showToast('发送失败: ' + e.message);
  } finally {
    isStreaming = false;
    $('sendBtn').disabled = false;
    if (window._typeInterval) { clearInterval(window._typeInterval); window._typeInterval = null; }
  }
}

/* ── 重新生成 ── */
async function regenerateMsg(aiMsgId) {
  document.querySelectorAll('.msg-menu.show').forEach(m => m.classList.remove('show'));
  if (!currentConvId || isStreaming) return;
  const requestConvId = currentConvId;
  const requestTtsEnabled = ttsEnabled;
  isStreaming = true;
  $('sendBtn').disabled = true;
  const ctx = parseInt($('contextSlider').value) || 20;
  const temp = parseFloat($('tempSlider').value);

  try {
    const res = await fetch(`/api/theater/conversations/${requestConvId}/regenerate?context_limit=${ctx}&temperature=${temp}&tts_enabled=${requestTtsEnabled}&tts_voice=${encodeURIComponent(ttsVoice)}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        message_id: aiMsgId,
        model: $('modelSelect').value,
        persona_id: currentPersonaId,
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    discardMessageTTS(aiMsgId, true);
    currentMessages = currentMessages.filter(m => m.id !== aiMsgId);
    renderMessages();
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let newAiMsgId = null;
    let aiText = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch(e) { continue; }

        if (data.type === 'start') {
          newAiMsgId = data.id;
          ttsMessageConversations.set(newAiMsgId, requestConvId);
          if (requestTtsEnabled) ttsLiveMessages.add(newAiMsgId);
          if (ttsDeletedConversations.has(requestConvId)) {
            discardMessageTTS(newAiMsgId, true);
            continue;
          }
          if (currentConvId === requestConvId) {
            currentMessages.push({
              id: newAiMsgId, conv_id: requestConvId, role: 'assistant',
              content: '', reasoning_content: '', created_at: Date.now()/1000,
              attachments: [], _streaming: true
            });
            renderMessages();
          }
          const row = document.querySelector(`.msg-row[data-id="${newAiMsgId}"] .msg-bubbles`);
          if (row) {
            row.innerHTML = `<div class="msg-bubble msg-body-bubble"><div class="typing-bubble">
              <span class="typing-text">正在重新生成</span>
              <span class="typing-dots"><span></span><span></span><span></span></span>
            </div></div>`;
          }
        }

        if (data.type === 'reasoning' && newAiMsgId) {
          updateStreamingReasoning(newAiMsgId, data.content || '');
        }

        if (data.type === 'chunk' && newAiMsgId) {
          aiText += data.content;
          updateStreamingBody(newAiMsgId, aiText);
        }

        if (data.type === 'debug') {
          if (newAiMsgId) finishStreamingMessage(newAiMsgId);
        }
      }
    }
  } catch(e) {
    showToast('重新生成失败');
  } finally {
    isStreaming = false;
    $('sendBtn').disabled = false;
  }
}

/* ── TTS 播放 ── */
const TTSQueue = window.TheaterTTSQueue;

function handleTTSChunk(d) {
  const msgId = d.msg_id;
  // 只播放小剧场自己的消息（tm_ 前缀），忽略主聊天的 TTS
  if (!msgId || !msgId.startsWith('tm_')) return;
  const convId = d.conv_id || ttsMessageConversations.get(msgId) || null;
  if (convId) ttsMessageConversations.set(msgId, convId);
  if (convId && ttsDeletedConversations.has(convId)) {
    discardMessageTTS(msgId, true);
    return;
  }
  if (ttsDeletedMessages.has(msgId) || ttsSuppressedMessages.has(msgId)) return;
  ttsLiveMessages.add(msgId);

  if (manualReplay && manualReplay.msgId === msgId) {
    TTSQueue.upsert(manualReplay.queue, d.seq, d.url);
    if (!currentAudio) playManualReplayNext();
    return;
  }

  if (!ttsQueue.has(msgId)) ttsQueue.set(msgId, TTSQueue.createQueue());
  TTSQueue.upsert(ttsQueue.get(msgId), d.seq, d.url);

  if (activeTTS && activeTTS.msgId === msgId && activeTTS.mode === 'segments') {
    if (!currentAudio) continueSegmentPlayback();
  } else if (!activeTTS) {
    playNextTTS();
  }
}

function handleTTSDone(d) {
  const msgId = d.msg_id;
  if (!msgId || !msgId.startsWith('tm_')) return;
  const convId = d.conv_id || ttsMessageConversations.get(msgId) || null;
  if (convId) ttsMessageConversations.set(msgId, convId);
  ttsLiveMessages.delete(msgId);
  if (convId && ttsDeletedConversations.has(convId)) {
    discardMessageTTS(msgId, true);
    return;
  }
  if (ttsDeletedMessages.has(msgId)) return;
  if (ttsSuppressedMessages.has(msgId)) {
    ttsSuppressedMessages.delete(msgId);
    ttsQueue.delete(msgId);
    if (manualReplay && manualReplay.msgId === msgId) manualReplay = null;
    return;
  }

  if (manualReplay && manualReplay.msgId === msgId) {
    TTSQueue.markFinished(manualReplay.queue);
    if (!currentAudio) playManualReplayNext();
    return;
  }

  if (!ttsQueue.has(msgId)) ttsQueue.set(msgId, TTSQueue.createQueue());
  TTSQueue.markFinished(ttsQueue.get(msgId));
  if (activeTTS && activeTTS.msgId === msgId && activeTTS.mode === 'segments') {
    if (!currentAudio) continueSegmentPlayback();
  } else if (!activeTTS) {
    playNextTTS();
  }
}

function handleTTSMerged(d) {
  const msgId = d.msg_id;
  if (!msgId || !msgId.startsWith('tm_') || !d.url) return;
  const convId = d.conv_id || ttsMessageConversations.get(msgId) || null;
  if (convId) ttsMessageConversations.set(msgId, convId);
  if (convId && ttsDeletedConversations.has(convId)) {
    discardMessageTTS(msgId, true);
    return;
  }
  if (ttsDeletedMessages.has(msgId) || ttsSuppressedMessages.has(msgId)) return;
  ttsMergedUrls.set(msgId, d.url);

  if (!activeTTS || activeTTS.msgId !== msgId || activeTTS.mode !== 'segments') return;
  activeTTS.pendingMergedUrl = d.url;
  // 正在播的分段播完后无缝切换；恰好在等下一段时可立即接管。
  if (!currentAudio) {
    startMergedPlayback(msgId, d.url, activeTTS.elapsedBase, {
      source: activeTTS.source,
      fallback: segmentFallback(activeTTS),
    });
  }
}

function showTopTTSPlayer() {
  $('ttsTopPlayer').classList.add('show');
  document.querySelector('.chat-area').classList.add('tts-player-open');
}

function hideTopTTSPlayer() {
  $('ttsTopPlayer').classList.remove('show');
  document.querySelector('.chat-area').classList.remove('tts-player-open');
  $('ttsTopToggle').textContent = '▶';
  $('ttsTopToggle').disabled = false;
  $('ttsTopCurrent').textContent = '00:00';
  $('ttsTopDuration').textContent = '合成中';
  $('ttsTopSeek').value = 0;
  $('ttsTopSeek').max = 0;
  $('ttsTopSeek').disabled = true;
}

function setTTSReplayButton(msgId, playing) {
  document.querySelectorAll('.tts-replay-btn.playing').forEach(btn => btn.classList.remove('playing'));
  if (!playing || !msgId) return;
  const btn = document.querySelector(`.msg-row[data-id="${msgId}"] .tts-replay-btn`);
  if (btn) btn.classList.add('playing');
}

function updateTopTTSProgress() {
  if (!activeTTS || !currentAudio) return;
  if (activeTTS.mode === 'merged') {
    const duration = currentAudio.duration;
    $('ttsTopCurrent').textContent = TTSQueue.formatTime(currentAudio.currentTime);
    if (Number.isFinite(duration) && duration > 0) {
      $('ttsTopDuration').textContent = TTSQueue.formatTime(duration);
      $('ttsTopSeek').max = duration;
      $('ttsTopSeek').value = currentAudio.currentTime;
      $('ttsTopSeek').disabled = false;
    }
  } else {
    const current = activeTTS.elapsedBase + (Number.isFinite(currentAudio.currentTime) ? currentAudio.currentTime : 0);
    $('ttsTopCurrent').textContent = TTSQueue.formatTime(current);
  }
}

function toggleTopTTS() {
  if (!currentAudio) return;
  if (currentAudio.paused) {
    currentAudio.play().catch(() => showToast('浏览器阻止了自动播放，请再点一次播放'));
  } else {
    currentAudio.pause();
  }
}

function seekTopTTS(value) {
  if (!currentAudio || !activeTTS || activeTTS.mode !== 'merged') return;
  const duration = currentAudio.duration;
  if (!Number.isFinite(duration) || duration <= 0) return;
  const target = Math.max(0, Math.min(Number(value) || 0, duration));
  currentAudio.currentTime = target;
  updateTopTTSProgress();
}

function releaseCurrentAudio() {
  if (currentAudio) {
    currentAudio.onloadedmetadata = null;
    currentAudio.ontimeupdate = null;
    currentAudio.onplay = null;
    currentAudio.onpause = null;
    currentAudio.onended = null;
    currentAudio.onerror = null;
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
}

function resetTTSPlayback({ clearQueues = false } = {}) {
  ttsPlaybackToken++;
  releaseCurrentAudio();
  ttsPlaying = false;
  manualReplay = null;
  activeTTS = null;
  if (clearQueues) ttsQueue.clear();
  setTTSReplayButton(null, false);
  hideTopTTSPlayer();
}

function stopTTSPlayback() {
  const suppressed = new Set(ttsQueue.keys());
  if (activeTTS && activeTTS.msgId) suppressed.add(activeTTS.msgId);
  if (manualReplay && manualReplay.msgId) suppressed.add(manualReplay.msgId);
  for (const msgId of suppressed) {
    if (!ttsDeletedMessages.has(msgId)) ttsSuppressedMessages.add(msgId);
  }
  pendingManualReplayMsgId = null;
  resetTTSPlayback({ clearQueues: true });
}

function stopSelectedTTS(msgId) {
  if (!msgId) return;
  if (ttsLiveMessages.has(msgId) && !ttsDeletedMessages.has(msgId)) {
    ttsSuppressedMessages.add(msgId);
  }
  if (pendingManualReplayMsgId === msgId) pendingManualReplayMsgId = null;
  if ((activeTTS && activeTTS.msgId === msgId) || (manualReplay && manualReplay.msgId === msgId)) {
    resetTTSPlayback({ clearQueues: false });
  }
  ttsQueue.delete(msgId);
  playNextTTS();
}

function discardMessageTTS(msgId, deleted = false) {
  if (!msgId) return;
  if (deleted) {
    ttsDeletedMessages.add(msgId);
    ttsSuppressedMessages.delete(msgId);
    ttsLiveMessages.delete(msgId);
  }
  if (pendingManualReplayMsgId === msgId) pendingManualReplayMsgId = null;
  if ((activeTTS && activeTTS.msgId === msgId) || (manualReplay && manualReplay.msgId === msgId)) {
    resetTTSPlayback({ clearQueues: false });
  }
  ttsQueue.delete(msgId);
  ttsMergedUrls.delete(msgId);
  ttsMessageConversations.delete(msgId);
}

function discardConversationTTS(convId) {
  if (!convId) return;
  ttsDeletedConversations.add(convId);
  const messageIds = [];
  for (const [msgId, messageConvId] of ttsMessageConversations) {
    if (messageConvId === convId) messageIds.push(msgId);
  }
  if (activeTTS && activeTTS.convId === convId && !messageIds.includes(activeTTS.msgId)) {
    messageIds.push(activeTTS.msgId);
  }
  if (pendingManualReplayMsgId && ttsMessageConversations.get(pendingManualReplayMsgId) === convId) {
    messageIds.push(pendingManualReplayMsgId);
  }
  messageIds.forEach(msgId => discardMessageTTS(msgId, true));
}

function playNextTTS() {
  if (activeTTS || currentAudio) return;

  for (const [msgId, queue] of ttsQueue) {
    if (TTSQueue.isDrained(queue)) {
      ttsQueue.delete(msgId);
      continue;
    }
    // 队首消息没有精确的 nextSeq 时必须等待，不能越过它播放后面的消息。
    if (!TTSQueue.peekNext(queue)) return;

    activeTTS = {
      msgId,
      convId: ttsMessageConversations.get(msgId) || currentConvId,
      mode: 'segments',
      source: 'live',
      queue,
      elapsedBase: 0,
      pendingMergedUrl: ttsMergedUrls.get(msgId) || null,
    };
    continueSegmentPlayback();
    return;
  }
  ttsPlaying = false;
}

function segmentFallback(state) {
  return {
    queue: state.queue,
    source: state.source,
    elapsedBase: state.elapsedBase,
    convId: state.convId,
  };
}

function continueSegmentPlayback() {
  if (!activeTTS || activeTTS.mode !== 'segments' || currentAudio) return;
  const queue = activeTTS.queue;

  if (activeTTS.pendingMergedUrl) {
    startMergedPlayback(activeTTS.msgId, activeTTS.pendingMergedUrl, activeTTS.elapsedBase, {
      source: activeTTS.source,
      fallback: segmentFallback(activeTTS),
    });
    return;
  }

  const chunk = TTSQueue.peekNext(queue);
  if (!chunk) {
    if (TTSQueue.isDrained(queue)) finishTTSPlayback();
    else {
      ttsPlaying = false;
      $('ttsTopToggle').textContent = '…';
      $('ttsTopToggle').disabled = true;
    }
    return;
  }

  showTopTTSPlayer();
  setTTSReplayButton(activeTTS.msgId, true);
  $('ttsTopSeek').disabled = true;
  $('ttsTopSeek').max = 0;
  $('ttsTopSeek').value = 0;
  $('ttsTopDuration').textContent = '合成中';
  $('ttsTopCurrent').textContent = TTSQueue.formatTime(activeTTS.elapsedBase);
  $('ttsTopToggle').disabled = false;

  const token = ++ttsPlaybackToken;
  const audio = new Audio(chunk.url);
  audio.preload = 'auto';
  currentAudio = audio;
  ttsPlaying = true;

  audio.ontimeupdate = updateTopTTSProgress;
  audio.onplay = () => {
    if (token !== ttsPlaybackToken) return;
    $('ttsTopToggle').textContent = '⏸';
    ttsPlaying = true;
  };
  audio.onpause = () => {
    if (token !== ttsPlaybackToken) return;
    $('ttsTopToggle').textContent = '▶';
  };
  audio.onended = () => finishSegment(chunk, token, true);
  audio.onerror = () => finishSegment(chunk, token, false);
  audio.play().catch(() => {
    if (token !== ttsPlaybackToken) return;
    $('ttsTopToggle').textContent = '▶';
    showToast('点击顶部播放按钮继续播放');
  });
}

function finishSegment(chunk, token, countDuration) {
  if (token !== ttsPlaybackToken || !activeTTS || activeTTS.mode !== 'segments') return;
  const audio = currentAudio;
  if (countDuration && audio) {
    const played = Number.isFinite(audio.duration) && audio.duration > 0
      ? audio.duration
      : (Number.isFinite(audio.currentTime) ? audio.currentTime : 0);
    activeTTS.elapsedBase += played;
  }
  TTSQueue.advance(activeTTS.queue);
  currentAudio = null;
  ttsPlaying = false;

  if (activeTTS.pendingMergedUrl) {
    startMergedPlayback(activeTTS.msgId, activeTTS.pendingMergedUrl, activeTTS.elapsedBase, {
      source: activeTTS.source,
      fallback: segmentFallback(activeTTS),
    });
  } else {
    continueSegmentPlayback();
  }
}

function startMergedPlayback(msgId, url, startAt = 0, options = {}) {
  const fallback = options.fallback || null;
  const onMissing = options.onMissing || null;
  const source = options.source || 'live';
  const convId = (activeTTS && activeTTS.msgId === msgId && activeTTS.convId)
    || (fallback && fallback.convId)
    || ttsMessageConversations.get(msgId)
    || currentConvId;
  const token = ++ttsPlaybackToken;
  releaseCurrentAudio();

  activeTTS = { msgId, convId, mode: 'merged', source, url, fallback };
  showTopTTSPlayer();
  setTTSReplayButton(msgId, true);
  $('ttsTopSeek').disabled = true;
  $('ttsTopSeek').value = 0;
  $('ttsTopSeek').max = 0;
  $('ttsTopCurrent').textContent = TTSQueue.formatTime(startAt);
  $('ttsTopDuration').textContent = '加载中';
  $('ttsTopToggle').disabled = false;

  const audio = new Audio(url);
  audio.preload = 'metadata';
  currentAudio = audio;
  ttsPlaying = true;
  let mergedStarted = false;

  let mergedPlayRequested = false;
  function requestMergedPlay() {
    if (mergedPlayRequested) return;
    mergedPlayRequested = true;
    audio.play().catch(() => {
      if (token !== ttsPlaybackToken) return;
      $('ttsTopToggle').textContent = '▶';
      showToast('点击顶部播放按钮继续播放');
    });
  }

  audio.onloadedmetadata = () => {
    if (token !== ttsPlaybackToken) return;
    const duration = audio.duration;
    if (Number.isFinite(duration) && duration > 0) {
      const target = Math.max(0, Math.min(Number(startAt) || 0, Math.max(0, duration - 0.05)));
      audio.currentTime = target;
      $('ttsTopSeek').max = duration;
      $('ttsTopSeek').value = target;
      $('ttsTopSeek').disabled = false;
      $('ttsTopDuration').textContent = TTSQueue.formatTime(duration);
      $('ttsTopCurrent').textContent = TTSQueue.formatTime(target);
    }
  };
  audio.ontimeupdate = updateTopTTSProgress;
  audio.onplay = () => {
    if (token !== ttsPlaybackToken) return;
    mergedStarted = true;
    $('ttsTopToggle').textContent = '⏸';
    ttsPlaying = true;
    // 合成音频已成功接管，后续不再回放同一消息的分段队列。
    ttsQueue.delete(msgId);
    if (manualReplay && manualReplay.msgId === msgId) manualReplay = null;
    if (activeTTS) activeTTS.fallback = null;
  };
  audio.onpause = () => {
    if (token !== ttsPlaybackToken) return;
    $('ttsTopToggle').textContent = '▶';
  };
  audio.onended = () => {
    if (token !== ttsPlaybackToken) return;
    currentAudio = null;
    finishTTSPlayback();
  };
  audio.onerror = () => {
    if (token !== ttsPlaybackToken) return;
    currentAudio = null;
    ttsPlaying = false;
    if (fallback && activeTTS && activeTTS.fallback) {
      activeTTS = {
        msgId,
        convId: fallback.convId || ttsMessageConversations.get(msgId) || currentConvId,
        mode: 'segments',
        source: fallback.source,
        queue: fallback.queue,
        elapsedBase: fallback.elapsedBase,
        pendingMergedUrl: null,
      };
      showToast('总音频加载失败，已继续分段播放');
      continueSegmentPlayback();
    } else if (onMissing && !mergedStarted) {
      activeTTS = null;
      $('ttsTopToggle').textContent = '…';
      $('ttsTopToggle').disabled = true;
      $('ttsTopDuration').textContent = '查找分段';
      Promise.resolve(onMissing()).catch(() => {
        showToast('暂无音频缓存');
        finishTTSPlayback();
      });
    } else {
      showToast('音频加载失败');
      finishTTSPlayback();
    }
  };
  audio.load();
  requestMergedPlay();
}

function finishTTSPlayback() {
  const finished = activeTTS;
  if (finished) {
    ttsQueue.delete(finished.msgId);
    if (manualReplay && manualReplay.msgId === finished.msgId) manualReplay = null;
  }
  releaseCurrentAudio();
  activeTTS = null;
  ttsPlaying = false;
  setTTSReplayButton(null, false);
  hideTopTTSPlayer();
  if (pendingManualReplayMsgId) {
    const pendingMsgId = pendingManualReplayMsgId;
    pendingManualReplayMsgId = null;
    const pendingConvId = ttsMessageConversations.get(pendingMsgId);
    if (!ttsDeletedMessages.has(pendingMsgId)
        && (!pendingConvId || !ttsDeletedConversations.has(pendingConvId))) {
      replayTTS(pendingMsgId);
      return;
    }
  }
  playNextTTS();
}

async function replayTTS(msgId) {
  if (ttsDeletedMessages.has(msgId)) return;
  if (activeTTS && activeTTS.msgId === msgId) {
    stopSelectedTTS(msgId);
    return;
  }
  if (activeTTS || currentAudio) {
    pendingManualReplayMsgId = msgId;
    showToast('当前音频播放结束后继续');
    return;
  }

  ttsSuppressedMessages.delete(msgId);
  const safeId = msgId.replace(/[^a-zA-Z0-9_\-]/g, '');
  const mergedUrl = ttsMergedUrls.get(msgId) || `/api/theater/tts/audio/${safeId}`;
  resetTTSPlayback({ clearQueues: false });
  startMergedPlayback(msgId, mergedUrl, 0, {
    source: 'manual',
    onMissing: () => replayTTSFromSegments(msgId),
  });
}

async function replayTTSFromSegments(msgId) {
  const lookupToken = ttsPlaybackToken;
  const safeId = msgId.replace(/[^a-zA-Z0-9_\-]/g, '');
  const queue = TTSQueue.createQueue();
  try {
    const res = await fetch(`/api/theater/tts/segments/${safeId}`);
    if (res.ok) {
      const manifest = await res.json();
      for (const chunk of manifest.segments || []) {
        if (Number.isInteger(chunk.seq) && typeof chunk.url === 'string') {
          TTSQueue.upsert(queue, chunk.seq, chunk.url);
        }
      }
    }
  } catch(e) {}

  const liveQueue = ttsQueue.get(msgId);
  if (liveQueue) {
    for (const chunk of liveQueue.chunks.values()) {
      TTSQueue.upsert(queue, chunk.seq, chunk.url);
    }
  }
  const isLive = ttsLiveMessages.has(msgId);
  if (!isLive) TTSQueue.markFinished(queue);
  if (lookupToken !== ttsPlaybackToken) return;
  if (!queue.chunks.size && !isLive) {
    showToast('暂无音频缓存');
    finishTTSPlayback();
    return;
  }

  resetTTSPlayback({ clearQueues: false });
  ttsQueue.delete(msgId);
  manualReplay = { msgId, queue };
  activeTTS = {
    msgId,
    convId: ttsMessageConversations.get(msgId) || currentConvId,
    mode: 'segments',
    source: 'manual',
    queue,
    elapsedBase: 0,
    pendingMergedUrl: null,
  };
  playManualReplayNext();
}

function playManualReplayNext() {
  if (!manualReplay || !activeTTS || activeTTS.msgId !== manualReplay.msgId) return;
  continueSegmentPlayback();
}

/* ── 角色管理 ── */
function renderPersonaList() {
  const el = $('personaList');
  if (!el) return;
  el.innerHTML = personas.map(p => `
    <div class="persona-card ${p.id === currentPersonaId ? 'active' : ''}" onclick="selectPersona('${p.id}')">
      <span class="p-name">🎭 ${escHtml(p.name)}</span>
      <div class="p-actions">
        <button onclick="event.stopPropagation();openPersonaModal('${p.id}')" title="编辑">✏</button>
        <button onclick="event.stopPropagation();deletePersona('${p.id}')" title="删除">✕</button>
      </div>
    </div>
  `).join('');
}

async function selectPersona(pid) {
  currentPersonaId = pid;
  renderPersonaList();
  if (currentConvId) {
    await api('PUT', `/api/theater/conversations/${currentConvId}`, { persona_id: pid });
    const conv = conversations.find(c => c.id === currentConvId);
    if (conv) conv.persona_id = pid;
  }
}

function openPersonaModal(editId) {
  const overlay = $('personaModalOverlay');
  if (editId) {
    const p = personas.find(x => x.id === editId);
    if (!p) return;
    $('personaModalTitle').textContent = '编辑角色';
    $('personaEditId').value = editId;
    $('personaName').value = p.name;
    $('personaText').value = p.persona;
  } else {
    $('personaModalTitle').textContent = '新建角色';
    $('personaEditId').value = '';
    $('personaName').value = '';
    $('personaText').value = '';
  }
  overlay.classList.add('show');
}

function closePersonaModal() {
  $('personaModalOverlay').classList.remove('show');
}

async function savePersona() {
  const editId = $('personaEditId').value;
  const data = {
    name: $('personaName').value.trim() || '未命名角色',
    persona: $('personaText').value,
  };
  if (editId) {
    const updated = await api('PUT', `/api/theater/personas/${editId}`, data);
    const idx = personas.findIndex(p => p.id === editId);
    if (idx >= 0) personas[idx] = { ...personas[idx], ...updated };
  } else {
    const created = await api('POST', '/api/theater/personas', data);
    personas.push(created);
  }
  renderPersonaList();
  closePersonaModal();
  showToast('已保存');
}

async function deletePersona(pid) {
  if (!confirm('删除这个角色？')) return;
  await api('DELETE', `/api/theater/personas/${pid}`);
  personas = personas.filter(p => p.id !== pid);
  if (currentPersonaId === pid) currentPersonaId = '';
  renderPersonaList();
}

/* ── 侧栏 ── */
function toggleSidebar() {
  $('sidebar').classList.toggle('open');
  $('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  $('sidebar').classList.remove('open');
  $('sidebarOverlay').classList.remove('show');
}

/* ── 启动 ── */
init();
</script>
