<body>
<div class="sub-page">
  <div class="top-bar"><button class="back-btn" onclick="location.href='/'">⬅</button><h2>🏠 家庭动态</h2></div>
  <div class="tabs">
    <button class="tab active" id="timelineTab" onclick="switchTab('timeline')">家庭时间线</button>
    <span class="private-space-tabs" id="privateSpaceTabs"></span>
  </div>
  <div class="pane active" id="timelinePane">
    <details class="autonomy-controls" id="autonomyControls"><summary>自主意识与独立计时</summary><div class="role-grid" id="roleGrid"><div class="empty">加载中...</div></div></details>
    <div class="toolbar"><select id="timelineHours" onchange="loadTimeline()"><option value="6">最近 6 小时</option><option value="24" selected>今天 / 最近 24 小时</option><option value="72">最近 3 天</option><option value="168">最近 7 天</option></select><button onclick="loadTimeline()">刷新</button></div>
    <div class="timeline" id="timelineList"><div class="empty">加载中...</div></div>
  </div>
  <div class="pane" id="privateSpacePane"><div class="private-space-wrap"><div class="empty">私人空间准备中...</div></div></div>
</div>
<div class="detail-backdrop" id="timelineDetail" onclick="if(event.target===this)hideTimelineDetail()">
  <div class="detail-card" role="dialog" aria-modal="true" aria-labelledby="timelineDetailTitle">
    <div class="postcard-sheet">
      <button class="detail-close" onclick="hideTimelineDetail()" aria-label="关闭">×</button>
      <div class="postcard-menu" id="postcardMenu">
        <button onclick="togglePostcardMenu(event)" aria-label="卡片操作">•••</button>
        <div class="postcard-menu-pop"><button class="postcard-state" id="postcardMentionToggle" onclick="toggleNicheMention()">设为已提及</button><button class="postcard-delete" onclick="deleteNicheCard()">移除这张卡片</button></div>
      </div>
      <div class="detail-head">
        <div class="detail-heading"><div class="detail-time" id="timelineDetailTime"></div><div class="detail-title" id="timelineDetailTitle"></div></div>
      </div>
      <div class="postcard-body">
        <div class="detail-images" id="timelineDetailImages"></div>
        <div class="detail-text" id="timelineDetailText"></div>
        <details class="niche-sources" id="nicheSources"><summary>旅行线索 · 背面的小纸条</summary><div id="nicheSourceLinks"></div></details>
      </div>
    </div>
  </div>
</div>
<script src="/static/theme.js"></script><script src="/static/common.js"></script>
<script>
let autonomyData={roles:[],actions:[]};
let timelineItems=[];
let nicheCards=[];
let nicheCardsByActor={};
let activeNicheActor='';
let nichePage=0;
let currentNicheCard=null;
const NICHE_PAGE_SIZE=12;
function roleForActor(actor){return (autonomyData.roles||[]).find(role=>role.actor===actor)||{};}
function switchTab(tab,actor=''){
  resetPrivateSpaceDoor();
  const timeline=tab==='timeline';
  $('timelineTab').classList.toggle('active',timeline);
  document.querySelectorAll('[data-space-tab]').forEach(button=>button.classList.toggle('active',!timeline&&button.dataset.spaceTab===actor));
  $('timelinePane').classList.toggle('active',timeline);$('privateSpacePane').classList.toggle('active',!timeline);
  if(timeline){activeNicheActor='';return;}
  activeNicheActor=actor;nichePage=0;renderPrivateSpace(actor);loadNicheCards(actor);
}
function fmtTime(ts){if(!ts)return '无';return new Date(ts*1000).toLocaleString('zh-CN',{hour12:false});}
async function loadTimeline(){const el=$('timelineList');el.innerHTML='<div class="empty">加载中...</div>';try{const d=await api('GET',`/api/timeline?hours=${$('timelineHours').value}&limit=500`);timelineItems=(d.items||[]).slice().reverse();el.innerHTML=timelineItems.length?timelineItems.map((i,idx)=>`<div class="event"><span class="dot"></span><div><div class="when">${escHtml(i.time||fmtTime(i.timestamp))}</div><button class="event-title" onclick="showTimelineDetail(${idx},this)">${escHtml(i.title||'家庭动态')}</button></div></div>`).join(''):'<div class="empty">暂无家庭动态</div>';el.scrollTop=el.scrollHeight;}catch(e){timelineItems=[];el.innerHTML='<div class="empty">加载失败</div>';}}
function showTimelineDetail(idx,anchor){const item=timelineItems[idx];if(!item)return;currentNicheCard=null;showDetail(item.timestamp,item.title||'家庭动态',item.detail||'暂无详情',item.attachments||[],[]);}
function showDetail(timestamp,title,text,images,sources,isNiche=false){$('timelineDetailTime').textContent=fmtTime(timestamp);$('timelineDetailTitle').textContent=title;$('timelineDetailText').textContent=text;const safeImages=(Array.isArray(images)?images:[]).filter(url=>typeof url==='string'&&url);$('timelineDetailImages').innerHTML=safeImages.map(url=>`<img src="${escHtml(url)}" alt="壁龛照片" loading="lazy">`).join('');const safeSources=Array.isArray(sources)?sources:[];$('nicheSources').classList.toggle('show',safeSources.length>0);$('nicheSources').open=false;$('nicheSourceLinks').innerHTML=safeSources.map(source=>`<a href="${escHtml(source.url||'')}" target="_blank" rel="noopener">${escHtml(source.title||'旅行线索')}</a>`).join('');$('postcardMenu').classList.toggle('show',Boolean(isNiche));$('postcardMenu').classList.remove('open');$('timelineDetail').classList.add('show');}
function hideTimelineDetail(){$('timelineDetail').classList.remove('show');$('postcardMenu').classList.remove('open');currentNicheCard=null;}
function togglePostcardMenu(event){event.stopPropagation();$('postcardMenu').classList.toggle('open');}
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideTimelineDetail();});
function nextText(role){if(!role.config.enabled)return '已关闭';if(!role.next_wake_at)return '正在安排下一轮';return `${fmtTime(role.next_wake_at)}（约 ${role.remaining_minutes} 分钟后）`;}
function renderRoles(){const el=$('roleGrid');el.innerHTML=autonomyData.roles.map(role=>{const cfg=role.config;return `<article class="role-card" data-actor="${role.actor}"><div class="role-head"><h3>${escHtml(role.name||'AI')}</h3><button class="role-test" onclick="testWake('${role.actor}')">测试唤醒</button><label class="toggle-switch"><input type="checkbox" ${cfg.enabled?'checked':''} onchange="toggleActor('${role.actor}',this)"><span class="toggle-slider"></span></label></div><div class="status next">下次随机唤醒：${escHtml(nextText(role))}</div><details class="settings"><summary>配置与操作</summary><div class="settings-body"><div class="range">无新消息后随机间隔 <input id="min_${role.actor}" type="number" min="5" max="1440" value="${cfg.min_interval_minutes}">—<input id="max_${role.actor}" type="number" min="5" max="1440" value="${cfg.max_interval_minutes}"> 分钟</div><div class="actions">${autonomyData.actions.map(a=>`<label class="action"><input type="checkbox" data-action="${a.key}" ${cfg.actions[a.key]?'checked':''}> ${escHtml(a.label)}</label>`).join('')}</div><div class="buttons"><button onclick="saveActor('${role.actor}')">保存设置</button></div></div></details></article>`}).join('');}
async function loadAutonomy(){try{autonomyData=await api('GET','/api/idle-autonomy');renderRoles();renderPrivateSpaceTabs();if(activeNicheActor)renderPrivateSpace(activeNicheActor);}catch(e){$('roleGrid').innerHTML='<div class="empty">加载失败</div>';}}
function renderPrivateSpaceTabs(){const tabs=$('privateSpaceTabs');tabs.innerHTML=(autonomyData.roles||[]).map(role=>`<button class="tab" data-space-tab="${escHtml(role.actor)}" onclick="switchTab('space','${escHtml(role.actor)}')">${escHtml(role.name||'AI')}空间</button>`).join('');}
function resetPrivateSpaceDoor(){const scene=$('privateSpaceScene');if(scene)scene.classList.remove('open');}
function doorAssetForActor(actor){return actor==='aion'?'aion-door.webp':'connor-door.webp';}
function renderPrivateSpace(actor){const role=roleForActor(actor);const name=role.name||'AI';const doorAsset=doorAssetForActor(actor);$('privateSpacePane').innerHTML=`<div class="private-space-wrap"><div class="private-space-scene" id="privateSpaceScene" data-niche-actor="${escHtml(actor)}"><img class="space-layer space-board" src="/public/private-space/board.webp" alt="私人空间木板"><div class="space-cards" id="privateSpaceCards"></div><button class="space-door" onclick="openPrivateSpace()" aria-label="打开 ${escHtml(name)} 的私人空间"><img src="/public/private-space/${doorAsset}" alt="${escHtml(name)} 的门"></button><img class="space-layer space-frame day-frame" src="/public/private-space/day-frame.webp" alt=""><img class="space-layer space-frame night-frame" src="/public/private-space/night-frame.webp" alt=""></div></div>`;renderNicheCards(actor);}
function openPrivateSpace(){const scene=$('privateSpaceScene');if(scene)scene.classList.add('open');}
async function loadNicheCards(actor){try{const data=await api('GET',`/api/idle-autonomy/niches?actor=${encodeURIComponent(actor)}&limit=100`);nicheCardsByActor[actor]=data.cards||[];if(activeNicheActor===actor)renderNicheCards(actor);}catch(e){if(activeNicheActor===actor){const cards=$('privateSpaceCards');if(cards)cards.innerHTML='<div class="niche-empty">卡片暂时没有加载出来</div>';}}}
function nicheSlot(index){const slots=[{x:21,y:30,w:18,h:12,r:-4},{x:42,y:29,w:17,h:13,r:3},{x:62,y:31,w:18,h:12,r:-2},{x:23,y:44,w:17,h:12,r:3},{x:43,y:43,w:19,h:13,r:-3},{x:64,y:45,w:16,h:12,r:4},{x:20,y:58,w:19,h:13,r:2},{x:42,y:59,w:17,h:12,r:-4},{x:62,y:58,w:18,h:13,r:3},{x:23,y:73,w:17,h:12,r:-3},{x:43,y:73,w:19,h:12,r:2},{x:64,y:72,w:16,h:13,r:-4}];const slot=slots[index%slots.length];return `--card-x:${slot.x}%;--card-y:${slot.y}%;--card-w:${slot.w}%;--card-h:${slot.h}%;--card-r:${slot.r}deg`;}
function renderNicheCards(actor){const cards=$('privateSpaceCards');if(!cards||activeNicheActor!==actor)return;const allCards=nicheCardsByActor[actor]||[];const pages=Math.max(1,Math.ceil(allCards.length/NICHE_PAGE_SIZE));nichePage=Math.max(0,Math.min(nichePage,pages-1));nicheCards=allCards.slice(nichePage*NICHE_PAGE_SIZE,(nichePage+1)*NICHE_PAGE_SIZE);cards.innerHTML=nicheCards.length?nicheCards.map((card,index)=>`<button class="niche-card ${card.photo_path?'photo-card':'note-card'}" style="${nicheSlot(index)}" onclick="showNicheCard(${index},this)">${card.photo_path?`<img src="${escHtml(card.photo_path)}" alt="私人空间照片" loading="lazy">`:'<div class="note-mark"></div>'}<span class="niche-state ${card.mentioned?'mentioned':'fresh'}">${card.mentioned?'已提及':'未提及'}</span><strong>${escHtml(card.title||'一次小旅行')}</strong><div class="niche-meta">${escHtml(fmtTime(card.created_at))}</div><div class="niche-tags">${(card.tags||[]).map(tag=>`#${escHtml(tag)}`).join(' ')}</div></button>`).join(''):'<div class="niche-empty">这里还空着。<br>等下一次小旅行回来吧。</div>';if(pages>1)cards.insertAdjacentHTML('beforeend',`<div class="niche-pager"><button onclick="changeNichePage(-1)" ${nichePage===0?'disabled':''}>‹</button><span>${nichePage+1} / ${pages}</span><button onclick="changeNichePage(1)" ${nichePage===pages-1?'disabled':''}>›</button></div>`);}
function changeNichePage(delta){nichePage+=delta;renderNicheCards(activeNicheActor);}
function showNicheCard(index,anchor){const card=nicheCards[index];if(!card)return;currentNicheCard=card;showDetail(card.created_at,card.title||'一次小旅行',card.reflection||'这次只留下了一张照片。',card.photo_path?[card.photo_path]:[],card.sources||[],true);updateMentionButton();}
function updateMentionButton(){const button=$('postcardMentionToggle');const card=currentNicheCard;if(button&&card)button.textContent=card.mentioned?'设为未提及':'设为已提及';}
async function toggleNicheMention(){const card=currentNicheCard;if(!card||!activeNicheActor)return;const mentioned=!card.mentioned;try{const result=await api('PATCH',`/api/idle-autonomy/niches/${encodeURIComponent(card.id)}?actor=${encodeURIComponent(activeNicheActor)}`,{mentioned});const updated=result.card||{...card,mentioned};nicheCardsByActor[activeNicheActor]=(nicheCardsByActor[activeNicheActor]||[]).map(item=>item.id===card.id?updated:item);currentNicheCard=updated;renderNicheCards(activeNicheActor);updateMentionButton();$('postcardMenu').classList.remove('open');showToast(mentioned?'卡片已设为已提及':'卡片已设为未提及');}catch(e){showToast('状态修改失败');}}
async function deleteNicheCard(){const card=currentNicheCard;if(!card||!activeNicheActor)return;if(!confirm(`确定把「${card.title||'这张卡片'}」从壁龛里移除吗？原始图片文件会保留。`))return;try{await api('DELETE',`/api/idle-autonomy/niches/${encodeURIComponent(card.id)}?actor=${encodeURIComponent(activeNicheActor)}`);nicheCardsByActor[activeNicheActor]=(nicheCardsByActor[activeNicheActor]||[]).filter(item=>item.id!==card.id);hideTimelineDetail();renderNicheCards(activeNicheActor);showToast('卡片已经从壁龛里收走了');}catch(e){showToast('删除失败，卡片还在原处');}}
async function toggleActor(actor,input){const role=autonomyData.roles.find(r=>r.actor===actor);const enabled=input.checked;const warning=enabled?`确定开启 ${role.name} 的自主意识吗？开启后会立即开始独立随机计时。`:`确定关闭 ${role.name} 的自主意识吗？当前计时会立即清除。`;if(!confirm(warning)){input.checked=!enabled;return;}try{await api('PUT',`/api/idle-autonomy/${actor}/config`,{enabled});showToast(enabled?'自主意识已开启，独立计时已经开始':'自主意识已关闭，当前计时已清除');await loadAutonomy();}catch(e){input.checked=!enabled;showToast('操作失败，设置未改变');}}
async function saveActor(actor){const card=document.querySelector(`[data-actor="${actor}"]`);const actions={};card.querySelectorAll('[data-action]').forEach(x=>actions[x.dataset.action]=x.checked);try{await api('PUT',`/api/idle-autonomy/${actor}/config`,{min_interval_minutes:Number($(`min_${actor}`).value),max_interval_minutes:Number($(`max_${actor}`).value),actions});showToast('设置已保存');await loadAutonomy();}catch(e){showToast('保存失败');}}
async function testWake(actor){try{const r=await api('POST',`/api/idle-autonomy/${actor}/run-once`);showToast(r.ok?'测试唤醒完成':(r.skipped||r.error||'无法唤醒'));await Promise.all([loadAutonomy(),loadTimeline()]);}catch(e){showToast('测试唤醒失败');}}
connectCommonWS(msg=>{if(msg.type==='idle_event')loadTimeline();if(msg.type==='autonomy_state_changed')loadAutonomy();});
loadAutonomy();loadTimeline();
</script>
</body></html>
