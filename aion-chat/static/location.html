<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>定位地图 - Aion</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff8359">
<style>
.loc-panel-status { margin-bottom:12px; padding:14px; border:1px solid var(--border); border-radius:18px; background:var(--surface); box-shadow:0 4px 14px rgba(0,0,0,.04); }
.loc-current { display:flex; align-items:center; gap:12px; padding:0 0 14px; }
.loc-current-icon { display:flex; align-items:center; justify-content:center; flex-shrink:0; width:58px; height:58px; border-radius:50%; background:var(--surface2); font-size:30px; }
.loc-current-info { min-width:0; }
.loc-current-state { display:block; color:var(--text); font-size:22px; font-weight:600; line-height:1.35; }
.loc-current-address { display:block; margin-top:5px; color:var(--text2); font-size:13px; line-height:1.65; overflow-wrap:anywhere; }
.loc-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.4fr); gap:6px; }
.loc-stat { min-width:0; padding:10px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:12px; }
.loc-stat-label { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text3); }
.loc-stat-val { display:block; margin-top:7px; font-size:12px; line-height:1.5; font-variant-numeric:tabular-nums; color:var(--text); overflow-wrap:anywhere; }
#lpAmapUsage { font-size:11px; }
.loc-sync-row { margin-bottom:14px; }
.loc-btn { display:flex; align-items:center; justify-content:center; gap:5px; min-width:0; min-height:40px; padding:10px 12px; border:1px solid var(--accent); border-radius:12px; background:var(--accent); color:#fff; font-family:inherit; font-size:12px; line-height:1.5; cursor:pointer; transition:filter .2s, box-shadow .2s; }
.loc-btn:hover { filter:brightness(1.05); }
.loc-btn:active { filter:brightness(.96); }
.loc-btn:disabled { opacity:.65; cursor:wait; }
.loc-btn-secondary { background:var(--surface); color:var(--text); border-color:var(--border); }
.loc-sync-row .loc-btn { width:100%; font-size:14px; }
.loc-cfg-section { margin-top:12px; padding:14px; border:1px solid var(--border); border-radius:18px; background:var(--surface); box-shadow:0 4px 14px rgba(0,0,0,.04); }
.loc-cfg-section h4 { display:flex; align-items:center; justify-content:space-between; font-size:15px; color:var(--text); cursor:pointer; padding:0; user-select:none; }
.loc-cfg-section h4 span { color:var(--accent); font-size:11px; }
#locCfgBody { padding-top:14px; }
.loc-cfg-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.loc-cfg-row label { font-size:12px; color:var(--text); display:flex; align-items:center; gap:6px; }
.loc-cfg-row input[type="checkbox"] { width:15px; height:15px; accent-color:var(--accent); }
.loc-quiet-times { display:flex; align-items:center; gap:7px; flex:1; min-width:190px; color:var(--text3); font-size:12px; }
.loc-cfg-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.loc-cfg-grid label, .loc-key-field label { font-size:11px; color:var(--text3); display:block; margin-bottom:5px; }
.loc-key-field { margin-bottom:10px; }
.loc-cfg-section input:not([type="checkbox"]) { width:100%; min-width:0; min-height:36px; padding:8px 10px; font-family:inherit; font-size:12px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; box-sizing:border-box; outline:none; transition:border-color .2s; }
.loc-cfg-section input:not([type="checkbox"]):focus, .loc-btn:focus-visible { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:2px; }
.loc-cfg-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
@media (max-width:380px) {
  .loc-panel-status, .loc-cfg-section { padding:12px; }
  .loc-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .loc-cfg-actions { gap:8px; }
  .loc-cfg-actions .loc-btn { padding:9px 6px; font-size:11px; }
}
.loc-poi-section { margin-top:12px; }
.loc-poi-category h5 { font-size:13px; color:var(--text); margin:8px 0 4px; }
.poi-count { font-size:11px; color:var(--text3); }
.loc-poi-list { display:flex; flex-direction:column; gap:4px; }
.loc-poi-item { display:flex; gap:8px; padding:6px 4px; border-bottom:1px solid var(--border); }
.loc-poi-item:last-child { border-bottom:none; }
.loc-poi-thumb { width:40px; height:40px; border-radius:6px; object-fit:cover; flex-shrink:0; }
.loc-poi-thumb-placeholder { width:40px; height:40px; border-radius:6px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.loc-poi-info { flex:1; min-width:0; }
.loc-poi-name { font-size:13px; font-weight:600; }
.loc-poi-meta { font-size:11px; color:var(--text2); margin-top:1px; }
.loc-poi-addr { font-size:11px; color:var(--text3); margin-top:1px; }
.poi-rating { color:#f59e0b; }
.poi-cost { color:#ef4444; }
.loc-poi-empty { padding:16px; text-align:center; color:var(--text3); font-size:13px; }
</style>
</head>
<body>
<div class="sub-page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='/'">⬅</button>
    <h2>📍 定位地图</h2>
  </div>
  <div class="page-content">
    <!-- 状态概览 -->
    <div class="loc-panel-status">
      <div class="loc-current">
        <span class="loc-current-icon" aria-hidden="true">📍</span>
        <div class="loc-current-info">
          <span class="loc-current-state" id="lpState">--</span>
          <span class="loc-current-address" id="lpAddr">--</span>
        </div>
      </div>
      <div class="loc-metrics">
        <div class="loc-stat"><span class="loc-stat-label"><span aria-hidden="true">📍</span>距家</span> <span class="loc-stat-val" id="lpDist">--</span></div>
        <div class="loc-stat"><span class="loc-stat-label"><span aria-hidden="true">☀️</span>天气</span> <span class="loc-stat-val" id="lpWeather">--</span></div>
        <div class="loc-stat"><span class="loc-stat-label"><span aria-hidden="true">🕒</span>更新</span> <span class="loc-stat-val" id="lpTime">--</span></div>
        <div class="loc-stat"><span class="loc-stat-label"><span aria-hidden="true">📊</span>今日高德请求</span> <span class="loc-stat-val" id="lpAmapUsage">--</span></div>
      </div>
    </div>
    <!-- 立即同步按钮 -->
    <div class="loc-sync-row">
      <button id="btnForceSync" class="btn-save loc-btn" onclick="forceSync()">🔄 同步位置</button>
    </div>
    <!-- 配置区 -->
    <div class="loc-cfg-section">
      <h4 onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('span').textContent=this.nextElementSibling.style.display==='none'?'▶':'▼'">⚙ 配置 <span>▼</span></h4>
      <div id="locCfgBody">
        <div class="loc-cfg-row">
          <label><input type="checkbox" id="lp_enabled" style="accent-color:var(--accent)"> 启用定位</label>
          <label><input type="checkbox" id="lp_quiet" style="accent-color:var(--accent)"> 静默时段</label>
          <div class="loc-quiet-times">
            <input type="time" id="lp_qstart" value="00:00">
            <span>~</span>
            <input type="time" id="lp_qend" value="08:00">
          </div>
        </div>
        <div class="loc-key-field">
          <label>高德 Web服务 API Key</label>
          <input type="text" id="lp_amap_key" placeholder="32位十六进制" autocomplete="off" class="form-input">
        </div>
        <div class="loc-cfg-grid">
          <div><label>家经度</label><input type="text" id="lp_home_lng" placeholder="经度" autocomplete="off"></div>
          <div><label>家纬度</label><input type="text" id="lp_home_lat" placeholder="纬度" autocomplete="off"></div>
          <div><label>离家阈值(m)</label><input type="number" id="lp_threshold" placeholder="500" autocomplete="off"></div>
          <div><label>POI半径(m)</label><input type="number" id="lp_poi_radius" placeholder="2000" autocomplete="off"></div>
        </div>
        <div class="loc-cfg-actions">
          <button class="btn-save loc-btn" onclick="saveLocPanel()">💾 保存配置</button>
          <button class="btn-save loc-btn loc-btn-secondary" onclick="setHomeLoc()">📍 用当前定位设为家</button>
        </div>
        <div id="lpCfgMsg" style="font-size:11px;color:var(--text2);margin-top:4px"></div>
      </div>
    </div>
    <!-- POI 列表 -->
    <div class="loc-poi-section">
      <h4 style="margin:0 0 8px;font-size:13px;color:var(--accent)">📌 周边 POI</h4>
      <div id="locPoiContent"><div class="loc-poi-empty">暂无 POI 数据（需要时按需搜索）</div></div>
    </div>
  </div>
</div>
<script src="/static/theme.js?v=theme-20260606"></script>
<script src="/static/common.js"></script>
<script>
connectCommonWS(msg => {
  if (msg.type === "location_update" && msg.data) {
    updateLocPanelStatus(msg.data);
    if (msg.data.nearby_pois) renderLocPois(msg.data.nearby_pois);
  }
});

(async function init() {
  await loadLocPanel();
})();

async function loadLocPanel() {
  try {
    const loc = await api("GET", "/api/location/config");
    $("lp_enabled").checked = loc.enabled || false;
    $("lp_amap_key").value = "";
    $("lp_amap_key").placeholder = loc.amap_key_masked || "32位十六进制";
    const usage = (loc.amap_usage_today || {}).counts || {};
    $("lpAmapUsage").textContent = `${usage.total || 0}（地址${usage.regeo || 0} / 天气${usage.weather || 0} / POI ${usage.poi || 0}）`;
    $("lp_home_lng").value = (loc.home_lng && loc.home_lat) ? loc.home_lng : "";
    $("lp_home_lat").value = (loc.home_lng && loc.home_lat) ? loc.home_lat : "";
    $("lp_threshold").value = loc.home_threshold || 500;
    $("lp_poi_radius").value = loc.poi_radius || 2000;
    $("lp_quiet").checked = loc.quiet_hours_enabled || false;
    $("lp_qstart").value = loc.quiet_hours_start || "00:00";
    $("lp_qend").value = loc.quiet_hours_end || "08:00";
  } catch(e){}
  try {
    const s = await api("GET", "/api/location/status");
    updateLocPanelStatus(s);
    renderLocPois(s.nearby_pois || {});
  } catch(e){}
}

function updateLocPanelStatus(s) {
  if (!s || !s.lng) { $("lpState").textContent = "未知"; return; }
  const stateMap = {at_home:"🏠 在家", outside:"🚶 外出", unknown:"❓ 未知"};
  $("lpState").textContent = stateMap[s.state] || s.state;
  $("lpAddr").textContent = s.address || "--";
  if (s.distance_from_home > 0) { const d = s.distance_from_home; $("lpDist").textContent = d >= 1000 ? (d/1000).toFixed(1)+'km' : Math.round(d)+'m'; } else { $("lpDist").textContent = "--"; }
  if (s.weather && s.weather.weather) $("lpWeather").textContent = `${s.weather.weather} ${s.weather.temperature}°C`; else $("lpWeather").textContent = "--";
  if (s.updated_at) $("lpTime").textContent = new Date(s.updated_at * 1000).toLocaleTimeString(); else $("lpTime").textContent = "--";
}

function renderLocPois(pois) {
  const el = $("locPoiContent");
  if (!pois || !Object.keys(pois).length) { el.innerHTML = '<div class="loc-poi-empty">暂无 POI 数据（需要时按需搜索）</div>'; return; }
  const typeIcons = {"餐饮美食":"🍜","风景名胜":"🏞️","休闲娱乐":"🎮","购物":"🛒","酒店住宿":"🏨","生活服务":"🔧"};
  let html = '';
  for (const [category, items] of Object.entries(pois)) {
    if (!items || !items.length) continue;
    const icon = typeIcons[category] || "📍";
    html += `<div class="loc-poi-category"><h5>${icon} ${escHtml(category)} <span class="poi-count">(${items.length})</span></h5><div class="loc-poi-list">`;
    for (const p of items) {
      const dist = p.distance ? `${parseInt(p.distance)}m` : '';
      const photoUrl = (p.photos && p.photos.length) ? p.photos[0] : '';
      const thumb = photoUrl ? `<img class="loc-poi-thumb" src="${escHtml(photoUrl)}" alt="" onerror="this.outerHTML='<div class=\\'loc-poi-thumb-placeholder\\'>📍</div>'">` : '<div class="loc-poi-thumb-placeholder">📍</div>';
      let meta = '';
      if (dist) meta += dist;
      if (p.rating && p.rating !== '[]') meta += (meta ? ' · ' : '') + `<span class="poi-rating">⭐${p.rating}</span>`;
      if (p.cost && p.cost !== '[]') meta += (meta ? ' · ' : '') + `<span class="poi-cost">¥${p.cost}</span>`;
      if (p.tel) meta += (meta ? ' · ' : '') + `📞${p.tel}`;
      html += `<div class="loc-poi-item">${thumb}<div class="loc-poi-info"><div class="loc-poi-name">${escHtml(p.name)}</div><div class="loc-poi-meta">${meta}</div>${p.address && p.address !== '[]' ? `<div class="loc-poi-addr">${escHtml(p.address)}</div>` : ''}</div></div>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
}

async function saveLocPanel() {
  try {
    const body = { enabled: $("lp_enabled").checked, quiet_hours_enabled: $("lp_quiet").checked, quiet_hours_start: $("lp_qstart").value, quiet_hours_end: $("lp_qend").value };
    const ak = $("lp_amap_key").value.trim(); if (ak) body.amap_key = ak;
    const hlng = parseFloat($("lp_home_lng").value); const hlat = parseFloat($("lp_home_lat").value);
    if (!isNaN(hlng)) body.home_lng = hlng; if (!isNaN(hlat)) body.home_lat = hlat;
    const ht = parseInt($("lp_threshold").value); if (!isNaN(ht)) body.home_threshold = ht;
    const pr = parseInt($("lp_poi_radius").value); if (!isNaN(pr)) body.poi_radius = pr;
    await api("PUT", "/api/location/config", body);
    $("lpCfgMsg").textContent = "✅ 已保存";
    setTimeout(() => $("lpCfgMsg").textContent = "", 2000);
  } catch(e) { $("lpCfgMsg").textContent = "❌ " + e.message; }
}

async function forceSync() {
  const btn = $("btnForceSync");
  btn.disabled = true;
  btn.textContent = "⏳ 同步中...";
  try {
    const before = await api("GET", "/api/location/status");
    const previousUpdatedAt = Number(before.updated_at) || 0;
    const requested = await api("POST", "/api/location/request-phone-sync");
    if (!requested || requested.ok !== true) {
      throw new Error((requested && requested.error) || "同步请求失败");
    }

    const deadline = Date.now() + 15000;
    let syncedStatus = null;
    while (Date.now() < deadline) {
      await new Promise(resolve => setTimeout(resolve, 1000));
      const status = await api("GET", "/api/location/status");
      if ((Number(status.updated_at) || 0) > previousUpdatedAt) {
        syncedStatus = status;
        break;
      }
    }

    if (!syncedStatus) {
      throw new Error("手机未响应或定位失败");
    }

    updateLocPanelStatus(syncedStatus);
    renderLocPois(syncedStatus.nearby_pois || {});
    btn.textContent = "✅ 已同步";
  } catch(e) {
    btn.textContent = "❌ " + e.message;
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = "🔄 同步位置"; }, 2000);
}
async function setHomeLoc() {
  try {
    const r = await api("POST", "/api/location/set-home");
    if (r.ok) { $("lp_home_lng").value = r.home_lng; $("lp_home_lat").value = r.home_lat; $("lpCfgMsg").textContent = "✅ 已设为家：" + (r.address || `${r.home_lng},${r.home_lat}`); return; }
  } catch(e){}
  if (!navigator.geolocation) { alert("浏览器不支持定位"); return; }
  $("lpCfgMsg").textContent = "📡 正在获取浏览器定位...";
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        await api("POST", "/api/location/heartbeat", {lng:pos.coords.longitude, lat:pos.coords.latitude, accuracy:pos.coords.accuracy, is_gcj02:false, force:true});
        const r = await api("POST", "/api/location/set-home");
        if (r.ok) { $("lp_home_lng").value = r.home_lng; $("lp_home_lat").value = r.home_lat; $("lpCfgMsg").textContent = "✅ 已设为家：" + (r.address || `${r.home_lng},${r.home_lat}`); loadLocPanel(); }
        else { $("lpCfgMsg").textContent = "❌ " + (r.error || "设置失败"); }
      } catch(e) { $("lpCfgMsg").textContent = "❌ " + e.message; }
    },
    (err) => { $("lpCfgMsg").textContent = "❌ 定位失败，请手动输入坐标"; },
    {enableHighAccuracy:true, timeout:15000}
  );
}
</script>
</body>
</html>
