<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>记忆库</title>
<meta name="theme-color" content="#fff9f5">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/memory-library.css?v=20261023-1">
<script src="/static/theme.js?v=theme-20260606">
</script>
</head>
<body>
<svg style="display:none" aria-hidden="true">
<symbol id="s-back" viewBox="0 0 24 24">
<path d="m14 6-6 6 6 6"/>
</symbol>
<symbol id="s-more" viewBox="0 0 24 24">
<circle cx="5" cy="12" r="1"/>
<circle cx="12" cy="12" r="1"/>
<circle cx="19" cy="12" r="1"/>
</symbol>
<symbol id="s-add" viewBox="0 0 24 24">
<path d="M12 5v14M5 12h14"/>
</symbol>
<symbol id="s-search" viewBox="0 0 24 24">
<circle cx="10.5" cy="10.5" r="6.5"/>
<path d="m16 16 4 4"/>
</symbol>
<symbol id="s-filter" viewBox="0 0 24 24">
<path d="M4 7h16M7 12h10M10 17h4"/>
</symbol>
<symbol id="s-link" viewBox="0 0 24 24">
<path d="m10 13 4-4M8 15l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 3 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/>
</symbol>
<symbol id="s-close" viewBox="0 0 24 24">
<path d="m6 6 12 12M18 6 6 18"/>
</symbol>
</svg>
<main class="app sub-page">
<header class="top-bar">
<button class="icon back-btn" data-custom-back id="back" aria-label="返回入口">
<svg>
<use href="#s-back"/>
</svg>
</button>
<h1>记忆库</h1>
<a class="icon" href="/user-profile" aria-label="查看用户画像" title="用户画像" style="font-size:12px;text-decoration:none">画像</a>
<span class="spacer">
</span>
<button class="primary" id="add">
<svg>
<use href="#s-add"/>
</svg>新增</button>
<button class="icon" id="tools" aria-label="记忆库工具">
<svg>
<use href="#s-more"/>
</svg>
</button>
</header>
<div class="workspace">
<section class="column" aria-label="记忆列表">
<div class="controls">
<div class="stores" aria-label="切换记忆库">
<button class="store" data-store="main" aria-pressed="true">
<span class="avatar">A</span>
<span id="mainName">主记忆库</span>
<small>主记忆库</small>
</button>
<button class="store" data-store="second" aria-pressed="false">
<span class="avatar second">C</span>
<span id="secondName">第二记忆库</span>
<small>记忆库</small>
</button>
</div>
<div class="tabs" role="tablist" aria-label="记忆视图">
<button class="tab" role="tab" data-view="memories" aria-selected="true">记忆</button>
<button class="tab" role="tab" data-view="unresolved" aria-selected="false">未完成</button>
<button class="tab" role="tab" data-view="atoms" aria-selected="false">原子档案</button>
<span class="help" id="viewHelp">日常与长期记忆</span>
</div>
<div class="searchrow">
<label class="search">
<svg>
<use href="#s-search"/>
</svg>
<input id="search" aria-label="搜索记忆正文或关键词" placeholder="搜索正文、关键词…">
</label>
<button class="filterbtn" id="filter" aria-expanded="false">
<svg>
<use href="#s-filter"/>
</svg>筛选</button>
</div>
<div class="filters" id="filters" hidden>
<input id="from" type="date" aria-label="开始日期">
<span>至</span>
<input id="to" type="date" aria-label="结束日期">
<button id="reset">清空</button>
</div>
<div class="meta-bar">
<div class="chips" id="chips">
</div>
<span class="count" id="count">
</span>
</div>
</div>
<div class="list" id="list">
</div>
<footer class="paging">
<form id="pageJump" class="page-jump" novalidate>
<label for="pageInput">第</label>
<input id="pageInput" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="跳转页码" disabled>
<span id="pageLabel">/ 1 页</span>
<button id="jump" type="submit" disabled>跳转</button>
</form>
<div>
<button id="prev">上一页</button> <button id="next">下一页</button>
</div>
</footer>
</section>
<aside class="detail" id="detail" aria-label="记忆详情">
<div class="detail-header">
<strong id="detailTitle">记忆详情</strong>
<span class="spacer">
</span>
<button class="icon close-detail" id="closeDetail" aria-label="关闭详情">
<svg>
<use href="#s-close"/>
</svg>
</button>
</div>
<div class="detail-scroll" id="detailBody">
</div>
<div class="detail-actions">
<button class="secondary danger" id="delete">删除</button>
<button class="primary" id="edit">编辑记忆</button>
</div>
</aside>
</div>
<div class="library-status" id="status" role="status">
</div>
</main>
<div class="scrim" id="scrim">
</div>
<div class="toast" id="toast" role="status" hidden>
</div>
<dialog id="dialog">
<div class="dialog-head">
<strong id="dialogTitle">
</strong>
<button class="icon" id="closeDialog" aria-label="关闭">
<svg>
<use href="#s-close"/>
</svg>
</button>
</div>
<div class="dialog-body" id="dialogBody">
</div>
<div class="dialog-actions" id="dialogActions">
</div>
</dialog>

<script src="/static/common.js?v=retained-pages-20260924">
</script>
<script src="/static/memory-library.js?v=20261103-1">
</script>
</body>
</html>
