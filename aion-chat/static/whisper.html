<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fa">
  <title>密语时刻 · 选择玩具</title>
  <link rel="stylesheet" href="/static/toy-pages.css?v=20260919">
</head>
<body class="toy-page toy-chooser-page">
  <header class="toy-topbar">
    <a class="toy-icon-button" href="/" data-toy-return aria-label="返回聊天">‹</a>
    <div>
      <p class="toy-eyebrow">PRIVATE CONNECTION</p>
      <h1>密语时刻</h1>
    </div>
    <span class="toy-topbar-spacer" aria-hidden="true"></span>
  </header>

  <main class="toy-shell toy-chooser-shell">
    <section class="toy-hero">
      <span class="toy-hero-orbit" aria-hidden="true"></span>
      <p class="toy-kicker">只连接此刻想用的那一只</p>
      <h2>今晚，选哪一种节奏？</h2>
      <p>三套控制器完全独立。选好后会记住，下次直接打开这一套；需要更换时再点“更换玩具”。</p>
    </section>

    <section class="toy-choice-grid" aria-label="选择玩具">
      <button class="toy-choice-card toy-choice-card--sosexy" type="button" data-toy-profile="sosexy">
        <span class="toy-choice-number">01</span>
        <span class="toy-choice-art" aria-hidden="true"><span>✦</span></span>
        <span class="toy-choice-copy">
          <strong>SOSEXY</strong>
          <small>经典九档预设</small>
          <em>进入控制 <span aria-hidden="true">→</span></em>
        </span>
      </button>

      <button class="toy-choice-card toy-choice-card--svakom" type="button" data-toy-profile="svakom">
        <span class="toy-choice-number">02</span>
        <span class="toy-choice-art" aria-hidden="true"><span>↕</span><i></i></span>
        <span class="toy-choice-copy">
          <strong>SVAKOM · SL278</strong>
          <small>伸缩 · 震动 · 加热</small>
          <em>进入控制 <span aria-hidden="true">→</span></em>
        </span>
      </button>
      <button class="toy-choice-card toy-choice-card--ankni" type="button" data-toy-profile="ankni">
        <span class="toy-choice-number">03</span>
        <span class="toy-choice-art" aria-hidden="true"><span>≈</span></span>
        <span class="toy-choice-copy"><strong>ANKNI MX</strong><small>十种内置模式＋停止 · 定时编排</small><em>选用这一套 <span aria-hidden="true">→</span></em></span>
      </button>
    </section>

    <p class="toy-privacy-note"><span aria-hidden="true">◇</span> 页面不会自动连接，也不会恢复上次动作</p>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/toy-navigation.js?v=20260924-selection"></script>
</body>
</html>
