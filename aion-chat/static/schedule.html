<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程管理</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff8359">
<style>
.schedule-page { --sch-muted:#67584f; --sch-subtle:#76665d; --sch-accent-text:#9f3c19; --sch-accent-fg:#31170f; --sch-add-bg:#f47a33; --sch-add-fg:#32180e; --sch-alarm:#7a3d00; --sch-reminder:#31598c; --sch-monitor:#26634f; --sch-completed:#3159a5; --sch-cancelled:#a12649; flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; padding:12px 16px 16px; gap:10px; }
body[data-theme="dark"] .schedule-page { --sch-muted:#c5c9ef; --sch-subtle:#aeb5e4; --sch-accent-text:#c7baff; --sch-accent-fg:#160b32; --sch-add-bg:#ff8a3d; --sch-add-fg:#2b1308; --sch-alarm:#ffbf86; --sch-reminder:#a9c9ff; --sch-monitor:#8be7c9; --sch-completed:#adc5ff; --sch-cancelled:#ff9ab7; }
.sch-tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; flex-shrink:0; border:1px solid var(--border); border-radius:14px; background:var(--surface2); }
.sch-tab { min-height:36px; border:0; border-radius:10px; background:transparent; color:var(--sch-muted); font-size:13px; font-weight:600; cursor:pointer; transition:background .18s ease,color .18s ease,box-shadow .18s ease; }
.sch-tab.active { background:var(--surface); color:var(--sch-accent-text); box-shadow:0 4px 14px color-mix(in srgb,var(--text) 10%,transparent); }
.sch-tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.sch-tab-panel { display:none; flex:1; min-height:0; }
.sch-tab-panel.active { display:flex; min-height:0; flex-direction:column; gap:10px; }
.sch-tab-panel[hidden] { display:none; }
.sch-current-workspace { flex:1; min-height:0; display:grid; grid-template-rows:minmax(0,13fr) minmax(180px,7fr); gap:10px; }
.sch-schedule-block { min-height:0; display:flex; flex-direction:column; gap:8px; }
.sch-list { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--border); border-radius:14px; background:color-mix(in srgb,var(--surface) 88%,transparent); box-shadow:0 10px 30px color-mix(in srgb,var(--text) 6%,transparent); }
.sch-item { display:flex; align-items:flex-start; gap:9px; padding:11px 12px; border-bottom:1px solid var(--border); transition:background .16s ease; }
.sch-item:hover { background:color-mix(in srgb,var(--accent) 5%,transparent); }
.sch-item:last-child { border-bottom:none; }
.sch-icon { font-size:17px; flex-shrink:0; margin-top:1px; }
.sch-body { flex:1; min-width:0; }
.sch-origin { font-size:11.5px; color:var(--sch-muted); font-weight:600; margin-right:4px; white-space:nowrap; }
.sch-content { font-size:13.5px; line-height:1.45; color:var(--text); word-break:break-word; }
.sch-type,.sch-history-status { display:inline-block; margin-left:6px; padding:2px 6px; border-radius:999px; font-size:9.5px; line-height:1.35; vertical-align:1px; }
.sch-type.alarm { background:color-mix(in srgb,var(--accent) 16%,var(--surface)); color:var(--sch-alarm); }
.sch-type.reminder { background:color-mix(in srgb,var(--text2) 13%,var(--surface)); color:var(--sch-reminder); }
.sch-type.monitor { background:color-mix(in srgb,var(--ai-bg) 38%,var(--surface)); color:var(--sch-monitor); }
.sch-time { font-size:10.5px; color:var(--sch-subtle); margin-top:3px; }
.sch-history-item { padding:8px 10px; }
.sch-history-item .sch-content { font-size:12px; color:var(--text); }
.sch-history-item .sch-origin { font-size:10.5px; color:var(--sch-muted); }
.sch-history-item .sch-time { font-size:10px; color:var(--sch-subtle); }
.sch-history-item .sch-icon { font-size:15px; }
.sch-history-status { background:color-mix(in srgb,var(--accent) 12%,var(--surface)); color:var(--sch-completed); }
.sch-history-status.cancelled { background:color-mix(in srgb,var(--danger) 12%,var(--surface)); color:var(--sch-cancelled); }
.sch-del-btn { width:30px; height:30px; border:none; border-radius:50%; background:transparent; color:var(--danger); font-size:13px; cursor:pointer; opacity:1; flex-shrink:0; }
.sch-del-btn:hover { opacity:1; background:color-mix(in srgb,var(--danger) 10%,transparent); }
.sch-del-btn:focus-visible { outline:2px solid var(--danger); outline-offset:1px; }
.sch-empty { min-height:110px; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--sch-muted); font-size:13px; }
.sch-add-section { flex-shrink:0; padding:10px; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:0 8px 24px color-mix(in srgb,var(--text) 5%,transparent); }
.sch-add-section input[type="text"] { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 11px; font-size:13px; outline:none; margin-bottom:8px; box-sizing:border-box; }
.sch-add-row2 { display:flex; gap:6px; align-items:center; }
.sch-add-row2 input { flex:1; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:7px 9px; font-size:12px; outline:none; min-width:0; }
.sch-add-row2 select { padding:7px 9px; border:1px solid var(--border); border-radius:10px; background:var(--surface2); color:var(--text); font-size:12px; flex-shrink:0; }
.sch-add-row2 button { padding:8px 15px; border:none; border-radius:10px; background:var(--sch-add-bg); color:var(--sch-add-fg); font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0; box-shadow:0 5px 14px color-mix(in srgb,var(--sch-add-bg) 28%,transparent); }
.sch-add-section input:focus,.sch-add-section select:focus { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 18%,transparent); outline-offset:1px; }
.private-memo-section { min-height:0; display:flex; flex-direction:column; padding:9px 10px; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:0 8px 24px color-mix(in srgb,var(--text) 5%,transparent); }
.private-memo-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.private-memo-title { font-size:14px; font-weight:750; color:var(--text); }
.private-memo-mic { width:44px; height:44px; border:0; border-radius:50%; color:white; font-size:22px; cursor:pointer; background:linear-gradient(145deg,#62c9ff,#8068ff 58%,#d975ff); box-shadow:0 5px 15px color-mix(in srgb,#8068ff 35%,transparent); }
.private-memo-list { min-height:0; overflow-y:auto; }
.private-memo-item { display:flex; align-items:center; gap:8px; min-height:38px; border-top:1px solid var(--border); }
.private-memo-item.completed .private-memo-content { color:var(--sch-subtle); text-decoration:line-through; }
.private-memo-content { flex:1; min-width:0; font-size:14px; line-height:1.4; color:var(--text); word-break:break-word; }
.memo-check { width:22px; height:22px; border:2px solid var(--accent); border-radius:50%; background:transparent; color:white; padding:0; flex-shrink:0; }
.memo-check.completed { border:0; background:var(--accent); }
.memo-action { width:30px; height:30px; border:0; border-radius:50%; background:transparent; color:var(--sch-muted); font-size:15px; }
.memo-action.danger { color:var(--danger); }
.private-memo-empty { padding:15px 8px; text-align:center; color:var(--sch-muted); font-size:12px; }
.private-memo-completed-toggle { border:0; background:transparent; color:var(--sch-muted); text-align:left; padding:7px 0 2px; font-size:12px; }
@media (max-width:420px) {
  .schedule-page { padding:10px 12px 12px; }
  .sch-add-row2 { flex-wrap:wrap; }
  .sch-add-row2 input { flex-basis:calc(100% - 92px); }
  .sch-add-row2 select { flex:1; }
  .sch-add-row2 button { flex-basis:100%; width:100%; min-height:46px; font-size:15px; border-radius:12px; }
  .sch-current-workspace { grid-template-rows:minmax(0,13fr) minmax(190px,7fr); }
}
@media (prefers-reduced-motion:reduce) {
  .sch-tab,.sch-item { transition:none; }
}
</style>
</head>
<body>
<div class="sub-page">
  <div class="top-bar">
    <button class="back-btn" onclick="location.href='/'">⬅</button>
    <h2>📅 日程管理</h2>
  </div>
  <div class="page-content schedule-page">
    <div class="sch-tabs" role="tablist" aria-label="日程分类">
      <button class="sch-tab active" id="schTabActive" role="tab" tabindex="0" aria-selected="true" aria-controls="schPanelActive" onclick="switchScheduleTab('active')" onkeydown="handleScheduleTabKeydown(event, 'active')">当前 0</button>
      <button class="sch-tab" id="schTabHistory" role="tab" tabindex="-1" aria-selected="false" aria-controls="schPanelHistory" onclick="switchScheduleTab('history')" onkeydown="handleScheduleTabKeydown(event, 'history')">历史 0</button>
    </div>
    <section class="sch-tab-panel active" id="schPanelActive" role="tabpanel" aria-labelledby="schTabActive">
      <div class="sch-current-workspace">
        <div class="sch-schedule-block">
          <div class="sch-list" id="schList"><div class="sch-empty">暂无日程</div></div>
          <div class="sch-add-section">
            <input type="text" id="schAddContent" placeholder="日程内容...">
            <div class="sch-add-row2">
              <input type="datetime-local" id="schAddTime">
              <select id="schAddType">
                <option value="alarm">🔔 闹铃</option>
                <option value="reminder">📋 日程</option>
                <option value="monitor">👁 监督</option>
              </select>
              <button onclick="addScheduleManual()">添加</button>
            </div>
          </div>
        </div>
        <section class="private-memo-section" aria-label="快捷备忘">
          <div class="private-memo-head">
            <span class="private-memo-title">📝 快捷备忘</span>
            <button class="private-memo-mic" onclick="openPrivateMemoRecorder()" aria-label="按住录音添加备忘">🎙</button>
          </div>
          <div class="private-memo-list" id="privateMemoList"><div class="private-memo-empty">暂无备忘</div></div>
          <button class="private-memo-completed-toggle" id="privateMemoCompletedToggle" onclick="toggleCompletedMemos()">已完成 0 ▾</button>
          <div class="private-memo-list" id="privateMemoCompleted" hidden></div>
        </section>
      </div>
    </section>
    <section class="sch-tab-panel" id="schPanelHistory" role="tabpanel" aria-labelledby="schTabHistory" hidden>
      <div class="sch-list" id="schHistoryList"><div class="sch-empty">暂无历史记录</div></div>
    </section>
    </div>
</div>
<script src="/static/theme.js?v=theme-20260606"></script>
<script src="/static/common.js"></script>
<script src="/static/schedule-ui.js"></script>
<script>
connectCommonWS(msg => {
  if (ScheduleUI.shouldReloadSchedules(msg)) loadSchedules();
  if (ScheduleUI.shouldReloadPrivateMemos(msg)) loadPrivateMemos();
});

(async function init() {
  await loadSchedules();
  await loadPrivateMemos();
})();

window.onAionPrivateMemosChanged = () => loadPrivateMemos();

async function loadSchedules() {
  const result = await ScheduleUI.loadScheduleLists(api);
  if (result.active !== null) {
    renderScheduleList(result.active, "schList", "暂无日程", false);
  }
  if (result.history !== null) {
    renderScheduleList(result.history, "schHistoryList", "暂无历史记录", true);
  }
  const activeCount = result.active === null ? $("schList").querySelectorAll(".sch-item").length : result.active.length;
  const historyCount = result.history === null ? $("schHistoryList").querySelectorAll(".sch-item").length : result.history.length;
  ScheduleUI.updateScheduleTabCounts(activeCount, historyCount);
  result.errors.forEach(item => {
    console.error(`loadSchedules(${item.list}):`, item.error);
  });
}

function switchScheduleTab(tab) {
  ScheduleUI.selectScheduleTab(tab);
}

function handleScheduleTabKeydown(event, tab) {
  ScheduleUI.handleScheduleTabKeydown(event, tab);
}

function renderScheduleList(list, elementId, emptyText, history) {
  const el = $(elementId);
  if (!list || !list.length) {
    el.innerHTML = `<div class="sch-empty">${emptyText}</div>`;
    return;
  }
  el.innerHTML = list.map(item => ScheduleUI.scheduleItemHtml(item, {
    history,
    escapeHtml: escHtml,
  })).join('');
}

let activePrivateMemos = [];
let completedPrivateMemos = [];

async function loadPrivateMemos() {
  const result = await ScheduleUI.loadPrivateMemoLists(api);
  if (result.active !== null) activePrivateMemos = result.active;
  if (result.completed !== null) completedPrivateMemos = result.completed;
  renderPrivateMemoList(activePrivateMemos, 'privateMemoList', '暂无备忘');
  renderPrivateMemoList(completedPrivateMemos, 'privateMemoCompleted', '暂无已完成备忘');
  $('privateMemoCompletedToggle').textContent = `已完成 ${completedPrivateMemos.length} ▾`;
  result.errors.forEach(error => console.error('loadPrivateMemos:', error));
}

function renderPrivateMemoList(list, elementId, emptyText) {
  const el = $(elementId);
  el.innerHTML = list.length
    ? list.map(item => ScheduleUI.privateMemoItemHtml(item, { escapeHtml: escHtml })).join('')
    : `<div class="private-memo-empty">${emptyText}</div>`;
}

function openPrivateMemoRecorder() {
  if (window.AionPrivateMemos?.openRecorder) {
    window.AionPrivateMemos.openRecorder();
  } else {
    alert('请在手机 App 中使用录音功能');
  }
}

function notifyNativeMemoChanged() {
  window.AionPrivateMemos?.refreshWidget?.();
}

async function completePrivateMemo(id) {
  await api('PATCH', `/api/private-memos/${encodeURIComponent(id)}`, { status: 'completed' });
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

async function restorePrivateMemo(id) {
  await api('PATCH', `/api/private-memos/${encodeURIComponent(id)}`, { status: 'active' });
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

async function editPrivateMemo(id) {
  const item = activePrivateMemos.find(memo => String(memo.id) === String(id));
  if (!item) return;
  const content = prompt('修改备忘', item.content || '');
  if (content === null || !content.trim()) return;
  await api('PATCH', `/api/private-memos/${encodeURIComponent(id)}`, { content: content.trim() });
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

async function deletePrivateMemo(id) {
  if (!confirm('确定删除这条备忘？')) return;
  await api('DELETE', `/api/private-memos/${encodeURIComponent(id)}`);
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

function toggleCompletedMemos() {
  $('privateMemoCompleted').hidden = !$('privateMemoCompleted').hidden;
}

async function addScheduleManual() {
  const content = $("schAddContent").value.trim();
  const triggerAt = $("schAddTime").value;
  const type = $("schAddType").value;
  if (!content || !triggerAt) { alert("请填写内容和时间"); return; }
  try {
    await api("POST", "/api/schedules", { type, trigger_at: triggerAt, content });
    $("schAddContent").value = "";
    $("schAddTime").value = "";
    switchScheduleTab("active");
    loadSchedules();
    showToast("✅ 已添加");
  } catch(e) { alert("添加失败：" + e.message); }
}

async function deleteSchedule(id) {
  if (!confirm("确定删除此日程？")) return;
  try {
    await api("DELETE", `/api/schedules/${id}`);
    loadSchedules();
  } catch(e) { alert("删除失败：" + e.message); }
}
</script>
</body>
</html>
