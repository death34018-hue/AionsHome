<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程管理</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/routine.css?v=20261110-mobile">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff8359">
<style>
.schedule-page { --sch-muted:#67584f; --sch-subtle:#76665d; --sch-accent-text:#9f3c19; --sch-accent-fg:#31170f; --sch-add-bg:#f47a33; --sch-add-fg:#32180e; --sch-alarm:#7a3d00; --sch-reminder:#31598c; --sch-monitor:#26634f; --sch-completed:#3159a5; --sch-cancelled:#a12649; --sch-solid:#fff; --sch-card-shadow:0 1px 2px rgba(74,59,50,.04),0 6px 20px rgba(74,59,50,.06); flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; padding:12px 14px 16px; gap:14px; padding-bottom:max(16px,env(safe-area-inset-bottom)); }
body[data-theme="dark"] .schedule-page { --sch-muted:#c5c9ef; --sch-subtle:#aeb5e4; --sch-accent-text:#c7baff; --sch-accent-fg:#160b32; --sch-add-bg:#ff8a3d; --sch-add-fg:#2b1308; --sch-alarm:#ffbf86; --sch-reminder:#a9c9ff; --sch-monitor:#8be7c9; --sch-completed:#adc5ff; --sch-cancelled:#ff9ab7; --sch-solid:#0b1033; --sch-card-shadow:none; }
.top-bar h2 { font-size:17px; }
.sch-history-button { display:flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text2); font-size:13px; cursor:pointer; }
.sch-history-button svg { width:16px; height:16px; }

/* 顶部分类 */
.sch-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; padding:4px; flex-shrink:0; border:1px solid var(--border); border-radius:14px; background:var(--surface2); }
.sch-tab { min-height:38px; border:0; border-radius:10px; background:transparent; color:var(--sch-muted); font-size:14px; font-weight:600; cursor:pointer; transition:background .18s ease,color .18s ease,box-shadow .18s ease; -webkit-tap-highlight-color:transparent; }
.sch-tab.active { background:var(--sch-solid); color:var(--sch-accent-text); font-weight:700; box-shadow:0 1px 4px color-mix(in srgb,var(--text) 12%,transparent); }
.sch-tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.sch-tab-panel { display:none; flex:1; min-height:0; }
.sch-tab-panel.active { display:flex; min-height:0; flex-direction:column; gap:12px; }
.sch-tab-panel[hidden] { display:none; }

/* 提醒列表 */
.sch-schedule-block { flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; }
.sch-list { flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--border); border-radius:18px; background:var(--surface); box-shadow:var(--sch-card-shadow); }
.sch-item { display:flex; align-items:flex-start; gap:10px; padding:12px 6px 12px 12px; border-bottom:1px solid var(--border); transition:background .16s ease; }
.sch-item:last-child { border-bottom:none; }
.sch-item:active { background:color-mix(in srgb,var(--sch-add-bg) 6%,transparent); }
.sch-icon { display:grid; place-items:center; width:36px; height:36px; flex-shrink:0; border-radius:12px; background:var(--surface2); font-size:17px; }
.sch-body { flex:1; min-width:0; padding-top:1px; }
.sch-origin { margin-right:2px; color:var(--sch-muted); font-size:12px; font-weight:600; white-space:nowrap; }
.sch-content { color:var(--text); font-size:14px; line-height:1.55; word-break:break-word; }
.sch-type,.sch-history-status { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; line-height:1.5; vertical-align:1px; }
.sch-type.alarm { background:color-mix(in srgb,var(--accent) 16%,var(--surface)); color:var(--sch-alarm); }
.sch-type.reminder { background:color-mix(in srgb,var(--text2) 13%,var(--surface)); color:var(--sch-reminder); }
.sch-type.monitor { background:color-mix(in srgb,var(--ai-bg) 38%,var(--surface)); color:var(--sch-monitor); }
.sch-time { display:inline-block; margin-top:6px; padding:2px 9px; border-radius:999px; background:var(--surface2); color:var(--sch-subtle); font-size:12px; font-variant-numeric:tabular-nums; }
.sch-history-item { padding:12px; }
.sch-history-item .sch-content { color:var(--text); font-size:14px; }
.sch-history-item .sch-origin,.sch-history-item .sch-time { font-size:11px; }
.sch-history-status { background:color-mix(in srgb,var(--accent) 12%,var(--surface)); color:var(--sch-completed); }
.sch-history-status.cancelled { background:color-mix(in srgb,var(--danger) 12%,var(--surface)); color:var(--sch-cancelled); }
.sch-del-btn { width:40px; height:40px; flex-shrink:0; margin:-2px 0 0; border:none; border-radius:12px; background:transparent; color:var(--danger); font-size:14px; cursor:pointer; }
.sch-del-btn:active { background:color-mix(in srgb,var(--danger) 12%,transparent); }
.sch-del-btn:focus-visible { outline:2px solid var(--danger); outline-offset:1px; }
.sch-empty { min-height:160px; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:var(--sch-muted); font-size:14px; line-height:1.8; }

/* 新增提醒 */
.sch-add-section { flex-shrink:0; margin-top:auto; padding:14px; border:1px solid var(--border); border-radius:18px; background:var(--surface); box-shadow:var(--sch-card-shadow); }
.sch-add-title { margin-bottom:10px; color:var(--text); font-size:14px; font-weight:700; }
.sch-add-section input[type="text"] { width:100%; min-height:46px; margin-bottom:8px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:var(--surface2); color:var(--text); font-size:15px; outline:none; box-sizing:border-box; }
.sch-add-row2 { display:flex; gap:8px; align-items:center; }
.sch-add-row2 input { flex:1; min-width:0; min-height:46px; padding:8px 10px; border:1px solid var(--border); border-radius:12px; background:var(--surface2); color:var(--text); font-size:14px; outline:none; }
.sch-add-row2 select { flex-shrink:0; min-height:46px; padding:8px 10px; border:1px solid var(--border); border-radius:12px; background:var(--surface2); color:var(--text); font-size:14px; }
.sch-add-row2 button { flex-shrink:0; min-height:46px; padding:8px 18px; border:none; border-radius:12px; background:var(--sch-add-bg); color:var(--sch-add-fg); font-size:14px; font-weight:700; white-space:nowrap; cursor:pointer; box-shadow:none; }
.sch-add-row2 button:active { filter:brightness(.95); }
.sch-add-section input:focus,.sch-add-section select:focus { border-color:var(--accent); outline:2px solid color-mix(in srgb,var(--accent) 18%,transparent); outline-offset:1px; }

/* 快捷备忘 */
.private-memo-section { flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; padding:0; border:0; background:transparent; box-shadow:none; }
.private-memo-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0; flex-shrink:0; }
.private-memo-title { margin:0; color:var(--text); font-size:16px; font-weight:700; }
.sch-section-note { margin-top:4px; color:var(--sch-muted); font-size:12px; line-height:1.5; }
.private-memo-scroll { flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:0 10px; border:1px solid var(--border); border-radius:18px; background:var(--surface); box-shadow:var(--sch-card-shadow); }
.private-memo-list { min-height:0; overflow:visible; }
.private-memo-item { display:flex; align-items:center; gap:4px; min-height:56px; padding:6px 0; border-top:1px solid var(--border); }
.private-memo-item:first-child { border-top:0; }
.private-memo-item.completed .private-memo-content { color:var(--sch-subtle); text-decoration:line-through; }
.private-memo-content { flex:1; min-width:0; color:var(--text); font-size:14px; line-height:1.55; word-break:break-word; }
.memo-check { position:relative; width:44px; height:44px; flex-shrink:0; padding:0; border:0; border-radius:50%; background:transparent; color:var(--sch-accent-fg); cursor:pointer; }
.memo-check::before { content:''; position:absolute; inset:11px; border:2px solid var(--sch-add-bg); border-radius:50%; }
.memo-check.completed::before { background:color-mix(in srgb,var(--sch-add-bg) 24%,transparent); }
.memo-action { width:40px; height:40px; flex-shrink:0; border:0; border-radius:12px; background:transparent; color:var(--sch-muted); font-size:15px; cursor:pointer; }
.memo-action:active { background:var(--surface2); }
.memo-action.danger { color:var(--danger); }
.private-memo-empty { padding:36px 8px; text-align:center; color:var(--sch-muted); font-size:14px; line-height:1.8; }
.private-memo-completed-toggle { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; margin-top:0; padding:0 4px; border:0; border-top:1px solid var(--border); background:transparent; color:var(--sch-muted); font-size:13px; text-align:left; cursor:pointer; }
.private-memo-completed-toggle::after { content:'›'; font-size:20px; line-height:1; transform:rotate(90deg); transition:transform .15s; }
.private-memo-completed-toggle[aria-expanded="true"]::after { transform:rotate(-90deg); }
.private-memo-compose { flex-shrink:0; margin-top:auto; display:flex; flex-direction:column; gap:10px; }
.private-memo-input-row { display:flex; gap:8px; }
.private-memo-input-row input { flex:1; min-width:0; min-height:46px; padding:0 16px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); font-size:15px; }
.private-memo-input-row button { min-height:46px; padding:0 20px; border:0; border-radius:999px; background:var(--sch-add-bg); color:var(--sch-add-fg); font-size:15px; font-weight:700; cursor:pointer; }
.private-memo-input-row button:disabled { opacity:.6; cursor:wait; }
.private-memo-input-row input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.private-memo-mic { display:flex; align-items:center; justify-content:center; width:64px; height:64px; min-height:44px; margin:0 auto; padding:0; border:0; border-radius:50%; background:transparent; box-shadow:none; color:var(--sch-accent-fg); cursor:pointer; }
.private-memo-mic img { display:block; width:64px; height:64px; object-fit:contain; }
.private-memo-mic:active { transform:scale(.94); }

.sub-page [hidden] { display:none !important; }
.schedule-page button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@media (hover:hover) {
  .sch-item:hover { background:color-mix(in srgb,var(--accent) 5%,transparent); }
  .sch-del-btn:hover { background:color-mix(in srgb,var(--danger) 10%,transparent); }
}
@media (max-width:420px) {
  .schedule-page { padding:10px 12px max(12px,env(safe-area-inset-bottom)); gap:12px; }
  .sch-add-row2 { flex-wrap:wrap; }
  .sch-add-row2 input { flex-basis:0; }
  .sch-add-row2 select { flex:0 0 108px; width:108px; }
  .sch-add-row2 button { flex-basis:100%; width:100%; min-height:44px; font-size:13px; border-radius:12px; }
  .sch-item { padding:12px 4px 12px 10px; }
  .private-memo-scroll { padding:0 6px; }
}
@media (max-height:640px) {
  .sch-schedule-block { overflow-y:auto; }
  .sch-schedule-block .sch-list { flex:0 0 180px; }
}
@media (prefers-reduced-motion:reduce) {
  .sch-tab,.sch-item,.private-memo-completed-toggle::after { transition:none; }
}
</style>
</head>
<body>
<div class="sub-page">
  <div class="top-bar">
    <button class="back-btn" id="schBackButton" data-custom-back onclick="leaveScheduleView()" aria-label="返回首页">⬅</button>
    <h2 id="schPageTitle" tabindex="-1">日程管理</h2>
    <button class="sch-history-button" id="schHistoryButton" onclick="openScheduleHistory()" aria-label="查看日程历史"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7"/><path d="M12 7v5l3 2"/></svg>历史</button>
    <label class="schedule-share"><span>共享作息</span><input id="scheduleShare" type="checkbox" role="switch" aria-label="向伴侣共享默认作息" disabled></label>
  </div>
  <div class="page-content schedule-page">
    <div class="sch-tabs" id="schTabs" role="tablist" aria-label="日程分类">
      <button class="sch-tab active" id="schTabRoutine" role="tab" tabindex="0" aria-selected="true" aria-controls="schPanelRoutine" onclick="switchScheduleTab('routine')" onkeydown="handleScheduleTabKeydown(event, 'routine')">日程表</button>
      <button class="sch-tab" id="schTabActive" role="tab" tabindex="-1" aria-selected="false" aria-controls="schPanelActive" onclick="switchScheduleTab('active')" onkeydown="handleScheduleTabKeydown(event, 'active')">提醒管理</button>
      <button class="sch-tab" id="schTabMemo" role="tab" tabindex="-1" aria-selected="false" aria-controls="schPanelMemo" onclick="switchScheduleTab('memo')" onkeydown="handleScheduleTabKeydown(event, 'memo')">快捷备忘</button>
    </div>
    <section class="sch-tab-panel active" id="schPanelRoutine" role="tabpanel" aria-labelledby="schTabRoutine">
      <div id="routineApp" class="routine-app">
        <div class="routine-calendar-nav">
          <button type="button" class="routine-control routine-arrow" data-routine-action="previous" aria-label="上一周">‹</button>
          <input type="date" id="routineDate" class="routine-date-input" aria-label="查看日期">
          <button type="button" class="routine-control routine-arrow" data-routine-action="next" aria-label="下一周">›</button>
          <button type="button" class="routine-control" data-routine-action="today">今天</button>
        </div>
        <div id="routineWeek" class="routine-week" aria-label="选择星期"></div>
        <div class="routine-heading-row">
          <h3 id="routineHeading">每日作息</h3>
          <div class="routine-tools">
            <button type="button" class="routine-control" id="routineMode" data-routine-action="mode" aria-pressed="false">编辑每周</button>
            <button type="button" class="routine-control routine-add" id="routineAdd" data-routine-action="add" aria-label="添加安排">＋</button>
          </div>
        </div>
        <div id="routineWeeklyTools" class="routine-weekly-tools" hidden>
          <span>每周循环</span>
          <button type="button" class="routine-control" data-routine-action="copy">复制到其他天</button>
        </div>
        <div id="routineScroll" class="routine-scroll"><div id="routineList" class="routine-list" data-empty="true"><div class="routine-empty">正在读取安排…</div></div></div>
        <div class="routine-error" hidden><span id="routineError" role="alert" hidden></span><button type="button" class="routine-control" data-routine-action="retry" id="routineRetry" hidden>重试</button></div>
        <button type="button" class="routine-control routine-reset" id="routineReset" data-routine-action="reset" hidden>恢复这天的每周安排</button>
        <dialog class="routine-dialog" id="routineEditor" aria-labelledby="routineEditorTitle">
          <form id="routineForm">
            <div class="routine-dialog-heading"><h3 id="routineEditorTitle">编辑安排</h3><button type="button" class="routine-control routine-close" data-routine-action="close-editor" aria-label="关闭编辑">×</button></div>
            <label class="routine-field"><span>安排</span><input class="routine-input" name="content" required maxlength="500" autocomplete="off" placeholder="准备做什么？"></label>
            <div class="routine-time-fields">
              <label class="routine-field"><span>开始</span><input class="routine-input" type="time" name="start" required></label>
              <label class="routine-field"><span>结束（可留空）</span><input class="routine-input" type="time" name="end"></label>
            </div>
            <label class="routine-field"><span>修改范围</span><select class="routine-input" name="scope"></select></label>
            <label id="routineRemindControl" class="routine-remind-choice"><input type="checkbox" name="remind">到点主动提醒</label>
            <label class="routine-field" id="routineRemindFields" hidden><span>提醒时间（仅这一天）</span><input class="routine-input" type="datetime-local" name="reminder_at"></label>
            <p class="routine-form-error" id="routineFormError" role="alert" hidden></p>
            <div class="routine-dialog-actions"><button type="submit" class="routine-control routine-save">保存</button><button type="button" class="routine-control" data-routine-action="close-editor">取消</button><button type="button" class="routine-control routine-delete" id="routineDelete" data-routine-action="delete">删除</button></div>
          </form>
        </dialog>
        <dialog class="routine-dialog" id="routineScheduleEditor" aria-labelledby="routineScheduleTitle">
          <form id="routineScheduleForm">
            <div class="routine-dialog-heading"><h3 id="routineScheduleTitle">临时日程与提醒</h3><button type="button" class="routine-control routine-close" data-routine-action="close-schedule" aria-label="关闭临时日程">×</button></div>
            <label class="routine-field"><span>提醒或记录</span><select name="record" class="routine-input"></select></label>
            <label class="routine-field"><span>内容</span><input name="content" class="routine-input" required maxlength="500"></label>
            <label class="routine-field"><span>类型</span><select name="type" class="routine-input"><option value="alarm">闹铃 · 到点主动提醒</option><option value="reminder">仅记录 · 聊天时参考</option><option value="monitor">监督 · 到点查看</option></select></label>
            <label class="routine-field"><span>提醒／记录时间</span><input name="trigger_at" type="datetime-local" class="routine-input" required></label>
            <label class="routine-field"><span>事情开始时间（未知可留空）</span><input name="event_at" type="datetime-local" class="routine-input"></label>
            <p class="routine-form-error" id="routineScheduleError" role="alert" hidden></p>
            <div class="routine-dialog-actions"><button type="submit" class="routine-control routine-save">保存</button><button type="button" class="routine-control" data-routine-action="close-schedule">取消</button><button type="button" class="routine-control routine-delete" id="routineScheduleDelete" data-routine-action="cancel-schedule">取消这条提醒</button></div>
          </form>
        </dialog>
        <dialog class="routine-dialog" id="routineCopyDialog" aria-labelledby="routineCopyTitle">
          <form id="routineCopyForm">
            <div class="routine-dialog-heading"><h3 id="routineCopyTitle">复制每周安排</h3><button type="button" class="routine-control routine-close" data-routine-action="close-copy" aria-label="关闭复制">×</button></div>
            <div class="routine-copy-days" id="routineCopyDays"></div>
            <p class="routine-copy-note">将替换所选星期的每周安排；复制后仍可分别修改。</p>
            <p class="routine-form-error" id="routineCopyError" role="alert" hidden></p>
            <div class="routine-dialog-actions"><button type="submit" class="routine-control routine-save">确认复制</button><button type="button" class="routine-control" data-routine-action="close-copy">取消</button></div>
          </form>
        </dialog>
      </div>
    </section>
    <section class="sch-tab-panel" id="schPanelActive" role="tabpanel" aria-labelledby="schTabActive" hidden>
        <div class="sch-schedule-block">
          <div class="sch-list" id="schList"><div class="sch-empty">暂无日程</div></div>
          <div class="sch-add-section">
            <div class="sch-add-title">添加一个新安排</div>
            <input type="text" id="schAddContent" placeholder="有什么需要提醒的事？" aria-label="日程内容">
            <div class="sch-add-row2">
              <input type="datetime-local" id="schAddTime" aria-label="提醒时间">
              <select id="schAddType" aria-label="日程类型">
                <option value="alarm">🔔 闹铃</option>
                <option value="reminder">📋 日程</option>
                <option value="monitor">👁 监督</option>
              </select>
              <button onclick="addScheduleManual()">添加日程</button>
            </div>
          </div>
        </div>
    </section>
    <section class="sch-tab-panel" id="schPanelMemo" role="tabpanel" aria-labelledby="schTabMemo" hidden>
        <section class="private-memo-section" aria-label="快捷备忘">
          <div class="private-memo-head">
            <div><h3 class="private-memo-title">随手记下</h3><p class="sch-section-note" id="privateMemoSummary">小事先记住，慢慢来</p></div>
          </div>
          <div class="private-memo-scroll">
          <div class="private-memo-list" id="privateMemoList"><div class="private-memo-empty">暂无备忘</div></div>
          <button class="private-memo-completed-toggle" id="privateMemoCompletedToggle" onclick="toggleCompletedMemos()" aria-expanded="false" aria-controls="privateMemoCompleted">已完成 0</button>
          <div class="private-memo-list" id="privateMemoCompleted" hidden></div>
          </div>
          <div class="private-memo-compose">
            <form class="private-memo-input-row" onsubmit="event.preventDefault(); addPrivateMemoManual();">
              <input type="text" id="privateMemoInput" placeholder="打字记一件小事…" aria-label="备忘内容" autocomplete="off" required>
              <button type="submit" id="privateMemoAddButton">添加</button>
            </form>
            <button class="private-memo-mic" onclick="openPrivateMemoRecorder()" aria-label="录音添加备忘"><img src="/public/小组件/录音.png" alt="" width="64" height="64"></button>
          </div>
        </section>
    </section>
    <section class="sch-tab-panel" id="schPanelHistory" aria-labelledby="schPageTitle" hidden>
      <div class="sch-list" id="schHistoryList"><div class="sch-empty">暂无历史记录</div></div>
    </section>
    </div>
</div>
<script src="/static/theme.js?v=theme-20260606"></script>
<script src="/static/common.js?v=20260905-schedule-back"></script>
<script src="/static/schedule-ui.js?v=20261107-unified"></script>
<script src="/static/routine-ui.js?v=20261107-routine-share"></script>
<script>
let scheduleRequestId = 0;
let memoRequestId = 0;
const routineUI = RoutineUI.mount($('routineApp'), { api, toast: showToast });
connectCommonWS(msg => {
  if (ScheduleUI.shouldReloadSchedules(msg)) loadSchedules();
  if (ScheduleUI.shouldReloadPrivateMemos(msg)) loadPrivateMemos();
  if (msg.type === 'routine_changed' || msg.type === 'schedule_changed') routineUI.reload();
}, { reconcile: () => Promise.all([loadSchedules(), loadPrivateMemos(), routineUI.reload()]) });

(async function init() {
  if (location.hash !== '#history') switchScheduleTab('routine');
  await Promise.all([loadSchedules(), loadPrivateMemos(), routineUI.reload()]);
})();

window.onAionPrivateMemosChanged = () => loadPrivateMemos();

async function loadSchedules() {
  const requestId = ++scheduleRequestId;
  const result = await ScheduleUI.loadScheduleLists(api);
  if (requestId !== scheduleRequestId) return;
  if (result.active !== null) {
    renderScheduleList(result.active, "schList", "暂无日程", false);
  }
  if (result.history !== null) {
    renderScheduleList(result.history, "schHistoryList", "暂无历史记录", true);
  }
  result.errors.forEach(item => {
    console.error(`loadSchedules(${item.list}):`, item.error);
  });
}

function switchScheduleTab(tab) {
  ScheduleUI.selectScheduleTab(tab);
  if (tab === 'routine') routineUI.onVisible();
}

function handleScheduleTabKeydown(event, tab) {
  const selected = ScheduleUI.handleScheduleTabKeydown(event, tab);
  if (selected === 'routine') routineUI.onVisible();
}

function openScheduleHistory() {
  history.pushState({ scheduleHistory: true }, '', '#history');
  syncScheduleHistoryView();
}

function leaveScheduleView() {
  if (location.hash !== '#history') { navigateSubPageBack(); return; }
  if (history.state?.scheduleHistory) {
    history.back();
  } else {
    history.replaceState(null, '', location.pathname + location.search);
    syncScheduleHistoryView();
  }
}

function syncScheduleHistoryView() {
  const isHistory = location.hash === '#history';
  switchScheduleTab(isHistory ? 'history' : 'active');
  $(isHistory ? 'schPageTitle' : 'schHistoryButton').focus();
}

window.addEventListener('popstate', syncScheduleHistoryView);
if (location.hash === '#history') syncScheduleHistoryView();

function renderScheduleList(list, elementId, emptyText, history) {
  const el = $(elementId);
  if (!list || !list.length) {
    el.innerHTML = `<div class="sch-empty">${emptyText}</div>`;
    return;
  }
  el.innerHTML = list.map(item => ScheduleUI.scheduleItemHtml(item, {
    history,
    escapeHtml: escHtml,
  })).join('');
}

let activePrivateMemos = [];
let completedPrivateMemos = [];

async function loadPrivateMemos() {
  const requestId = ++memoRequestId;
  const result = await ScheduleUI.loadPrivateMemoLists(api);
  if (requestId !== memoRequestId) return;
  if (result.active !== null) activePrivateMemos = result.active;
  if (result.completed !== null) completedPrivateMemos = result.completed;
  renderPrivateMemoList(activePrivateMemos, 'privateMemoList', '暂无备忘');
  renderPrivateMemoList(completedPrivateMemos, 'privateMemoCompleted', '暂无已完成备忘');
  $('privateMemoCompletedToggle').textContent = `已完成 ${completedPrivateMemos.length}`;
  $('privateMemoSummary').textContent = activePrivateMemos.length
    ? `${activePrivateMemos.length} 件小事，快捷备忘不会同步给AI伴侣哦` : '小事先记住，慢慢来';
  result.errors.forEach(error => console.error('loadPrivateMemos:', error));
}

function renderPrivateMemoList(list, elementId, emptyText) {
  const el = $(elementId);
  el.innerHTML = list.length
    ? list.map(item => ScheduleUI.privateMemoItemHtml(item, { escapeHtml: escHtml })).join('')
    : `<div class="private-memo-empty">${emptyText}</div>`;
}

function openPrivateMemoRecorder() {
  if (window.AionPrivateMemos?.openRecorder) {
    window.AionPrivateMemos.openRecorder();
  } else {
    alert('请在手机 App 中使用录音功能');
  }
}

function notifyNativeMemoChanged() {
  window.AionPrivateMemos?.refreshWidget?.();
}

async function addPrivateMemoManual() {
  const input = $('privateMemoInput');
  const button = $('privateMemoAddButton');
  const content = input.value.trim();
  if (!content || button.disabled) return;
  button.disabled = true;
  try {
    await api('POST', '/api/private-memos', { content, source: 'app' });
    input.value = '';
    notifyNativeMemoChanged();
    await loadPrivateMemos();
    $('privateMemoList').parentElement.scrollTop = 0;
    showToast('✅ 已添加备忘');
  } catch (error) {
    alert('添加失败：' + error.message);
  } finally {
    button.disabled = false;
  }
}

async function completePrivateMemo(id) {
  await api('PATCH', `/api/private-memos/${encodeURIComponent(id)}`, { status: 'completed' });
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

async function restorePrivateMemo(id) {
  await api('PATCH', `/api/private-memos/${encodeURIComponent(id)}`, { status: 'active' });
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

async function editPrivateMemo(id) {
  const item = activePrivateMemos.find(memo => String(memo.id) === String(id));
  if (!item) return;
  const content = prompt('修改备忘', item.content || '');
  if (content === null || !content.trim()) return;
  await api('PATCH', `/api/private-memos/${encodeURIComponent(id)}`, { content: content.trim() });
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

async function deletePrivateMemo(id) {
  if (!confirm('确定删除这条备忘？')) return;
  await api('DELETE', `/api/private-memos/${encodeURIComponent(id)}`);
  notifyNativeMemoChanged();
  loadPrivateMemos();
}

function toggleCompletedMemos() {
  $('privateMemoCompleted').hidden = !$('privateMemoCompleted').hidden;
  $('privateMemoCompletedToggle').setAttribute('aria-expanded', String(!$('privateMemoCompleted').hidden));
}

async function addScheduleManual() {
  const content = $("schAddContent").value.trim();
  const triggerAt = $("schAddTime").value;
  const type = $("schAddType").value;
  if (!content || !triggerAt) { alert("请填写内容和时间"); return; }
  try {
    await api("POST", "/api/schedules", { type, trigger_at: triggerAt, content });
    $("schAddContent").value = "";
    $("schAddTime").value = "";
    switchScheduleTab("active");
    loadSchedules();
    showToast("✅ 已添加");
  } catch(e) { alert("添加失败：" + e.message); }
}

async function deleteSchedule(id) {
  if (!confirm("确定删除此日程？")) return;
  try {
    await api("DELETE", `/api/schedules/${id}`);
    loadSchedules();
  } catch(e) { alert("删除失败：" + e.message); }
}
</script>
</body>
</html>
