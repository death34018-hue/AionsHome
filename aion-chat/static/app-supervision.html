<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe9">
  <title>应用监管</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4efe9;
      --card: rgba(255,255,255,.82);
      --ink: #292323;
      --muted: #766c69;
      --line: #ddd2cb;
      --wine: #8e3340;
      --wine-dark: #65232d;
      --rose: #f6dde0;
      --green: #2f765b;
      --amber: #a56827;
      --shadow: 0 14px 34px rgba(75,53,48,.10);
      font-family: Inter, ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% -10%, rgba(142,51,64,.14), transparent 34%),
        linear-gradient(180deg, #f9f5f0 0%, var(--paper) 42%, #eee6df 100%);
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .shell {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 20px) 16px
        calc(env(safe-area-inset-bottom) + 42px);
    }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .back-link {
      display: inline-flex; align-items: center; min-height: 36px; margin-bottom: 8px;
      padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--wine-dark); background: rgba(255,255,255,.62);
      font-size: 13px; font-weight: 800; text-decoration: none;
    }
    .back-link:active { transform: translateY(1px); }
    .eyebrow { color: var(--wine); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 7px 0 5px; font: 800 clamp(30px, 9vw, 46px)/1.02 Georgia, "Songti SC", serif; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #aaa; box-shadow: 0 0 0 6px rgba(0,0,0,.04); margin-top: 7px; }
    .status-dot.ok { background: var(--green); }
    .status-dot.warn { background: var(--amber); }
    .stack { display: grid; gap: 14px; margin-top: 22px; }
    .card {
      border: 1px solid rgba(123,93,84,.16);
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: 22px;
      padding: 18px;
      backdrop-filter: blur(12px);
    }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 18px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .spread { justify-content: space-between; }
    .grid { display: grid; gap: 12px; }
    .group-card { border-top: 1px solid var(--line); padding: 15px 0 2px; }
    .group-card:first-child { border-top: 0; padding-top: 2px; }
    .group-title { display: flex; gap: 10px; align-items: center; font-weight: 800; }
    .lock-mark { color: var(--wine); font-size: 22px; }
    .badge { display: inline-flex; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; background: #ece5e0; color: var(--muted); }
    .badge.locked { color: #fff; background: var(--wine); }
    .badge.temp { color: var(--green); background: #dcefe7; }
    .metrics { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin: 12px 0; }
    .metric { border-radius: 14px; padding: 10px; background: rgba(239,232,226,.72); }
    .metric small { display: block; color: var(--muted); margin-bottom: 4px; }
    .metric strong { font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { border: 0; border-radius: 12px; padding: 10px 13px; font-weight: 750; color: var(--ink); background: #e9e0da; cursor: pointer; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { color: #fff; background: var(--wine); }
    .btn.danger { color: var(--wine-dark); background: var(--rose); }
    .btn.ghost { border: 1px solid var(--line); background: transparent; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .field { display: grid; gap: 6px; }
    label { color: var(--muted); font-size: 12px; font-weight: 750; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
      background: rgba(255,255,255,.82); padding: 11px 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--wine); box-shadow: 0 0 0 3px rgba(142,51,64,.10); }
    textarea { min-height: 78px; resize: vertical; }
    .app-results { max-height: 260px; overflow: auto; display: grid; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.48); }
    .app-result { width: 100%; border: 0; border-radius: 10px; padding: 10px; text-align: left; color: var(--ink); background: rgba(255,255,255,.76); cursor: pointer; }
    .app-result strong, .app-result small { display: block; }
    .app-result small { margin-top: 3px; color: var(--muted); font: 11px/1.35 ui-monospace, monospace; word-break: break-all; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 38px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; border-radius: 999px; padding: 7px 9px 7px 11px; background: #ece5e0; }
    .chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip button { border: 0; padding: 0 3px; color: var(--wine-dark); background: transparent; cursor: pointer; font-weight: 900; }
    .advanced { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .advanced summary { color: var(--muted); font-size: 12px; font-weight: 750; cursor: pointer; }
    .advanced .field { margin-top: 10px; }
    .debug-panel > summary {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; list-style: none;
    }
    .debug-panel > summary::-webkit-details-marker { display: none; }
    .debug-panel > summary strong { font-size: 16px; }
    .debug-panel > summary span { color: var(--muted); font-size: 12px; }
    .debug-panel > summary::after { content: "＋"; color: var(--wine); font-weight: 900; }
    .debug-panel[open] > summary::after { content: "－"; }
    .debug-panel-body { margin-top: 16px; }
    .check { display: flex; align-items: center; gap: 8px; }
    .check input { width: auto; accent-color: var(--wine); }
    .check label { color: var(--ink); }
    .notice { color: var(--muted); line-height: 1.6; }
    .notice.error { color: var(--wine-dark); background: var(--rose); }
    .lock-list { display: grid; gap: 10px; }
    .active-lock { border-left: 4px solid var(--wine); padding: 10px 12px; border-radius: 10px; background: #fff6f5; }
    .active-lock strong { display: block; margin-bottom: 4px; }
    .hidden { display: none !important; }
    .hold {
      width: 100%; min-height: 64px; border: 2px solid var(--wine); border-radius: 18px;
      color: var(--wine-dark); background: var(--rose); font-weight: 900; touch-action: none;
    }
    .hold.active { color: #fff; background: var(--wine); }
    .progress { height: 7px; background: #eadfda; border-radius: 999px; overflow: hidden; }
    .progress span { display: block; height: 100%; width: 0; background: var(--wine); transition: width .18s linear; }
    pre { margin: 0; max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.55 ui-monospace, monospace; color: #594e4c; }
    .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); padding: 11px 15px; border-radius: 999px; color: #fff; background: #2f2929; box-shadow: var(--shadow); z-index: 9; max-width: calc(100vw - 32px); text-align: center; }
    @media (max-width: 520px) {
      .shell { width: 100%; padding-left: 12px; padding-right: 12px; }
      .stack, .grid { grid-template-columns: 1fr; }
      .card { border-radius: 19px; padding: 16px; }
      .desktop-two { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <a class="back-link" href="/">‹ 返回</a>
        <div class="eyebrow">LOCAL · PHONE AUTHORITY</div>
        <h1>应用监管</h1>
        <p class="subtitle">计时、锁定与诊断都保存在这台手机上。</p>
      </div>
      <span id="statusDot" class="status-dot" aria-label="连接状态"></span>
    </header>

    <div id="unavailable" class="card notice error hidden"></div>

    <div class="stack">
      <section id="activeLocks" class="card hidden">
        <div class="section-head"><div><h2>当前锁定</h2><p>临时解锁会覆盖原锁，但不会删除它。</p></div></div>
        <div id="activeLockList" class="lock-list"></div>
      </section>

      <section id="deviceLockStatus" class="card">
        <div class="section-head">
          <div><h2>整机专注</h2><p>由 AI 决定是否开启；本应用与来电始终可用。</p></div>
          <span id="deviceLockBadge" class="badge">正常</span>
        </div>
        <div id="deviceLockDetails" class="notice">当前没有整机锁定。</div>
      </section>

      <section class="card">
        <div class="section-head">
          <div><h2>受管应用</h2><p id="runtimeStatus">读取手机状态…</p></div>
          <div class="actions"><div class="check"><input id="featureEnabled" type="checkbox"><label for="featureEnabled">启用</label></div><button id="addGroup" class="btn primary">＋ 添加</button></div>
        </div>
        <div id="managedGroups"></div>
      </section>

      <section id="groupEditor" class="card hidden">
        <div class="section-head"><div><h2>应用组设置</h2><p>同组包名共享一套计时与锁。</p></div></div>
        <form id="groupForm" class="grid">
          <input id="groupId" type="hidden">
          <div class="field">
            <label for="appSearch">搜索已安装应用</label>
            <input id="appSearch" type="search" placeholder="输入应用名称或包名" autocomplete="off">
            <div id="appResults" class="app-results" aria-live="polite"></div>
          </div>
          <div class="field"><label>已选择应用</label><div id="selectedApps" class="chips"></div></div>
          <div class="field"><label for="displayName">显示名称</label><input id="displayName" required maxlength="60"></div>
          <details class="advanced">
            <summary>高级包名设置（仅不同包名的克隆应用需要）</summary>
            <div class="field"><label for="advancedPackages">额外包名（每行一个）</label><textarea id="advancedPackages" spellcheck="false" placeholder="普通应用无需填写"></textarea></div>
          </details>
          <div class="grid desktop-two" style="grid-template-columns:1fr 1fr">
            <div class="field"><label for="idleMinutes">空闲重置（分钟）</label><input id="idleMinutes" type="number" min="1" value="30" required></div>
            <div class="field"><label for="checkpointsMinutes">检查点（逗号分隔分钟）</label><input id="checkpointsMinutes" value="20, 40" required></div>
          </div>
          <div class="field"><label for="roleId">负责角色</label><select id="roleId" required></select></div>
          <div class="check"><input id="monitored" type="checkbox" checked><label for="monitored">加入计时监管</label></div>
          <div class="actions"><button class="btn primary" type="submit">保存</button><button id="cancelEdit" class="btn ghost" type="button">取消</button></div>
        </form>
      </section>

      <details id="emergencyPanel" class="card debug-panel">
        <summary><strong>紧急解锁</strong><span>通常无需使用</span></summary>
        <div class="grid debug-panel-body">
          <div class="field"><label for="emergencyGroup">锁定目标</label><select id="emergencyGroup"></select></div>
          <button id="holdButton" class="hold">按住 8 秒开始</button>
          <div class="progress"><span id="holdProgress"></span></div>
          <div class="field"><label for="emergencyReason">确认理由</label><textarea id="emergencyReason" placeholder="完成长按后填写" disabled></textarea></div>
          <div class="actions"><button id="submitReason" class="btn" disabled>提交理由并等待</button><button id="confirmEmergency" class="btn danger" disabled>确认解除</button></div>
          <div id="emergencyStatus" class="notice">尚未开始。</div>
        </div>
      </details>

      <details id="diagnosticsPanel" class="card debug-panel">
        <summary><strong>48 小时诊断</strong><span>通常无需使用</span></summary>
        <div class="debug-panel-body">
          <div class="actions" style="justify-content:flex-end;margin-bottom:12px"><button id="refresh" class="btn ghost">刷新</button></div>
          <pre id="diagnostics">暂无记录</pre>
        </div>
      </details>

      <details id="debugPanel" class="card debug-panel">
        <summary><strong>V1 本地调试</strong><span>通常无需使用</span></summary>
        <div class="grid debug-panel-body">
          <div class="field"><label for="debugGroup">应用组</label><select id="debugGroup"></select></div>
          <div class="grid desktop-two" style="grid-template-columns:1fr 1fr">
            <div class="field"><label for="debugMinutes">持续分钟</label><input id="debugMinutes" type="number" min="1" max="120" value="1"></div>
            <div class="field"><label for="debugRole">下令角色</label><select id="debugRole"></select></div>
          </div>
          <div class="field"><label for="debugMessage">提示语</label><input id="debugMessage" value="现在先离开一会儿。"></div>
          <div class="actions">
            <button id="setLock" class="btn danger">设置锁定</button>
            <button id="setTempUnlock" class="btn">临时解锁</button>
            <button id="removeLock" class="btn ghost">移除锁定</button>
          </div>
        </div>
      </details>
    </div>
  </main>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="/static/app-supervision-ui.js?v=20260719-4"></script>
  <script>
    window.addEventListener('aion-client-update-ready', () => location.reload());

    const state = { snapshot: null, roles: [], apps: [], selectedPackages: [], gateTimer: null };
    const $ = id => document.getElementById(id);

    function nativeCall(method, ...args) {
      const bridge = window.AionAppSupervision;
      if (!bridge || typeof bridge[method] !== 'function') {
        throw new Error('请在手机应用中打开监管页面');
      }
      const result = JSON.parse(bridge[method](...args));
      if (result && result.ok === false) throw new Error(result.error || '手机端操作失败');
      return result;
    }

    function showToast(message) {
      $('toast').textContent = message;
      $('toast').classList.remove('hidden');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => $('toast').classList.add('hidden'), 2200);
    }

    const formatDuration = ms => {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60;
      return h ? `${h}时 ${m}分` : `${m}分 ${String(s).padStart(2,'0')}秒`;
    };
    const roleLabel = id => state.roles.find(role => role.id === id)?.label || id || '未配置';
    const groupById = id => state.snapshot?.groups?.find(group => group.groupId === id);

    async function loadRoles() {
      const response = await fetch('/api/app-supervision/roles', { cache: 'no-store' });
      if (!response.ok) throw new Error('角色目录读取失败');
      state.roles = (await response.json()).roles || [];
      for (const id of ['roleId','debugRole']) {
        $(id).innerHTML = state.roles.map(role => `<option value="${escapeHtml(role.id)}">${escapeHtml(role.label)}</option>`).join('');
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function render() {
      const snap = state.snapshot || { groups: [], logs: [] };
      const device = snap.deviceLock || { effectiveState: 'NORMAL', lock: null, temporaryUnlock: null };
      $('statusDot').className = `status-dot ${snap.recoveryState === 'ACTIVE' ? 'ok' : 'warn'}`;
      $('runtimeStatus').textContent = `${snap.featureEnabled ? '监管已启用' : '监管已暂停'} · ${snap.recoveryState || 'UNKNOWN'}`;
      $('featureEnabled').checked = Boolean(snap.featureEnabled);

      const active = snap.groups.filter(group => group.effectiveState === 'LOCKED' || group.effectiveState === 'TEMPORARILY_UNLOCKED');
      const deviceActive = device.effectiveState === 'LOCKED' || device.effectiveState === 'TEMPORARILY_UNLOCKED';
      $('activeLocks').classList.toggle('hidden', active.length === 0 && !deviceActive);
      const deviceActiveHtml = deviceActive ? (() => {
        const directive = device.effectiveState === 'TEMPORARILY_UNLOCKED' ? device.temporaryUnlock : device.lock;
        return `<div class="active-lock"><strong>整机专注</strong><span>${device.effectiveState === 'LOCKED' ? '🔒 已锁定' : '临时解锁中'} · ${escapeHtml(roleLabel(directive?.roleId))}</span><br><small>${escapeHtml(directive?.message || '')}</small></div>`;
      })() : '';
      $('activeLockList').innerHTML = deviceActiveHtml + active.map(group => {
        const directive = group.effectiveState === 'TEMPORARILY_UNLOCKED' ? group.temporaryUnlock : group.lock;
        return `<div class="active-lock"><strong>${escapeHtml(group.displayName)}</strong><span>${group.effectiveState === 'LOCKED' ? '🔒 已锁定' : '临时解锁中'} · ${escapeHtml(roleLabel(directive?.roleId))}</span><br><small>${escapeHtml(directive?.message || '')}</small></div>`;
      }).join('');

      const deviceDirective = device.effectiveState === 'TEMPORARILY_UNLOCKED'
        ? device.temporaryUnlock : device.lock;
      $('deviceLockBadge').className = `badge ${device.effectiveState === 'LOCKED' ? 'locked' : device.effectiveState === 'TEMPORARILY_UNLOCKED' ? 'temp' : ''}`;
      $('deviceLockBadge').textContent = device.effectiveState === 'LOCKED'
        ? '锁定中' : device.effectiveState === 'TEMPORARILY_UNLOCKED' ? '临时解锁' : '正常';
      $('deviceLockDetails').innerHTML = deviceActive
        ? `负责角色：<strong>${escapeHtml(roleLabel(deviceDirective?.roleId))}</strong><br>剩余时间：<strong>${formatDuration(Math.max(0, (deviceDirective?.deadlineWallMs || 0) - Date.now()))}</strong><br>${escapeHtml(deviceDirective?.message || '')}`
        : '当前没有整机锁定。';

      $('managedGroups').innerHTML = snap.groups.length ? snap.groups.map(group => {
        const next = (group.checkpointsMinutes || []).map(v => v * 60000).find(v => v > group.roundUsageMs);
        const badge = group.effectiveState === 'LOCKED' ? '<span class="badge locked">锁定</span>' : group.effectiveState === 'TEMPORARILY_UNLOCKED' ? '<span class="badge temp">临时解锁</span>' : '<span class="badge">正常</span>';
        return `<article class="group-card"><div class="spread row"><div class="group-title"><span class="lock-mark">${group.effectiveState === 'LOCKED' ? '🔒' : '◉'}</span>${escapeHtml(group.displayName)}</div>${badge}</div><div class="metrics"><div class="metric"><small>本轮累计</small><strong>${formatDuration(group.roundUsageMs)}</strong></div><div class="metric"><small>下个检查点</small><strong>${next ? formatDuration(next) : '已完成'}</strong></div><div class="metric"><small>空闲重置</small><strong>${group.idleMinutes} 分钟</strong></div><div class="metric"><small>负责角色</small><strong>${escapeHtml(roleLabel(group.roleId))}</strong></div></div><div class="actions"><button class="btn ghost" data-edit="${escapeHtml(group.groupId)}">编辑</button><button class="btn danger" data-delete="${escapeHtml(group.groupId)}">删除应用组</button></div></article>`;
      }).join('') : '<p class="notice">还没有应用组。添加后，包名别名会共享同一计时。</p>';

      const groupOptions = snap.groups.map(group => `<option value="${escapeHtml(group.groupId)}">${escapeHtml(group.displayName)}</option>`).join('');
      $('debugGroup').innerHTML = groupOptions;
      const deviceOption = device.lock && device.lock.deadlineWallMs > Date.now()
        ? '<option value="__device__">整机专注</option>' : '';
      const lockedOptions = deviceOption + active.filter(group => group.lock).map(group => `<option value="${escapeHtml(group.groupId)}">${escapeHtml(group.displayName)}</option>`).join('');
      $('emergencyGroup').innerHTML = lockedOptions || '<option value="">当前没有锁定</option>';
      $('diagnostics').textContent = snap.logs?.length ? JSON.stringify(snap.logs, null, 2) : '暂无记录';
      bindGroupActions();
    }

    async function refresh() {
      try {
        state.snapshot = nativeCall('getSnapshot');
        $('unavailable').classList.add('hidden');
        render();
      } catch (error) {
        $('unavailable').textContent = error.message;
        $('unavailable').classList.remove('hidden');
        $('statusDot').className = 'status-dot warn';
      }
    }

    function bindGroupActions() {
      document.querySelectorAll('[data-edit]').forEach(button => button.onclick = () => openEditor(groupById(button.dataset.edit)));
      document.querySelectorAll('[data-delete]').forEach(button => button.onclick = () => deleteGroup(button.dataset.delete));
    }

    async function deleteGroup(groupId) {
      const group = groupById(groupId);
      if (!group) return;
      if (group.lock && group.lock.deadlineWallMs > Date.now()) {
        showToast('该应用组仍有有效锁，请先解除锁定');
        return;
      }
      if (!window.confirm(`确定删除“${group.displayName}”应用组吗？累计时间也会清除。`)) return;
      try {
        nativeCall('removeGroup', group.groupId);
        await refresh();
        showToast('应用组已删除');
      } catch (error) { showToast(error.message); }
    }

    function renderAppPicker() {
      const visible = AppSupervisionUi.filterApps(state.apps, $('appSearch').value)
        .filter(app => !state.selectedPackages.includes(app.packageName))
        .slice(0, 100);
      $('appResults').innerHTML = visible.length ? visible.map(app =>
        `<button class="app-result" type="button" data-select-package="${escapeHtml(app.packageName)}"><strong>${escapeHtml(app.label)}</strong><small>${escapeHtml(app.packageName)}</small></button>`
      ).join('') : '<div class="notice">没有匹配的已安装应用</div>';
      document.querySelectorAll('[data-select-package]').forEach(button => {
        button.onclick = () => selectPackage(button.dataset.selectPackage);
      });

      $('selectedApps').innerHTML = state.selectedPackages.length ? state.selectedPackages.map(packageName => {
        const app = state.apps.find(item => item.packageName === packageName);
        return `<span class="chip"><span>${escapeHtml(app?.label || packageName)}</span><button type="button" aria-label="移除 ${escapeHtml(app?.label || packageName)}" data-remove-package="${escapeHtml(packageName)}">×</button></span>`;
      }).join('') : '<span class="notice">尚未选择应用</span>';
      document.querySelectorAll('[data-remove-package]').forEach(button => {
        button.onclick = () => removeSelectedPackage(button.dataset.removePackage);
      });
    }

    function selectPackage(packageName) {
      const app = state.apps.find(item => item.packageName === packageName);
      if (!app || state.selectedPackages.includes(packageName)) return;
      state.selectedPackages.push(packageName);
      if (!$('displayName').value.trim()) $('displayName').value = app.label;
      $('appSearch').value = '';
      renderAppPicker();
    }

    function removeSelectedPackage(packageName) {
      state.selectedPackages = state.selectedPackages.filter(value => value !== packageName);
      renderAppPicker();
    }

    function openEditor(group = null) {
      $('groupId').value = group?.groupId || AppSupervisionUi.createGroupId(globalThis.crypto);
      $('displayName').value = group?.displayName || '';
      const packages = AppSupervisionUi.splitKnownPackages(group?.packageNames || [], state.apps);
      state.selectedPackages = packages.selected;
      $('advancedPackages').value = packages.aliases.join('\n');
      $('appSearch').value = '';
      $('idleMinutes').value = group?.idleMinutes || 30;
      $('checkpointsMinutes').value = (group?.checkpointsMinutes || [20,40]).join(', ');
      $('roleId').value = group?.roleId || state.roles[0]?.id || '';
      $('monitored').checked = group?.monitored ?? true;
      renderAppPicker();
      $('groupEditor').classList.remove('hidden');
      $('groupEditor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('groupForm').onsubmit = async event => {
      event.preventDefault();
      const checkpoints = $('checkpointsMinutes').value.split(',').map(v => Number(v.trim())).filter(Number.isFinite).filter(v => v > 0).sort((a,b) => a-b);
      const packageNames = AppSupervisionUi.mergePackages(state.selectedPackages, $('advancedPackages').value);
      if (!packageNames.length) { showToast('请至少选择一个应用'); return; }
      const payload = { groupId: $('groupId').value, displayName: $('displayName').value.trim(), packageNames, monitored: $('monitored').checked, idleMinutes: Number($('idleMinutes').value), checkpointsMinutes: checkpoints, roleId: $('roleId').value };
      try { nativeCall('upsertGroup', JSON.stringify(payload)); $('groupEditor').classList.add('hidden'); await refresh(); showToast('应用组已保存'); } catch (error) { showToast(error.message); }
    };
    $('addGroup').onclick = () => openEditor();
    $('cancelEdit').onclick = () => $('groupEditor').classList.add('hidden');
    $('appSearch').oninput = renderAppPicker;

    function debugPayload() { return JSON.stringify({ groupId: $('debugGroup').value, minutes: Number($('debugMinutes').value), roleId: $('debugRole').value, message: $('debugMessage').value, commandId: `local-${Date.now()}-${AppSupervisionUi.createGroupId(globalThis.crypto)}` }); }
    $('setLock').onclick = async () => { try { nativeCall('debugSetLock', debugPayload()); await refresh(); } catch(e) { showToast(e.message); } };
    $('setTempUnlock').onclick = async () => { try { nativeCall('debugSetTemporaryUnlock', debugPayload()); await refresh(); } catch(e) { showToast(e.message); } };
    $('removeLock').onclick = async () => { try { nativeCall('debugRemoveLock', $('debugGroup').value); await refresh(); } catch(e) { showToast(e.message); } };
    $('refresh').onclick = refresh;
    $('featureEnabled').onchange = async () => { try { nativeCall('setFeatureEnabled', $('featureEnabled').checked); await refresh(); } catch(e) { showToast(e.message); } };

    function emergencyPayload(action, extra = {}) { const groupId = $('emergencyGroup').value; return JSON.stringify({ action, groupId, targetGroupId: groupId, ...extra }); }
    function applyGate(gate) {
      if (!gate) return;
      const labels = { HOLDING:'继续按住', REASON_REQUIRED:'长按完成，请填写理由。', WAITING:`等待 ${Math.ceil(gate.remainingDelayMs/1000)} 秒`, READY:'等待完成，可以确认解除。', COMPLETED:'锁定已解除。', CANCELLED:`流程已取消：${gate.error || ''}` };
      $('emergencyStatus').textContent = labels[gate.phase] || gate.phase;
      $('holdProgress').style.width = `${Math.min(100, (gate.heldMs || 0) / 80)}%`;
      const reasonReady = gate.phase === 'REASON_REQUIRED';
      $('emergencyReason').disabled = !reasonReady;
      $('submitReason').disabled = !reasonReady;
      $('confirmEmergency').disabled = gate.phase !== 'READY';
      if (gate.phase === 'WAITING') startGatePolling(); else if (gate.phase !== 'READY') stopGatePolling();
    }
    function startGatePolling() { stopGatePolling(); state.gateTimer = setInterval(() => { try { const result = nativeCall('emergencyAction', emergencyPayload('status')); applyGate(result.gate); } catch(e) { stopGatePolling(); } }, 500); }
    function stopGatePolling() { clearInterval(state.gateTimer); state.gateTimer = null; }
    const emergencyHold = AppSupervisionUi.createEmergencyHoldController({
      begin: () => nativeCall('emergencyAction', emergencyPayload('begin')).gate,
      sample: holding => nativeCall('emergencyAction', emergencyPayload('hold', { holding })).gate,
      schedule: (callback, intervalMs) => setInterval(callback, intervalMs),
      cancelSchedule: timer => clearInterval(timer),
      render: applyGate,
      setActive: active => $('holdButton').classList.toggle('active', active),
      onError: error => showToast(error.message),
    });
    $('holdButton').addEventListener('pointerdown', event => {
      event.preventDefault();
      emergencyHold.start(event.pointerId);
    });
    window.addEventListener('pointerup', event => emergencyHold.release(event.pointerId));
    window.addEventListener('pointercancel', event => emergencyHold.cancel(event.pointerId));
    $('submitReason').onclick = () => { try { applyGate(nativeCall('emergencyAction', emergencyPayload('reason', {reason:$('emergencyReason').value})).gate); } catch(e) { showToast(e.message); } };
    $('confirmEmergency').onclick = async () => { try { const result = nativeCall('emergencyAction', emergencyPayload('confirm')); applyGate(result.gate); await refresh(); } catch(e) { showToast(e.message); } };

    async function init() {
      try {
        await loadRoles();
        nativeCall('setRoleCatalog', JSON.stringify({ roles: state.roles }));
        const appsResult = nativeCall('listLaunchableApps');
        state.apps = appsResult.apps || [];
      } catch (error) {
        $('unavailable').textContent = error.message;
        $('unavailable').classList.remove('hidden');
      }
      await refresh();
      setInterval(() => { if (!emergencyHold.isActive()) refresh(); }, 5000);
    }
    init();
  </script>
</body>
</html>
